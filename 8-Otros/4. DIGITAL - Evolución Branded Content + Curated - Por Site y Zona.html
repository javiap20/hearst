<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGITAL - Seguimiento por Áreas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --card:#111827;
  --text:#e5e7eb;
  --base:#38bdf8;  
  --comp:#f59e0b;  
  --prod-color:#f472b6; 
  --neg:#f87171;   
  --ok-green: #34d399;
  --input-bg: #1f2933;
}

body{
  margin:0;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  background:linear-gradient(180deg,#020617,#0f172a);
  color:var(--text);
  padding-top: 20px;
}

h1 { text-align: center; font-size: 1.6rem; margin-bottom: 30px; color: #fff; }
.container{ max-width:1400px; margin:auto; padding:0 20px; }

.card{
  background:rgba(17,24,39,.9); border-radius:14px;
  padding:20px; margin-bottom:20px; border: 1px solid #1f2937;
}

.filter-row { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
.year-selector { min-width: 160px; }

.label-year { color: var(--comp) !important; font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.9em; }
.label-prod { color: var(--prod-color) !important; font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.9em; }

.year-selector select { background: var(--input-bg); color: var(--text); border: 1px solid #374151; padding: 10px; border-radius: 8px; width: 100%; outline: none; cursor: pointer; }

.checkboxGroup { display: flex; flex-wrap: nowrap; gap: 12px; align-items: center; padding-top: 20px; }
.checkboxGroup label { font-size: 0.85em; display: flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; color: #94a3b8; }

.prod-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
.prod-table th { text-align: center; padding: 12px; background: #0b1220; color: #94a3b8; font-size: 0.65em; text-transform: uppercase; border-bottom: 2px solid #1f2937; }
.prod-table td { padding: 14px 8px; border-bottom: 1px solid #1f2937; font-size: 0.82em; text-align: center; color: #fff; }

.val-bad { color: var(--neg) !important; font-weight: bold; }
.val-good { color: var(--ok-green) !important; font-weight: bold; }

.section-divider { border-top: 2px dashed #374151; margin: 40px 0 25px; position: relative; }
.section-divider span { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #0b1220; padding: 0 20px; color: #94a3b8; font-size: 0.9em; font-weight: bold; }

.site-analysis-card { background: #fff; color: #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; border-left: 5px solid #a855f7; }
.site-name-header { color: #7c3aed; font-weight: bold; font-size: 1.1rem; margin-bottom: 10px; }
.pill-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top:10px; }
.com-pill { background: #f8fafc; border: 1px solid #e2e8f0; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; color: #1e293b; }
.perc-neg { color: #ef4444; font-weight: bold; }
.perc-pos { color: #10b981; font-weight: bold; }

.analysis-brand-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; margin-bottom: 10px; color: #1e293b; font-size: 0.9rem; line-height: 1.6; }
.tag-fortaleza { color: #16a34a; font-weight: bold; }
.tag-mejorar { color: #dc2626; font-weight: bold; }

/* Nuevo color para el Área de menor rendimiento para evitar confusión */
.tag-debil { color: #22d3ee; font-weight: bold; } 

.gap-red { color: #ef4444; font-weight: bold; }
.gap-green { color: #10b981; font-weight: bold; }
</style>
</head>

<body>

<div class="container">
  <h1>DIGITAL - Evolución por Área Editorial</h1>

  <div class="card">
    <label style="display:block; margin-bottom:10px; font-weight:bold; color:#94a3b8;">Cargar reporte excel:</label>
    <input type="file" id="fileInput" accept=".xlsx" style="color: #94a3b8;">
    <div id="loadStatus" style="margin-top:10px; font-size:0.9em; color:#94a3b8;">Esperando archivo...</div>
  </div>

  <div id="filters" class="card" style="display:none">
    <div class="filter-row">
        <div class="year-selector">
            <label class="label-year">Año Base</label>
            <select id="fYear"></select>
        </div>
        <div class="checkboxGroup" id="monthsBase"></div>
    </div>
    <div class="filter-row" style="margin-top:15px; padding-top:15px; border-top:1px solid #374151;">
        <div class="year-selector">
            <label class="label-prod">Productos</label>
            <select id="fProduct" onchange="render()">
                <option value="Branded Content">Branded Content</option>
                <option value="Branded Content video">Branded Content video</option>
                <option value="Branded Content Sindicated">Branded Content Sindicado</option>
                <option value="Curated">Curated</option>
            </select>
        </div>
    </div>
  </div>

  <div id="mainContent" style="display:none">
    <div class="section-divider"><span>P. MEDIO POR ÁREA EDITORIAL</span></div>
    <div class="card" style="overflow-x: auto;">
        <table class="prod-table">
            <thead><tr id="headerRow"></tr></thead>
            <tbody id="bodyAreas"></tbody>
        </table>
    </div>

    <div class="section-divider"><span>IA: ANÁLISIS DE ÁREAS POR SITE</span></div>
    <div id="iaAnalysisContainer"></div>

    <div class="section-divider"><span>ANÁLISIS POR MARCA - FORTALEZAS Y MEJORAS</span></div>
    <div id="brandAnalysisContainer" class="card"></div>
  </div>
</div>

<script>
const MONTHS=["01 Enero","02 Febrero","03 Marzo","04 Abril","05 Mayo","06 Junio","07 Julio","08 Agosto","09 Septiembre","10 Octubre","11 Noviembre","12 Diciembre"];

const SITES_CONFIG = {
  "WWW.ELLE.COM/ES/": { gn: 9000, gv: 12000 },
  "WWW.COSMOPOLITAN.COM/ES/": { gn: 7500, gv: 10400 },
  "WWW.HARPERSBAZAAR.COM/ES": { gn: 7500, gv: 10400 },
  "WWW.ESQUIRE.COM/ES/": { gn: 7500, gv: 10400 },
  "WWW.FOTOGRAMAS.ES": { gn: 6000, gv: 8400 },
  "WWW.ELLEDECOR.COM/ES/": { gn: 5250, gv: 7600 },
  "WWW.MENSHEALTH.COM/ES": { gn: 6000, gv: 8400 },
  "WWW.WOMENSHEALTHMAG.COM/ES/": { gn: 6000, gv: 8400 },
  "WWW.RUNNERSWORLD.COM/ES/": { gn: 5250, gv: 7600 },
  "WWW.CARANDDRIVER.COM/ES/": { gn: 5250, gv: 7600 },
  "WWW.DIEZMINUTOS.ES": { gn: 5250, gv: 7600 }
};

let rawData=[];

const num = (v) => {
  if(v==null) return 0;
  if(typeof v === 'number') return v;
  let s = String(v).replace(/\u00A0/g," ").replace(/€/g,"").replace(/\s/g,"").replace(/\./g,"").replace(/,/g,".");
  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
};

fileInput.onchange = e => {
  const f = e.target.files[0];
  const r = new FileReader();
  r.onload = ev => {
    const wb = XLSX.read(new Uint8Array(ev.target.result), {type:"array"});
    const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
    const findCol = (row, target) => Object.keys(row).find(k => k === target) || Object.keys(row).find(k => k.toUpperCase().includes(target.toUpperCase())) || null;

    if (json.length > 0) {
        const cP = findCol(json[0], "Publicación");
        const cA = findCol(json[0], "ÁREA");
        rawData = json.map(d => ({
          ingreso: num(d["Imp.Neto a Comisionar"]),
          Año: String(d["Año inserción"] || "").trim(),
          Mes: MONTHS.find(m => m.startsWith(String(d["Mes inserción"]).trim().substring(0,2))) || "",
          Product: String(d["Producto"] || "").trim(),
          Anunciante: String(d["Anunciante"] || "SIN ANUNCIANTE").trim().toUpperCase(),
          Publicacion: cP ? String(d[cP]).trim().toUpperCase() : "OTRA",
          Area: cA ? String(d[cA]).trim().toUpperCase() : "VARIOS"
        })).filter(d => d.Año !== "");
    }
    const years = [...new Set(rawData.map(d=>d.Año))].sort().reverse();
    fYear.innerHTML = years.map(y=>`<option value='${y}'>${y}</option>`).join("");
    document.getElementById("monthsBase").innerHTML = MONTHS.map(m => `<label><input type="checkbox" value="${m}" onchange="render()"> ${m.split(" ")[1]}</label>`).join("");
    fYear.onchange = render;
    document.getElementById("filters").style.display = "block";
    document.getElementById("mainContent").style.display = "block";
    document.getElementById("loadStatus").innerText = "✅ Datos listos";
    render();
  };
  r.readAsArrayBuffer(f);
};

function calcNetting(data) {
    const totalFact = data.reduce((acc, b) => acc + b.ingreso, 0);
    const groups = {};
    data.forEach(d => { if (!groups[d.Anunciante]) groups[d.Anunciante] = []; groups[d.Anunciante].push(d.ingreso); });
    let lines = 0;
    Object.values(groups).forEach(pool => {
        pool.sort((a, b) => Math.abs(a) - Math.abs(b));
        while (pool.length > 0) {
            let cur = pool.shift();
            let idx = pool.findIndex(v => v === -cur);
            if (idx !== -1) pool.splice(idx, 1);
            else if (cur > 0) lines++;
        }
    });
    return { total: totalFact, lines };
}

function render(){
  const y1 = fYear.value;
  const prodF = document.getElementById("fProduct").value;
  const isVideo = prodF === "Branded Content video";
  const m1 = Array.from(document.getElementById("monthsBase").querySelectorAll("input:checked")).map(c => c.value);
  
  let matrix = {};
  let activeAreasSet = new Set();
  let activeSites = [];

  Object.keys(SITES_CONFIG).forEach(url => {
      matrix[url] = {};
      let siteHasData = false;
      const allAreasInSite = [...new Set(rawData.filter(d => d.Publicacion === url).map(d => d.Area))];
      
      allAreasInSite.forEach(area => {
          const dFilter = rawData.filter(d => d.Año === y1 && d.Publicacion === url && d.Area === area && (m1.length === 0 || m1.includes(d.Mes)) && d.Product === prodF);
          const n = calcNetting(dFilter);
          const avg = n.lines ? n.total/n.lines : 0;
          if(avg > 0) {
              matrix[url][area] = avg;
              activeAreasSet.add(area);
              siteHasData = true;
          }
      });
      if(siteHasData) activeSites.push(url);
  });

  const sortedAreas = Array.from(activeAreasSet).sort();
  headerRow.innerHTML = `<th>Publicación</th>` + sortedAreas.map(a => `<th>${a}</th>`).join("");

  let bodyHtml = "";
  let iaData = [];

  activeSites.forEach(url => {
      const config = SITES_CONFIG[url];
      const goal = isVideo ? config.gv : config.gn;
      let rowHtml = `<tr><td style="font-weight:bold; font-size:0.75em;">${url}</td>`;
      let siteAreasIA = [];

      sortedAreas.forEach(area => {
          const val = matrix[url][area] || 0;
          if(val === 0) {
              rowHtml += `<td>-</td>`;
          } else {
              const cls = val >= goal ? "val-good" : "val-bad";
              rowHtml += `<td class="${cls}">${Math.round(val).toLocaleString('de-DE')}€</td>`;
              siteAreasIA.push({ area, avg: val, diff: ((val/goal)-1)*100 });
          }
      });
      bodyHtml += rowHtml + "</tr>";
      iaData.push({ site: url, goal, areas: siteAreasIA.sort((a,b) => a.diff - b.diff) });
  });

  bodyAreas.innerHTML = bodyHtml;

  let iaHtml = "";
  iaData.forEach(item => {
      iaHtml += `
      <div class="site-analysis-card">
          <div class="site-name-header">${item.site} <span style="font-size:0.8em; color:#64748b;">(OBJETIVO: ${item.goal.toLocaleString('de-DE')}€)</span></div>
          <div class="pill-container">
              ${item.areas.map(a => `
                  <div class="com-pill">
                      ${a.area}: <span class="${a.diff >= 0 ? 'perc-pos' : 'perc-neg'}">${Math.round(a.avg).toLocaleString('de-DE')}€</span> 
                      (<span class="${a.diff >= 0 ? 'perc-pos' : 'perc-neg'}">${a.diff > 0 ? '+' : ''}${a.diff.toFixed(1)}%</span>)
                  </div>
              `).join("")}
          </div>
      </div>`;
  });
  document.getElementById("iaAnalysisContainer").innerHTML = iaHtml || "<p style='color:#94a3b8; text-align:center;'>No hay datos para el análisis.</p>";

  let brandHtml = "";
  iaData.forEach(item => {
      if (item.areas.length > 0) {
          const fortaleza = [...item.areas].sort((a, b) => b.avg - a.avg)[0];
          const debil = item.areas[0];
          const gap = item.goal > debil.avg ? Math.round(item.goal - debil.avg) : 0;

          const gapClass = gap > 0 ? 'gap-red' : 'gap-green';

          brandHtml += `
          <div class="analysis-brand-card">
              • <strong>${item.site}</strong> · 
              <span class="tag-fortaleza">Fortalezas:</span> Área destacada: ${fortaleza.area} (${Math.round(fortaleza.avg).toLocaleString('de-DE')}€) · 
              <span class="tag-mejorar">A mejorar:</span> Gap vs umbral: <span class="${gapClass}">${gap.toLocaleString('de-DE')}€</span> · 
              <span class="tag-debil">Área de menor rendimiento:</span> ${debil.area} (${Math.round(debil.avg).toLocaleString('de-DE')}€)
          </div>`;
      }
  });
  document.getElementById("brandAnalysisContainer").innerHTML = brandHtml || "<p style='color:#94a3b8; text-align:center;'>No hay datos suficientes para el análisis de marcas.</p>";
}

// --- BLOQUE DE CARGA AUTOMÁTICA ADAPTADO PARA ÁREAS ---
window.addEventListener('load', () => {
    const nombreArchivo = "https://javiap20.github.io/datos-en-excel/PRODUCCION DIGITAL.xlsx"; 

    fetch(nombreArchivo)
        .then(res => {
            if (!res.ok) throw new Error();
            return res.arrayBuffer();
        })
        .then(data => {
            const wb = XLSX.read(new Uint8Array(data), {type: "array"});
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
            
            const findCol = (row, target) => Object.keys(row).find(k => k === target) || Object.keys(row).find(k => k.toUpperCase().includes(target.toUpperCase())) || null;

            if (json.length > 0) {
                const cP = findCol(json[0], "Publicación");
                const cA = findCol(json[0], "ÁREA");

                rawData = json.map(d => ({
                    ingreso: num(d["Imp.Neto a Comisionar"]),
                    Año: String(d["Año inserción"] || "").trim(),
                    Mes: MONTHS.find(m => m.startsWith(String(d["Mes inserción"]).trim().substring(0,2))) || "",
                    Product: String(d["Producto"] || "").trim(),
                    Anunciante: String(d["Anunciante"] || "SIN ANUNCIANTE").trim().toUpperCase(),
                    Publicacion: cP ? String(d[cP]).trim().toUpperCase() : "OTRA",
                    Area: cA ? String(d[cA]).trim().toUpperCase() : "VARIOS"
                })).filter(d => d.Año !== "");

                // Configuración de Filtros
                const years = [...new Set(rawData.map(d=>d.Año))].sort().reverse();
                fYear.innerHTML = years.map(y=>`<option value='${y}'>${y}</option>`).join("");
                
                document.getElementById("monthsBase").innerHTML = MONTHS.map(m => `<label><input type="checkbox" value="${m}" onchange="render()"> ${m.split(" ")[1]}</label>`).join("");
                
                fYear.onchange = render;
                
                // Mostrar interfaz
                document.getElementById("filters").style.display = "block";
                document.getElementById("mainContent").style.display = "block";
                document.getElementById("loadStatus").innerText = "✅ Reporte de Áreas cargado";
                document.getElementById("loadStatus").style.color = "var(--ok-green)";
                
                render();
            }
        })
        .catch(err => {
            console.error(err);
            document.getElementById("loadStatus").innerText = "⚠️ Carga automática no disponible. Sube el archivo manualmente.";
        });
});


</script>
</body>
</html>
