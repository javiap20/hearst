<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGITAL - Inteligencia Sectorial Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --card:#111827;
  --text:#e5e7eb;
  --base:#38bdf8;  
  --comp:#f59e0b;  
  --prod-color:#f472b6; 
  --neg:#f87171;   
  --ok-green: #34d399;
  --input-bg: #1f2933;
}

body{
  margin:0;
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  background:linear-gradient(180deg,#020617,#0f172a);
  color:var(--text);
  padding-top: 20px;
}

h1 { text-align: center; font-size: 1.6rem; margin-bottom: 30px; color: #fff; }
.container{ max-width:1400px; margin:auto; padding:0 20px; }

.card{
  background:rgba(17,24,39,.9); border-radius:14px;
  padding:20px; margin-bottom:20px; border: 1px solid #1f2937;
}

.filter-row { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
.year-selector { min-width: 160px; }

.label-year { color: var(--comp) !important; font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.9em; }
.label-prod { color: var(--prod-color) !important; font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.9em; }

.year-selector select { background: var(--input-bg); color: var(--text); border: 1px solid #374151; padding: 10px; border-radius: 8px; width: 100%; outline: none; cursor: pointer; }

.checkboxGroup { display: flex; flex-wrap: nowrap; gap: 12px; align-items: center; padding-top: 20px; }
.checkboxGroup label { font-size: 0.85em; display: flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap; color: #94a3b8; }

.prod-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
.prod-table th { text-align: center; padding: 12px; background: #0b1220; color: #94a3b8; font-size: 0.65em; text-transform: uppercase; border-bottom: 2px solid #1f2937; }
.prod-table td { padding: 14px 8px; border-bottom: 1px solid #1f2937; font-size: 0.82em; text-align: center; color: #fff; }

.val-bad { color: var(--neg) !important; font-weight: bold; }
.val-good { color: var(--ok-green) !important; font-weight: bold; }

.section-divider { border-top: 2px dashed #374151; margin: 40px 0 25px; position: relative; }
.section-divider span { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: #0b1220; padding: 0 20px; color: #94a3b8; font-size: 0.9em; font-weight: bold; }

/* Estilos IA con 5 sectores */
.ia-card { background: #fff; color: #1e293b; border-radius: 12px; padding: 25px; margin-bottom: 25px; border-left: 6px solid #8b5cf6; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
.ia-title { color: #6d28d9; font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
.ia-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
.ia-sub { font-weight: bold; font-size: 0.85rem; margin-bottom: 10px; color: #475569; text-transform: uppercase; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
.ia-list { list-style: none; padding: 0; margin: 0; }
.ia-item { padding: 6px 10px; background: #f8fafc; border-radius: 6px; margin-bottom: 4px; font-size: 0.8rem; display: flex; justify-content: space-between; border-left: 3px solid transparent; }
.ia-item.pos { border-left-color: #10b981; }
.ia-item.neg { border-left-color: #ef4444; }
.recom-box { margin-top: 20px; padding: 15px; background: #f5f3ff; border-radius: 8px; border: 1px solid #ddd6fe; }
.recom-title { font-weight: bold; color: #5b21b6; font-size: 0.9rem; margin-bottom: 5px; }
.recom-text { font-size: 0.85rem; line-height: 1.5; color: #4338ca; }
</style>
</head>

<body>

<div class="container">
  <h1>DIGITAL - Evolución Estratégica</h1>

  <div class="card">
    <label style="display:block; margin-bottom:10px; font-weight:bold; color:#94a3b8;">Cargar reporte excel:</label>
    <input type="file" id="fileInput" accept=".xlsx" style="color: #94a3b8;">
    <div id="loadStatus" style="margin-top:10px; font-size:0.9em; color:#94a3b8;">Esperando archivo...</div>
  </div>

  <div id="filters" class="card" style="display:none">
    <div class="filter-row">
        <div class="year-selector">
            <label class="label-year">Año Base</label>
            <select id="fYear"></select>
        </div>
        <div class="checkboxGroup" id="monthsBase"></div>
    </div>
    <div class="filter-row" style="margin-top:15px; padding-top:15px; border-top:1px solid #374151;">
        <div class="year-selector">
            <label class="label-prod">Productos</label>
            <select id="fProduct" onchange="render()">
                <option value="Branded Content">Branded Content</option>
                <option value="Branded Content video">Branded Content video</option>
                <option value="Branded Content Sindicated">Branded Content Sindicado</option>
                <option value="Curated">Curated</option>
            </select>
        </div>
    </div>
  </div>

  <div id="mainContent" style="display:none">
    <div class="section-divider"><span>TABLAS DE RENDIMIENTO POR SECTOR</span></div>
    <div class="card" style="overflow-x: auto;">
        <table class="prod-table">
            <thead><tr id="headerRowSectors1"></tr></thead>
            <tbody id="bodySectors1"></tbody>
        </table>
    </div>
    <div class="card" style="overflow-x: auto;">
        <table class="prod-table">
            <thead><tr id="headerRowSectors2"></tr></thead>
            <tbody id="bodySectors2"></tbody>
        </table>
    </div>

    <div class="section-divider"><span>IA: ANÁLISIS TOP 5 FORTALEZAS Y MEJORAS</span></div>
    <div id="iaAnalysisContainer"></div>
  </div>
</div>

<script>
const MONTHS=["01 Enero","02 Febrero","03 Marzo","04 Abril","05 Mayo","06 Junio","07 Julio","08 Agosto","09 Septiembre","10 Octubre","11 Noviembre","12 Diciembre"];

const SITES_CONFIG = {
  "www.elle.com/es/": { gn: 9000, gv: 12000 },
  "www.cosmopolitan.com/es/": { gn: 7500, gv: 10400 },
  "www.harpersbazaar.com/es": { gn: 7500, gv: 10400 },
  "www.esquire.com/es/": { gn: 7500, gv: 10400 },
  "www.fotogramas.es": { gn: 6000, gv: 8400 },
  "www.elledecor.com/es/": { gn: 5250, gv: 7600 },
  "www.menshealth.com/es": { gn: 6000, gv: 8400 },
  "www.womenshealthmag.com/es/": { gn: 6000, gv: 8400 },
  "www.runnersworld.com/es/": { gn: 5250, gv: 7600 },
  "www.caranddriver.com/es/": { gn: 5250, gv: 7600 },
  "www.diezminutos.es": { gn: 5250, gv: 7600 }
};

let rawData=[];

const num = (v) => {
  if(v==null) return 0;
  if(typeof v === 'number') return v;
  let s = String(v).replace(/\u00A0/g," ").replace(/€/g,"").replace(/\s/g,"").replace(/\./g,"").replace(/,/g,".");
  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
};

const limpiarSector = (val) => {
  if (!val) return "SIN SECTOR";
  let str = String(val);
  if (str.includes('*')) {
      let partes = str.split('*');
      return partes[partes.length - 1].trim().toUpperCase();
  }
  return str.trim().toUpperCase();
};

fileInput.onchange = e => {
  const f = e.target.files[0];
  const r = new FileReader();
  r.onload = ev => {
    const wb = XLSX.read(new Uint8Array(ev.target.result), {type:"array"});
    const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
    const findCol = (row, target) => {
        const keys = Object.keys(row);
        const t = target.trim().toUpperCase();
        return keys.find(k => k.trim().toUpperCase() === t) || null;
    };
    if (json.length > 0) {
        const cP = findCol(json[0], "Publicación");
        const cS = findCol(json[0], "Sector");
        rawData = json.map(d => ({
          ingreso: num(d["Imp.Neto a Comisionar"]),
          Año: String(d["Año inserción"] || "").trim(),
          Mes: MONTHS.find(m => m.startsWith(String(d["Mes inserción"]).trim().substring(0,2))) || "",
          Product: String(d["Producto"] || "").trim(),
          Anunciante: String(d["Anunciante"] || "SIN ANUNCIANTE").trim().toUpperCase(),
          Publicacion: cP ? String(d[cP]).trim().toLowerCase() : "otra",
          Sector: cS ? limpiarSector(d[cS]) : "SIN SECTOR"
        })).filter(d => d.Año !== "");
    }
    const years = [...new Set(rawData.map(d=>d.Año))].sort().reverse();
    fYear.innerHTML = years.map(y=>`<option value='${y}'>${y}</option>`).join("");
    document.getElementById("monthsBase").innerHTML = MONTHS.map(m => `<label><input type="checkbox" value="${m}" onchange="render()"> ${m.split(" ")[1]}</label>`).join("");
    fYear.onchange = render;
    document.getElementById("filters").style.display = "block";
    document.getElementById("mainContent").style.display = "block";
    document.getElementById("loadStatus").innerText = "✅ Datos listos";
    render();
  };
  r.readAsArrayBuffer(f);
};

function calcNetting(data) {
    const totalFact = data.reduce((acc, b) => acc + b.ingreso, 0);
    const groups = {};
    data.forEach(d => { if (!groups[d.Anunciante]) groups[d.Anunciante] = []; groups[d.Anunciante].push(d.ingreso); });
    let lines = 0;
    Object.values(groups).forEach(pool => {
        pool.sort((a, b) => Math.abs(a) - Math.abs(b));
        while (pool.length > 0) {
            let cur = pool.shift();
            let idx = pool.findIndex(v => v === -cur);
            if (idx !== -1) pool.splice(idx, 1);
            else if (cur > 0) lines++;
        }
    });
    return { total: totalFact, lines, avg: lines ? totalFact/lines : 0 };
}

function render(){
  const y1 = fYear.value;
  const prodF = document.getElementById("fProduct").value;
  const isVideo = prodF === "Branded Content video";
  const m1 = Array.from(document.getElementById("monthsBase").querySelectorAll("input:checked")).map(c => c.value);
  const activeSites = Object.keys(SITES_CONFIG);

  // Tablas de Sectores
  let sectorMetrics = [];
  const allSectors = [...new Set(rawData.map(d => d.Sector))];
  allSectors.forEach(sec => {
      const dFilter = rawData.filter(d => d.Año === y1 && d.Sector === sec && (m1.length === 0 || m1.includes(d.Mes)) && d.Product === prodF);
      const n = calcNetting(dFilter);
      if(n.total > 0) sectorMetrics.push({ sector: sec, total: n.total });
  });
  sectorMetrics.sort((a, b) => b.total - a.total);
  const sectorList1 = sectorMetrics.slice(0, 8).map(s => s.sector);
  const sectorList2 = sectorMetrics.slice(8, 16).map(s => s.sector);

  function renderSectorTable(targetHeader, targetBody, sectorList) {
      if(sectorList.length === 0) return;
      targetHeader.innerHTML = `<th>Publicación</th>` + sectorList.map(s => `<th>${s}</th>`).join("");
      let html = "";
      activeSites.forEach(url => {
          const goal = isVideo ? SITES_CONFIG[url].gv : SITES_CONFIG[url].gn;
          let row = `<tr><td style="font-weight:bold; font-size:0.75em;">${url}</td>`;
          sectorList.forEach(sec => {
              const dFilter = rawData.filter(d => d.Año === y1 && d.Publicacion === url && d.Sector === sec && (m1.length === 0 || m1.includes(d.Mes)) && d.Product === prodF);
              const n = calcNetting(dFilter);
              const cls = n.avg === 0 ? "" : (n.avg >= goal ? "val-good" : "val-bad");
              row += `<td class="${cls}">${n.avg === 0 ? '-' : Math.round(n.avg).toLocaleString('de-DE') + '€'}</td>`;
          });
          html += row + "</tr>";
      });
      targetBody.innerHTML = html;
  }
  renderSectorTable(headerRowSectors1, bodySectors1, sectorList1);
  renderSectorTable(headerRowSectors2, bodySectors2, sectorList2);

  // --- BLOQUE IA EXTENDIDO (TOP 5) ---
  let iaHtml = "";
  activeSites.forEach(url => {
      const config = SITES_CONFIG[url];
      const goal = isVideo ? config.gv : config.gn;
      const dSite = rawData.filter(d => d.Año === y1 && d.Publicacion === url && (m1.length === 0 || m1.includes(d.Mes)) && d.Product === prodF);
      
      const siteSectors = [...new Set(dSite.map(d => d.Sector))];
      let sectorAvgs = siteSectors.map(s => {
          const res = calcNetting(dSite.filter(d => d.Sector === s));
          return { sector: s, avg: res.avg, diff: ((res.avg/goal)-1)*100 };
      }).filter(s => s.avg > 0).sort((a,b) => b.avg - a.avg);

      if (sectorAvgs.length > 0) {
          // Cambiado de 3 a 5
          const top5 = sectorAvgs.slice(0, 5);
          const bottom5 = sectorAvgs.length > 5 ? sectorAvgs.slice(-5).reverse() : [...sectorAvgs].reverse();
          
          let recomendacion = "";
          let deficitTotal = sectorAvgs.filter(s => s.avg < goal).reduce((acc, s) => acc + (goal - s.avg), 0);
          
          if(top5[0].avg > goal * 1.5) {
              recomendacion = `Excelente tracción en ${top5[0].sector}. Recomendamos usar este caso de éxito para atraer marcas premium en ${top5[1].sector} y ${top5[2].sector}. Considerar un ajuste de tarifas al alza en estos segmentos.`;
          } else if (deficitTotal > 0) {
              recomendacion = `Se observa fragilidad en el precio medio. Recomendamos priorizar la venta de formatos de mayor valor (Brand Discovery/Video) en los sectores de la lista de mejora para reducir el gap de ${Math.round(deficitTotal).toLocaleString('de-DE')}€ acumulado.`;
          } else {
              recomendacion = `Estructura sectorial equilibrada. Foco en la retención del TOP 5 y en convertir los sectores de rendimiento moderado mediante incentivos de volumen.`;
          }

          iaHtml += `
          <div class="ia-card">
            <div class="ia-title">📈 ${url.toUpperCase()} <span style="font-size:0.7em; color:#64748b; margin-left:auto;">Target p.medio: ${goal.toLocaleString('de-DE')}€</span></div>
            <div class="ia-grid">
              <div>
                <div class="ia-sub">🚀 TOP 5 FORTALEZAS</div>
                <div class="ia-list">
                  ${top5.map(s => `
                    <div class="ia-item pos">
                      <span>${s.sector}</span>
                      <span style="font-weight:bold; color:#059669;">+${Math.round(s.diff)}%</span>
                    </div>`).join('')}
                </div>
              </div>
              <div>
                <div class="ia-sub">⚠️ TOP 5 A MEJORAR</div>
                <div class="ia-list">
                  ${bottom5.map(s => `
                    <div class="ia-item neg">
                      <span>${s.sector}</span>
                      <span style="font-weight:bold; color:#dc2626;">${Math.round(s.diff)}%</span>
                    </div>`).join('')}
                </div>
              </div>
            </div>
            <div class="recom-box">
              <div class="recom-title">💡 Plan de Acción IA:</div>
              <div class="recom-text">${recomendacion}</div>
            </div>
          </div>`;
      }
  });
  document.getElementById("iaAnalysisContainer").innerHTML = iaHtml || "<p style='color:#94a3b8; text-align:center;'>Carga el reporte para activar el consultor IA.</p>";
}

// --- BLOQUE DE CARGA AUTOMÁTICA ADAPTADO PARA SECTORIAL PRO ---
window.addEventListener('load', () => {
    const nombreArchivo = "https://javiap20.github.io/datos-en-excel/PRODUCCION DIGITAL.xlsx"; 

    fetch(nombreArchivo)
        .then(res => {
            if (!res.ok) throw new Error();
            return res.arrayBuffer();
        })
        .then(data => {
            const wb = XLSX.read(new Uint8Array(data), {type: "array"});
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
            
            // Función de detección de columnas idéntica a tu lógica de carga manual
            const findCol = (row, target) => {
                const keys = Object.keys(row);
                const t = target.trim().toUpperCase();
                return keys.find(k => k.trim().toUpperCase() === t) || null;
            };

            if (json.length > 0) {
                const cP = findCol(json[0], "Publicación");
                const cS = findCol(json[0], "Sector");

                rawData = json.map(d => ({
                    ingreso: num(d["Imp.Neto a Comisionar"]),
                    Año: String(d["Año inserción"] || "").trim(),
                    Mes: MONTHS.find(m => m.startsWith(String(d["Mes inserción"]).trim().substring(0,2))) || "",
                    Product: String(d["Producto"] || "").trim(),
                    Anunciante: String(d["Anunciante"] || "SIN ANUNCIANTE").trim().toUpperCase(),
                    Publicacion: cP ? String(d[cP]).trim().toLowerCase() : "otra",
                    Sector: cS ? limpiarSector(d[cS]) : "SIN SECTOR"
                })).filter(d => d.Año !== "");

                // Poblar selectores
                const years = [...new Set(rawData.map(d=>d.Año))].sort().reverse();
                fYear.innerHTML = years.map(y=>`<option value='${y}'>${y}</option>`).join("");
                
                document.getElementById("monthsBase").innerHTML = MONTHS.map(m => 
                    `<label><input type="checkbox" value="${m}" onchange="render()"> ${m.split(" ")[1]}</label>`
                ).join("");
                
                fYear.onchange = render;

                // Mostrar interfaz y ejecutar primer render
                document.getElementById("filters").style.display = "block";
                document.getElementById("mainContent").style.display = "block";
                document.getElementById("loadStatus").innerText = "✅ Inteligencia Sectorial Actualizada";
                document.getElementById("loadStatus").style.color = "var(--ok-green)";
                
                render();
            }
        })
        .catch(err => {
            console.error("Error en carga sectorial:", err);
            document.getElementById("loadStatus").innerText = "⚠️ Error en carga automática. Use el selector manual.";
        });
});


</script>
</body>
</html>
