<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIGITAL - Previsión Final con Desglose</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --card:#111827; --text:#e5e7eb; --base:#38bdf8; 
  --neg:#f87171; --ok-green: #34d399; --prog-orange: #f59e0b; --fucsia: #f472b6; 
}
body { margin: 0; font-family: 'Inter', sans-serif; background: linear-gradient(180deg,#020617,#0f172a); color: var(--text); padding: 20px; }
.container{ max-width:1150px; margin:auto; }
.card{ background:rgba(17,24,39,.9); border-radius:14px; padding:20px; margin-bottom:25px; border: 1px solid #1f2937; }
h1 { text-align: center; color: var(--text); margin-bottom: 30px; font-size: 1.8rem; border-bottom: 1px solid #374151; padding-bottom: 15px; }
h2 { font-size: 1.1rem; margin-top: 0; text-transform: uppercase; letter-spacing: 1px; text-align: center; color: var(--fucsia); }
h3 { font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; margin-top: 25px; border-left: 3px solid var(--fucsia); padding-left: 10px; }
.filtersRow { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 10px;}
.filtersRow div { flex: 1; min-width: 200px; }
select, input[type=file], .manual-input { background:#1f2933; color:var(--text); border:1px solid #374151; padding:10px; border-radius:8px; width: 100%; margin-top: 8px; box-sizing: border-box; }
.manual-input { border: 1px solid var(--fucsia); color: var(--fucsia); font-weight: bold; font-size: 1.1rem; text-align: right; }
label { font-size: 0.85em; font-weight: 600; color: #9ca3af; }

.forecast-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
.forecast-table th { color: #94a3b8; font-size: 0.75em; padding: 10px; border-bottom: 2px solid #374151; text-align: center; }
.forecast-table td { padding: 12px 10px; text-align: center; font-size: 1.05rem; border-bottom: 1px solid #1f2937; font-weight: 700; white-space: nowrap; } /* white-space evita el doble renglón */

.row-label { text-align: left !important; color: #9ca3af; font-size: 0.8rem; width: 22%; font-weight: normal; }
.val-blue { color: var(--base); } .val-orange { color: var(--prog-orange); } .val-white { color: #fff; }
.negative { color: var(--neg) !important; } .positive { color: var(--ok-green) !important; }
.manual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 15px 0; }
.hint { font-size: 0.75rem; color: #6b7280; display: block; margin-top: 5px; }
.total-row { background: rgba(56, 189, 248, 0.05); }

.diff-money { font-size: 0.75rem; display: inline; opacity: 0.7; font-weight: normal; margin-left: 5px; } /* display: inline para misma fila */

/* AJUSTES ESPECÍFICOS PARA EL DESGLOSE COMPACTO */
.desglose-container { margin: 15px 60px 0 60px; }
.site-table td { font-size: 0.85rem; padding: 5px 10px; } /* Interlineado reducido a 5px */
.site-table th { font-size: 0.7rem; padding: 6px 10px; }

.summary-row { background: rgba(56, 189, 248, 0.15) !important; border-top: 2px solid #374151; }
.summary-row td { color: #fff !important; font-size: 0.95rem !important; padding: 6px 10px; }
</style>
</head>
<body>

<div class="container">
  <h1>ANÁLISIS DE PREVISIÓN DIGITAL</h1>

  <div class="card">
    <label>Cargar archivo de facturación:</label>
    <input type="file" id="fileInput" accept=".json,.xlsx">
  </div>

  <div id="filterBlock" class="card" style="display:none">
    <div class="filtersRow">
      <div><label>Año de Análisis</label><select id="fYear"></select></div>
      <div><label>Año de Comparación</label><select id="fYear2"></select></div>
    </div>
  </div>

  <div id="manualAdjustmentBlock" class="card" style="display:none; border: 2px solid var(--fucsia);">
    <h2>Ajuste de Previsión Manual</h2>
    <div class="manual-grid">
        <div>
            <label>Extra Directa / Resto (€)</label>
            <input type="text" id="extraResto" class="manual-input" value="0" oninput="handleManualInput(this)">
            <span class="hint" id="hintResto">Excel Actual: 0€</span>
        </div>
        <div>
            <label>Extra Programática (€)</label>
            <input type="text" id="extraProg" class="manual-input" value="0" oninput="handleManualInput(this)">
            <span class="hint" id="hintProg">Excel Actual: 0€</span>
        </div>
    </div>
  </div>

  <div id="scenariosWrapper"></div>
</div>

<script>
const MONTHS=["01 Enero","02 Febrero","03 Marzo","04 Abril","05 Mayo","06 Junio","07 Julio","08 Agosto","09 Septiembre","10 Octubre","11 Noviembre","12 Diciembre"];
const FAM_PROG = ["Programatica Display Directo","Programatica Display Indirecto","Video Programatico Directo","Video Programatico Indirecto"];

let rawData=[];

function handleManualInput(el) {
    let val = el.value.replace(/\D/g, "");
    el.value = val.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    render();
}

const parseManual = (id) => {
    let val = document.getElementById(id).value.replace(/\./g, "");
    return parseFloat(val) || 0;
};

const num = v => {
  if(v==null) return 0;
  if(typeof v === 'number') return v;
  let s = String(v).replace(/\u00A0/g," ").replace(/€/g,"").replace(/\s/g,"").replace(/\./g,"").replace(/,/g,".");
  return Number.isFinite(Number(s)) ? Number(s) : 0;
};

const fmt = n => new Intl.NumberFormat('es-ES', { useGrouping: true, maximumFractionDigits: 0 }).format(Math.round(n)) + '€';

fileInput.onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const data = f.name.endsWith("json") ? JSON.parse(ev.target.result) : XLSX.utils.sheet_to_json(XLSX.read(new Uint8Array(ev.target.result), {type:"array"}).Sheets[XLSX.read(new Uint8Array(ev.target.result), {type:"array"}).SheetNames[0]], { defval: "" });
    rawData = data.map(d => ({ 
        ingreso: num(d["Imp.Neto a Comisionar"]), 
        Año: String(d["Año inserción"] || "").trim(), 
        Mes: MONTHS.find(m => m.startsWith(String(d["Mes inserción"]).trim().substring(0,2))) || "",
        Familia: String(d["Familia"] || "").trim(),
        Publicacion: String(d["Publicación"] || d["Publicacion"] || "Otros").trim()
    })).filter(d => d.Año !== "");
    
    const years = [...new Set(rawData.map(d=>d.Año))].sort().reverse();
    fYear.innerHTML = years.map(y=>`<option ${y==='2026'?'selected':''}>${y}</option>`).join("");
    fYear2.innerHTML = years.map(y=>`<option ${y==='2025'?'selected':''}>${y}</option>`).join("");
    
    fYear.onchange = fYear2.onchange = render;
    document.getElementById("filterBlock").style.display = "block";
    document.getElementById("manualAdjustmentBlock").style.display = "block";
    render();
  };
  f.name.endsWith("json") ? r.readAsText(f) : r.readAsArrayBuffer(f);
};

function render() {
  const yB = fYear.value; const yC = fYear2.value;
  const hoy = new Date();
  const diaH = hoy.getDate(); 
  const mesIdx = hoy.getMonth();
  const mesS = MONTHS[mesIdx];
  const diasM = new Date(hoy.getFullYear(), mesIdx + 1, 0).getDate();
  const diasRestantes = diasM - diaH;
  
  const dBase = rawData.filter(d => d.Año === yB);
  const dComp = rawData.filter(d => d.Año === yC);
  
  const rP_excel_total = dBase.filter(d => d.Mes === mesS && FAM_PROG.includes(d.Familia)).reduce((a, b) => a + b.ingreso, 0);
  const rNP_excel_total = dBase.filter(d => d.Mes === mesS && !FAM_PROG.includes(d.Familia)).reduce((a, b) => a + b.ingreso, 0);
  
  document.getElementById("hintProg").innerText = `Excel Actual: ${fmt(rP_excel_total)}`;
  document.getElementById("hintResto").innerText = `Excel Actual: ${fmt(rNP_excel_total)}`;

  const extraP = parseManual("extraProg");
  const extraR = parseManual("extraResto");

  const wrapper = document.getElementById("scenariosWrapper");
  wrapper.innerHTML = "";

  [1, 2, 3.5].forEach(inc => {
      const rNP_Total_Hoy = rNP_excel_total + extraR;
      const proyNP_Total = rNP_Total_Hoy + ((rNP_Total_Hoy / diaH) * diasRestantes);
      const proyP_Excel_Only = rP_excel_total + ((rP_excel_total / diaH) * diasRestantes);
      const pLinTotal_Mes = proyNP_Total + proyP_Excel_Only;

      const cierreHistProg_Total = dComp.filter(d => d.Mes === mesS && FAM_PROG.includes(d.Familia)).reduce((a, b) => a + b.ingreso, 0) * (1 + inc/100);
      const rP_Total_Hoy = rP_excel_total + extraP;
      const proyP_Acelerada = rP_Total_Hoy + ((rP_Total_Hoy / diaH) * diasRestantes);
      const pAjuTotal_Mes = proyNP_Total + Math.max(proyP_Acelerada, cierreHistProg_Total);

      const compMesTotal = dComp.filter(d => d.Mes === mesS).reduce((a, b) => a + b.ingreso, 0);
      const diffM_perc = compMesTotal ? ((pAjuTotal_Mes / compMesTotal) - 1) * 100 : 0;
      const diffM_money = pAjuTotal_Mes - compMesTotal;

      const publicaciones = [...new Set(dBase.filter(d => d.Mes === mesS).map(d => d.Publicacion))].sort();
      let siteRowsHtml = "";
      let sumReal = 0, sumLin = 0, sumAju = 0;

      publicaciones.forEach(pub => {
          const sRP_excel = dBase.filter(d => d.Mes === mesS && d.Publicacion === pub && FAM_PROG.includes(d.Familia)).reduce((a, b) => a + b.ingreso, 0);
          const sRNP_excel = dBase.filter(d => d.Mes === mesS && d.Publicacion === pub && !FAM_PROG.includes(d.Familia)).reduce((a, b) => a + b.ingreso, 0);
          const sCompTotal = dComp.filter(d => d.Mes === mesS && d.Publicacion === pub).reduce((a, b) => a + b.ingreso, 0);
          
          const pesoNP = rNP_excel_total ? (sRNP_excel / rNP_excel_total) : 0;
          const sRNP_Hoy = sRNP_excel + (extraR * pesoNP);
          const sProyNP = sRNP_Hoy + ((sRNP_Hoy / diaH) * diasRestantes);
          const sProyP_Lineal = sRP_excel + ((sRP_excel / diaH) * diasRestantes);
          const sLinTotal = sProyNP + sProyP_Lineal;

          const sCierreHistProg = dComp.filter(d => d.Mes === mesS && d.Publicacion === pub && FAM_PROG.includes(d.Familia)).reduce((a, b) => a + b.ingreso, 0) * (1 + inc/100);
          const pesoP = rP_excel_total ? (sRP_excel / rP_excel_total) : 0;
          const sRP_Hoy = sRP_excel + (extraP * pesoP);
          const sProyP_Aju = sRP_Hoy + ((sRP_Hoy / diaH) * diasRestantes);
          const sAjuTotal = sProyNP + Math.max(sProyP_Aju, sCierreHistProg);

          sumReal += (sRP_excel + sRNP_excel);
          sumLin += sLinTotal;
          sumAju += sAjuTotal;

          const sDiffPerc = sCompTotal ? ((sAjuTotal / sCompTotal) - 1) * 100 : 0;
          const sDiffMoney = sAjuTotal - sCompTotal;

          siteRowsHtml += `
            <tr>
                <td class="row-label">${pub}</td>
                <td class="val-white">${fmt(sRP_excel + sRNP_excel)}</td>
                <td class="val-blue">${fmt(sLinTotal)}</td>
                <td class="val-orange">${fmt(sAjuTotal)}</td>
                <td class="${sDiffPerc >= 0 ? 'positive' : 'negative'}">
                  ${(sDiffPerc > 0 ? "+" : "") + sDiffPerc.toFixed(1)}%<span class="diff-money">(${fmt(sDiffMoney)})</span>
                </td>
            </tr>`;
      });

      siteRowsHtml += `
        <tr class="summary-row">
            <td class="row-label" style="font-weight:bold; color:#fff !important;">TOTAL DESGLOSE</td>
            <td class="val-white">${fmt(sumReal)}</td>
            <td class="val-blue" style="color:#fff !important;">${fmt(sumLin)}</td>
            <td class="val-orange" style="color:#fff !important;">${fmt(sumAju)}</td>
            <td style="color:#fff !important;">
                ${(compMesTotal ? ((sumAju / compMesTotal) - 1) * 100 : 0) > 0 ? "+" : ""}${(compMesTotal ? ((sumAju / compMesTotal) - 1) * 100 : 0).toFixed(1)}%<span class="diff-money" style="color:#fff; opacity:0.8;">(${fmt(sumAju - compMesTotal)})</span>
            </td>
        </tr>`;

      let totalAño = 0;
      let totalAñoPasado = 0;
      MONTHS.forEach((m, idx) => {
          totalAñoPasado += dComp.filter(d => d.Mes === m).reduce((a, b) => a + b.ingreso, 0);
          if (idx < mesIdx) totalAño += dBase.filter(d => d.Mes === m).reduce((a, b) => a + b.ingreso, 0);
          else if (idx === mesIdx) totalAño += pAjuTotal_Mes;
          else totalAño += dComp.filter(d => d.Mes === m).reduce((a, b) => a + b.ingreso, 0) * (1 + inc/100);
      });

      wrapper.innerHTML += `
        <div class="card">
          <h2>ESTIMACIÓN DE CIERRE DE NEGOCIO (${inc}%)</h2>
          <table class="forecast-table">
            <thead>
              <tr><th>Concepto</th><th>Real a Fecha</th><th>Proy. LINEAL</th><th>Proy. AJUSTADO PROG.</th><th>vs. Año Ant.</th></tr>
            </thead>
            <tbody>
              <tr>
                <td class="row-label">MES ACTUAL (${mesS.split(" ")[1].toUpperCase()})</td>
                <td class="val-white">${fmt(rP_excel_total + rNP_excel_total)}</td>
                <td class="val-blue">${fmt(pLinTotal_Mes)}</td>
                <td class="val-orange">${fmt(pAjuTotal_Mes)}</td>
                <td class="${diffM_perc >= 0 ? 'positive' : 'negative'}">
                  ${(diffM_perc > 0 ? "+" : "") + diffM_perc.toFixed(1)}%<span class="diff-money">(${fmt(diffM_money)})</span>
                </td>
              </tr>
              <tr class="total-row">
                <td class="row-label">TOTAL AÑO (PROY.)</td>
                <td class="val-white">${fmt(rP_excel_total + rNP_excel_total)}</td>
                <td></td>
                <td class="val-orange">${fmt(totalAño)}</td>
                <td class="${((totalAño / totalAñoPasado) - 1) * 100 >= 0 ? 'positive' : 'negative'}">
                  ${(((totalAño / totalAñoPasado) - 1) * 100) > 0 ? "+" : ""}${(((totalAño / totalAñoPasado) - 1) * 100).toFixed(1)}%<span class="diff-money">(${fmt(totalAño - totalAñoPasado)})</span>
                </td>
              </tr>
            </tbody>
          </table>

          <h3>Desglose por Publicación</h3>
          <div class="desglose-container">
            <table class="forecast-table site-table">
              <thead>
                <tr><th>Publicación</th><th>Real Excel</th><th>Proy. LINEAL</th><th>Proy. AJUSTADA</th><th>vs. Año Ant.</th></tr>
              </thead>
              <tbody>
                ${siteRowsHtml}
              </tbody>
            </table>
          </div>
        </div>`;
  });
}

// --- BLOQUE DE CARGA AUTOMÁTICA ADAPTADO PARA PREVISIÓN ---
window.addEventListener('load', () => {
    const nombreArchivo = "https://javiap20.github.io/datos-en-excel/PRODUCCION DIGITAL.xlsx"; 

    fetch(nombreArchivo)
        .then(res => {
            if (!res.ok) throw new Error();
            return res.arrayBuffer();
        })
        .then(data => {
            const wb = XLSX.read(new Uint8Array(data), {type: "array"});
            const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
            
            if (json.length > 0) {
                // Reutilizamos tu mapeo exacto de este archivo
                rawData = json.map(d => ({ 
                    ingreso: num(d["Imp.Neto a Comisionar"]), 
                    Año: String(d["Año inserción"] || "").trim(), 
                    Mes: MONTHS.find(m => m.startsWith(String(d["Mes inserción"]).trim().substring(0,2))) || "",
                    Familia: String(d["Familia"] || "").trim(),
                    Publicacion: String(d["Publicación"] || d["Publicacion"] || "Otros").trim()
                })).filter(d => d.Año !== "");

                // Inicialización de filtros y visualización
                const years = [...new Set(rawData.map(d=>d.Año))].sort().reverse();
                
                // Mantener tus preselecciones por defecto (2026 y 2025)
                fYear.innerHTML = years.map(y=>`<option ${y==='2026'?'selected':''}>${y}</option>`).join("");
                fYear2.innerHTML = years.map(y=>`<option ${y==='2025'?'selected':''}>${y}</option>`).join("");
                
                fYear.onchange = fYear2.onchange = render;
                
                // Mostrar bloques ocultos
                document.getElementById("filterBlock").style.display = "block";
                document.getElementById("manualAdjustmentBlock").style.display = "block";
                
                // Pequeño aviso visual de éxito
                const statusDiv = document.createElement("div");
                statusDiv.style = "text-align:center; color:var(--ok-green); font-size:0.8rem; margin-bottom:10px;";
                statusDiv.innerText = "✅ Reporte cargado automáticamente";
                document.querySelector(".container").insertBefore(statusDiv, document.getElementById("filterBlock"));
                
                render();
            }
        })
        .catch(() => {
            console.log("Carga automática: Esperando selección manual de archivo.");
        });
});

</script>
</body>
</html>
