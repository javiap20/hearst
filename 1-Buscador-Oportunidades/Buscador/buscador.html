<style>
:root {
  --bg: #f4f5f7; --bg2: #ffffff; --bg3: #f0f1f4;
  --border: rgba(0,0,0,0.08);
  --text: #1a1a2e; --text2: #3a3a5c; --text3: #7a7a9a;
  --accent: #2563eb; --green: #16a34a; --red: #dc2626;
  --purple: #7c3aed; --orange: #f59e0b;
  --radius: 10px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5; min-height: 100vh; }

/* TOPBAR */
.topbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
.topbar-brand { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.date-badge { font-size: 11px; color: var(--text3); background: var(--bg3); padding: 3px 10px; border-radius: 20px; }

/* STATUS */
#status { padding: 10px 24px; background: var(--bg3); border-bottom: 1px solid var(--border); font-size: 12px; }
.status-loading { color: var(--text3); }
.status-ok { color: var(--green); }
.status-error { color: var(--red); }

/* UPLOAD FALLBACK */
.upload-fallback { display: none; padding: 10px 24px; background: #fff8f0; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text3); }
.upload-fallback label { cursor: pointer; color: var(--accent); text-decoration: underline; }

/* STATS */


/* CANAL TABS */
.canal-tabs { display: flex; gap: 6px; padding: 0 24px 12px; }
.section-title { font-size: 22px; font-weight: 700; color: var(--text); padding: 28px 24px 16px; text-align: center; }
.canal-tab { padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg2); color: var(--text2); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
.canal-tab:hover { border-color: var(--accent); color: var(--accent); }
.canal-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.canal-tab.digital.active { background: var(--accent); border-color: var(--accent); }
.canal-tab.print.active { background: var(--purple); border-color: var(--purple); }
.canal-tab.eventos.active { background: var(--orange); border-color: var(--orange); }

/* SEARCH */
.search-wrap { background: var(--bg2); margin: 8px 24px 16px; border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; }
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.filter-row label { font-size: 11px; color: var(--text3); }
.filter-row select { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; font-family: 'DM Sans', sans-serif; background: var(--bg3); color: var(--text); outline: none; }
.filter-row select:focus { border-color: var(--accent); }
.filter-row button { padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; background: var(--bg2); color: var(--text2); cursor: pointer; }
.filter-row button:hover { background: var(--bg3); }
.search-row { display: flex; gap: 8px; margin-bottom: 12px; }
.search-row input { flex: 1; font-size: 14px; padding: 10px 14px; border: 2px solid #bfdbfe; border-radius: 8px; outline: none; font-family: 'DM Sans', sans-serif; background: #eff6ff; color: var(--text); }
.search-row input:focus { border-color: var(--accent); background: #e0eeff; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
.search-row input::placeholder { color: #93afd4; }
.search-row button { padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.search-row button:hover { opacity: 0.9; }
.mic-btn { padding: 10px 14px; background: var(--bg2); color: var(--accent); border: 2px solid #bfdbfe; border-radius: 8px; font-size: 15px; cursor: pointer; transition: all 0.15s; }
.mic-btn:hover { background: #eff6ff; }
.mic-btn.listening { background: var(--red); border-color: var(--red); color: #fff; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.6;} }
.mic-btn.unsupported { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 11px; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2); cursor: pointer; transition: all 0.15s; }
.chip:hover { background: #eef4ff; border-color: var(--accent); color: var(--accent); }

/* RESULTS */

/* BARS */
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; font-size: 12px; }
.bar-lbl { min-width: 150px; max-width: 200px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.bar-val { min-width: 90px; text-align: right; color: var(--text2); font-family: 'DM Mono', monospace; font-size: 11px; }

/* TABLE */
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th { text-align: center; color: var(--text3); font-weight: 500; padding: 5px 8px; border-bottom: 1px solid var(--border); }
tbody td { padding: 7px 8px; border-bottom: 1px solid var(--bg3); color: var(--text); text-align: center; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--bg3); }
.num { text-align: center; font-family: 'DM Mono', monospace; }

/* TREND */
.up { color: var(--green); } .dn { color: var(--red); }

/* SUMMARY STATS */
.sum-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.sum-stat { background: var(--bg3); border-radius: 8px; padding: 10px 14px; }
.sum-stat .v { font-size: 17px; font-weight: 600; }

/* CANAL PILL */

.pill.DIGITAL { background: #dbeafe; color: #1d4ed8; }
.pill.PRINT { background: #ede9fe; color: #6d28d9; }
.pill.EVENTOS { background: #fef3c7; color: #b45309; }

.hidden { display: none; }

/* INSERCIONES BLOCK */
.ins-block { background: var(--bg2); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 14px; overflow: hidden; }
.ins-block-header { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; cursor: pointer; user-select: none; }
.ins-block-header:hover { background: var(--bg3); }
.ins-block-header h3 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--text); margin: 0; }
.ins-block-toggle { font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 6px; }
.ins-block-body { display: none; border-top: 1px solid var(--border); }
.ins-block-body.open { display: block; }
.ins-detect { font-size: 11px; color: var(--text2); padding: 10px 16px; background: var(--bg3); border-bottom: 1px solid var(--border); }
.ins-table-wrap { overflow-x: auto; max-height: 420px; overflow-y: auto; }
.ins-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.ins-table thead th { position: sticky; top: 0; background: var(--bg3); text-align: left; color: var(--text3); font-weight: 500; padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; z-index: 1; }
.ins-table thead th.r { text-align: right; }
.ins-table thead th.c { text-align: center; }
.ins-table tbody td { padding: 6px 10px; border-bottom: 1px solid var(--bg3); color: var(--text); }
.ins-table tbody td.r { text-align: right; font-family: 'DM Mono', monospace; font-size: 11px; }
.ins-table tbody td.c { text-align: center; }
.ins-table tbody tr:last-child td { border-bottom: none; }
.ins-table tbody tr:hover td { background: #f0f4ff; }
</style>

<script>
const EXCEL_SOURCES = [
  { url: 'https://hearstspain-my.sharepoint.com/personal/japaricio_hearst_es/_layouts/15/download.aspx?share=IQBtUVlYDjlRRoCaM7gsBE1eATJ8miXAVtnTs6Qcuioee-Y', canal: 'DIGITAL', name: 'PRODUCCION DIGITAL.xlsx' },
  { url: 'https://hearstspain-my.sharepoint.com/personal/japaricio_hearst_es/_layouts/15/download.aspx?share=IQCgA4a20KbOTIY3RsToUyewAROi0viVXnYcoXICS4M0cNU', canal: 'PRINT', name: 'PRODUCCION PRINT.xlsx' },
  { url: 'https://hearstspain-my.sharepoint.com/personal/japaricio_hearst_es/_layouts/15/download.aspx?share=IQDZNkSJLhXFToC-uOPwQt-KAcAnft0wGr7bEwH4pJhzMoU', canal: 'EVENTOS', name: 'PRODUCCION EVENTOS.xlsx' }
];
const SHEET_NAME = 'Analizador general';
const MESES = ['01 Enero','02 Febrero','03 Marzo','04 Abril','05 Mayo','06 Junio','07 Julio','08 Agosto','09 Septiembre','10 Octubre','11 Noviembre','12 Diciembre'];

const DIRECT_MAP = {
  'elle decoration':'Elle Decor','www.elledecor.com/es/':'Elle Decor',
  'elle':'Elle','www.elle.com/es/':'Elle',
  'elle gourmet':'Elle Gourmet','www.elle.com/es/gourmet/':'Elle Gourmet',
  'elle travel':'Elle Travel','www.elle.com/es/travel/':'Elle Travel',
  'cosmopolitan':'Cosmopolitan','www.cosmopolitan.com/es/':'Cosmopolitan',
  "harper´s bazaar":"Harper's Bazaar","harper's bazaar":"Harper's Bazaar",'www.harpersbazaar.com/es':"Harper's Bazaar",
  'esquire':'Esquire','www.esquire.com/es/':'Esquire',
  'fotogramas & video':'Fotogramas','fotogramas':'Fotogramas','www.fotogramas.es':'Fotogramas',
  'diez minutos':'Diez Minutos','www.diezminutos.es':'Diez Minutos',
  "men´s health":"Men's Health","men's health":"Men's Health",'www.menshealth.com/es':"Men's Health",
  'car & driver':'Car & Driver','www.caranddriver.com/es/':'Car & Driver',
  "women´s health":"Women's Health","women's health":"Women's Health",'www.womenshealthmag.com/es/':"Women's Health",
  "runner´s world":"Runner's World","runner's world":"Runner's World",'www.runnersworld.com/es/':"Runner's World",
  'nuevo estilo':'Nuevo Estilo / Mi Casa','www.micasarevista.com':'Nuevo Estilo / Mi Casa','www.nuevo-estilo.es':'Nuevo Estilo / Mi Casa'
};

const ZONAS = {
  'Madrid': ['BRAND EXPERIENCE','CLIENT EXPERIENCE LIFESTYLE','CLIENT EXPERIENCE LUJO'],
  'Barcelona': ['CLIENT EXPERIENCE BARCELONA'],
  'Internacional': ['INTERNACIONAL'],
  'Programática': ['PROGRAMÁTICA']
};

const CANAL_COLORS = { DIGITAL: '#2563eb', PRINT: '#7c3aed', EVENTOS: '#f59e0b', TODOS: '#2563eb' };

let DATA = [], FILTERED = [], currentCanal = 'TODOS';

function norm(s) {
  return String(s||'')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/[''´`']/g,'')
    .replace(/\./g,'')
    .replace(/[-_]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
// Formateadores — forzamos es-ES explícito con useGrouping para punto de miles
const _nfEur  = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:0,useGrouping:true});
const _nfInt  = new Intl.NumberFormat('es-ES',{minimumFractionDigits:0,maximumFractionDigits:0,useGrouping:true});
const _nfDec1 = new Intl.NumberFormat('es-ES',{minimumFractionDigits:0,maximumFractionDigits:1,useGrouping:true});
function fmt(n)  {
  const s = _nfEur.format(n).replace(/\s*€/,'€');
  return n < 0 ? `<span style="color:var(--red)">${s}</span>` : s;
}
function fmtN(n) { return _nfInt.format(n); }
function fmtK(n) {
  if (n >= 1e6) return _nfDec1.format(n/1e6) + 'M€';
  if (n >= 1e3) return _nfInt.format(Math.round(n/1e3)) + 'K€';
  return _nfInt.format(Math.round(n)) + '€';
}

function normNoSpace(s) { return norm(s).replace(/\s+/g,''); }

// ── DETECCIÓN DE PUBLICACIÓN POR PALABRAS COMPLETAS ─────────────────────────
// Evita falsos positivos de subcadena: "elle" dentro de "belleza", "mens" dentro de "mensual",
// "book" dentro de "facebook"...
function _tokensAlnum(str) {
  return String(str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .split(/[^a-z0-9]+/).filter(Boolean);
}
function _fragTarget(frag) {
  return String(frag).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '');
}
// ¿La búsqueda contiene el fragmento como palabra(s) completa(s)? (admite "harper's bazaar", "harpersbazaar"…)
function queryHasWholeFragment(raw, frag) {
  const toks = _tokensAlnum(raw), target = _fragTarget(frag);
  for (let i = 0; i < toks.length; i++) {
    let cat = '';
    for (let j = i; j < toks.length; j++) {
      cat += toks[j];
      if (cat === target) return true;
      if (!target.startsWith(cat)) break;
    }
  }
  return false;
}
// Quita de un texto normalizado las palabras que forman el fragmento (solo palabras completas)
function removeWholeFragment(text, frag) {
  const toks = text.split(/\s+/), target = _fragTarget(frag);
  for (let i = 0; i < toks.length; i++) {
    let cat = '';
    for (let j = i; j < toks.length; j++) {
      cat += toks[j].replace(/[^a-z0-9]/g, '');
      if (cat === target) { for (let k = i; k <= j; k++) toks[k] = ' '; return toks.join(' '); }
      if (!target.startsWith(cat)) break;
    }
  }
  return text;
}

// ── LECTURA ROBUSTA DE IMPORTES Y MESES ─────────────────────────────────────
let DATA_WARN = { importes: 0, meses: {}, sinOficina: [] };
function resetDataWarn() { DATA_WARN = { importes: 0, meses: {}, sinOficina: [] }; }
// La cabecera real puede ser "Oficina de venta / Centro de coste de la orden" (o una versión más corta)
function findOficinaKey(sampleRow) {
  return sampleRow ? Object.keys(sampleRow).find(k => /^oficina\s+de\s+venta/i.test(k.trim())) || null : null;
}

// Admite números y textos: "1.234,56", "1,234.56", "1234,56", "-1.234,56", "(1.234,56)", "1.234 €"
function parseImporte(v) {
  if (typeof v === 'number') return isFinite(v) ? v : NaN;
  let s = String(v == null ? '' : v).trim();
  if (!s) return 0;
  let neg = false;
  if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
  s = s.replace(/[€\s\u00a0]/g, '').replace(/eur$/i, '');
  if (s.endsWith('-')) { neg = true; s = s.slice(0, -1); }
  if (s.startsWith('-')) { neg = true; s = s.slice(1); }
  if (s.startsWith('+')) s = s.slice(1);
  if (!s) return 0;
  if (!/^[\d.,]+$/.test(s)) return NaN;
  const lastDot = s.lastIndexOf('.'), lastComma = s.lastIndexOf(',');
  let dec = null;
  if (lastDot >= 0 && lastComma >= 0) dec = lastDot > lastComma ? '.' : ',';
  else if (lastComma >= 0) dec = (s.split(',').length > 2) ? null : ',';
  else if (lastDot >= 0) dec = /^\d{1,3}(\.\d{3})+$/.test(s) ? null : '.';
  let t = dec === '.' ? s.replace(/,/g, '')
        : dec === ','  ? s.replace(/\./g, '').replace(',', '.')
        : s.replace(/[.,]/g, '');
  const n = parseFloat(t);
  if (isNaN(n)) return NaN;
  return neg ? -n : n;
}
function readImporte(v) {
  const n = parseImporte(v);
  if (isNaN(n)) { DATA_WARN.importes++; return 0; }
  return n;
}

// Devuelve el mes en formato canónico ("01 Enero"), '' si está vacío, o null si no se reconoce.
// Admite: "01 Enero", "Enero", "ENE", "ene-26", "1", "01", 3 (número de Excel), "Jan"...
function parseMes(v) {
  if (typeof v === 'number') return (Number.isInteger(v) && v >= 1 && v <= 12) ? MESES[v - 1] : null;
  const n = norm(v);
  if (!n) return '';
  const MAP = {ene:0,jan:0,feb:1,mar:2,abr:3,apr:3,may:4,jun:5,jul:6,ago:7,aug:7,sep:8,set:8,oct:9,nov:10,dic:11,dec:11};
  const mName = n.match(/[a-z]{3,}/);
  if (mName && MAP[mName[0].slice(0, 3)] !== undefined) return MESES[MAP[mName[0].slice(0, 3)]];
  const mNum = n.match(/^(\d{1,2})(?!\d)/);
  if (mNum) { const i = parseInt(mNum[1], 10); if (i >= 1 && i <= 12) return MESES[i - 1]; }
  return null;
}
function readMes(v) {
  const m = parseMes(v);
  if (m === null) {
    const orig = String(v).trim();
    DATA_WARN.meses[orig] = (DATA_WARN.meses[orig] || 0) + 1;
    return orig;
  }
  return m;
}
function dataWarnMsg() {
  const out = [];
  if (DATA_WARN.importes) out.push(fmtN(DATA_WARN.importes) + ' importes no legibles (contados como 0)');
  const ms = Object.keys(DATA_WARN.meses);
  if (DATA_WARN.sinOficina.length) out.push('no se encontró la columna «Oficina de venta» en ' + DATA_WARN.sinOficina.join(', '));
  if (ms.length) out.push('meses no reconocidos: ' + ms.slice(0, 5).map(m => '«' + m + '»').join(', ') + (ms.length > 5 ? '…' : ''));
  if (out.length) console.warn('Avisos de carga:', DATA_WARN);
  return out.length ? ' · ⚠️ ' + out.join(' · ') : '';
}

// ── BÚSQUEDA LIBRE TOLERANTE (plurales + errores de una letra) ─────────────
const _VOCAB_FIELDS = ['anunciante','marca','detalle','oficina'];
let _VOCAB = null, _VOCAB_N = -1;
function getVocab() {
  if (_VOCAB && _VOCAB_N === DATA.length) return _VOCAB;
  const m = new Map();
  DATA.forEach(r => _VOCAB_FIELDS.forEach(f => {
    norm(r[f] || '').split(/[^a-z0-9]+/).forEach(w => { if (w.length >= 4) m.set(w, (m.get(w) || 0) + 1); });
  }));
  _VOCAB = m; _VOCAB_N = DATA.length;
  return m;
}
// Variantes de singular/plural de una palabra (coches→coche, mujeres→mujer)
function stemVariants(t) {
  const v = [t];
  if (t.length >= 4 && t.endsWith('s')) {
    v.push(t.slice(0, -1));
    if (t.length >= 6 && t.endsWith('es') && 'rlnzdj'.includes(t[t.length - 3])) v.push(t.slice(0, -2));
  }
  return v;
}
// ¿Difieren a lo sumo en 1 letra (sustitución, inserción, borrado o letras intercambiadas)?
function edit1(a, b) {
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  let i = 0;
  while (i < la && i < lb && a[i] === b[i]) i++;
  if (i === la && i === lb) return true;
  if (la === lb) {
    if (a.slice(i + 1) === b.slice(i + 1)) return true;
    return a[i] === b[i + 1] && a[i + 1] === b[i] && a.slice(i + 2) === b.slice(i + 2);
  }
  return la > lb ? a.slice(i + 1) === b.slice(i) : b.slice(i + 1) === a.slice(i);
}
// Devuelve { test(contenido), avisos[] }: cada palabra libre acepta sus variantes de plural
// y, si no existe en los datos (palabras de 5+ letras), hasta 3 palabras reales a 1 letra de distancia.
function buildFreeMatcher(tokens) {
  const vocab = getVocab();
  const avisos = [];
  const groups = tokens.map(t => {
    const variants = stemVariants(t);
    if (t.length >= 5 && /^[a-z]+$/.test(t)) {
      let found = false;
      for (const w of vocab.keys()) { if (variants.some(v => w.includes(v))) { found = true; break; } }
      if (!found) {
        const cands = [];
        for (const [w, c] of vocab) { if (edit1(t, w)) cands.push([w, c]); }
        cands.sort((x, y) => y[1] - x[1]);
        const top = cands.slice(0, 3).map(x => x[0]);
        if (top.length) { avisos.push({ orig: t, corr: top }); return variants.concat(top); }
      }
    }
    return variants;
  });
  return { test: content => groups.every(g => g.some(v => content.includes(v))), avisos };
}

function cleanSector(s) { return s ? s.replace(/^\d+\s*[\*\+]\s*/,'').trim() : ''; }

function getZona(area) {
  if (!area) return null;
  const a = area.toUpperCase().trim();
  for (const [zona, areas] of Object.entries(ZONAS)) {
    if (areas.some(z => a.includes(z) || z.includes(a))) return zona;
  }
  return null;
}

function leerFechaMeta(wb) {
  const metaSheet = wb.SheetNames.find(n => /^meta$/i.test(n.trim()) || /^fecha$/i.test(n.trim()));
  if (!metaSheet) return null;
  const ws = wb.Sheets[metaSheet];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1,defval:''});
  for (const row of rows) {
    for (const cell of row) {
      if (cell instanceof Date && !isNaN(cell)) return cell;
      if (typeof cell === 'number' && cell > 40000 && cell < 60000) {
        const d = new Date(Math.round((cell - 25569)*86400*1000));
        if (!isNaN(d)) return d;
      }
    }
  }
  return null;
}

async function loadFromSharePoint() {
  const statusEl = document.getElementById('status');
  let allRows = [], errors = [], fileDates = [];
  resetDataWarn();

  for (const src of EXCEL_SOURCES) {
    statusEl.textContent = '⏳ Cargando ' + src.name + '...';
    try {
      const res = await fetch(src.url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('text/html')) throw new Error('Error de autenticación');
      const buffer = await res.arrayBuffer();
      const wb = XLSX.read(buffer, {type:'array'});

      const fechaMeta = leerFechaMeta(wb);
      if (fechaMeta) fileDates.push({ canal: src.canal, fecha: fechaMeta });

      const sheetName = wb.SheetNames.includes(SHEET_NAME) ? SHEET_NAME : wb.SheetNames[0];
      const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {defval:''});
      const detalleKey = raw.length ? Object.keys(raw[0]).find(k => k.toLowerCase().trim() === 'detalle') : null;
      const oficinaKey = raw.length ? findOficinaKey(raw[0]) : null;
      if (raw.length && !oficinaKey) DATA_WARN.sinOficina.push(src.name);

      const rowsRaw = raw.map(row => ({
        pub: (row['Publicación'] || '').trim(),
        mes: readMes(row['Mes inserción']),
        year: String(row['Año inserción'] || '').trim(),
        ingreso: readImporte(row['Imp.Neto a Comisionar']),
        familia: (row['Familia'] || '').trim(),
        area: (row['ÁREAS'] || '').trim(),
        sector: cleanSector((row['Sector'] || '').trim()),
        producto: (row['Producto'] || '').trim(),
        anunciante: (row['Anunciante'] || '').trim(),
        marca: (row['Marca'] || '').trim(),
        comercial: (row['Comercial'] || '').trim(),
        detalle: (detalleKey ? row[detalleKey] : (row['Detalle'] || '')).toString().trim(),
        oficina: String((oficinaKey ? row[oficinaKey] : '') || '').trim(),
        _canal: src.canal
      })).filter(r => r.pub);

      const rows = [];
      rowsRaw.forEach(row => {
        const pubNorm = row.pub.toLowerCase().trim().replace(/\/+$/,'');
        if (pubNorm === 'www.elle.com/es') {
          const d = row.detalle.toLowerCase();
          if (d.includes('elle.com/es/gourmet')) { rows.push({...row, pub:'www.elle.com/es/gourmet/'}); return; }
          if (d.includes('living/viajes') || d.includes('elle.com/es/travel')) { rows.push({...row, pub:'www.elle.com/es/travel/'}); return; }
        }
        rows.push(row);
      });

      allRows = allRows.concat(rows);
    } catch(err) {
      console.error('✗', src.name, err);
      errors.push(src.name);
    }
  }

  if (allRows.length === 0) {
    statusEl.textContent = '⚠️ No se pudieron cargar los archivos desde SharePoint.';
    statusEl.className = 'status-error';
    document.getElementById('uploadFallback').style.display = 'block';
    return;
  }

  DATA = allRows;
  FILTERED = DATA;

  // Fecha de actualización (más reciente entre los 3 archivos)
  let fechaTxt = '';
  if (fileDates.length) {
    const latest = fileDates.sort((a,b) => b.fecha - a.fecha)[0];
    fechaTxt = ' · 🗓️ Actualizado: ' + latest.fecha.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
  }

  const errMsg = errors.length ? ' · ⚠️ No cargó: ' + errors.join(', ') : '';
  statusEl.textContent = '✅ ' + fmtN(DATA.length) + ' filas cargadas (Digital + Print + Eventos)' + fechaTxt + errMsg + dataWarnMsg();
  statusEl.className = 'status-ok';

  buildFilters();
  buildChips();
  document.getElementById('mainContent').classList.remove('hidden');
}

function loadManualFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    resetDataWarn();
    const wb = XLSX.read(e.target.result, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(ws, {defval:''});
    const oficinaKey = raw.length ? findOficinaKey(raw[0]) : null;
    if (raw.length && !oficinaKey) DATA_WARN.sinOficina.push(file.name);
    DATA = raw.map(row => ({
      pub:(row['Publicación']||'').trim(), mes:readMes(row['Mes inserción']),
      year:String(row['Año inserción']||''), ingreso:readImporte(row['Imp.Neto a Comisionar']),
      familia:(row['Familia']||'').trim(), area:(row['ÁREAS']||'').trim(),
      sector:cleanSector((row['Sector']||'').trim()), producto:(row['Producto']||'').trim(),
      anunciante:(row['Anunciante']||'').trim(), marca:(row['Marca']||'').trim(),
      comercial:(row['Comercial']||'').trim(), detalle:(row['Detalle']||'').toString().trim(),
      oficina:String((oficinaKey ? row[oficinaKey] : '')||'').trim(), _canal:'DIGITAL'
    })).filter(r=>r.pub);
    FILTERED = DATA;
    document.getElementById('status').textContent = '✅ ' + fmtN(DATA.length) + ' filas cargadas desde ' + file.name + dataWarnMsg();
    document.getElementById('status').className = 'status-ok';
    buildFilters(); buildChips();
    document.getElementById('mainContent').classList.remove('hidden');
  };
  reader.readAsArrayBuffer(file);
}

function buildFilters() {
  const anios = [...new Set(DATA.map(r=>r.year))].filter(Boolean).sort();
  const pubs = [...new Set(DATA.map(r=>r.pub))].filter(Boolean).sort();
  const sAnio = document.getElementById('filterAnio');
  const sPub = document.getElementById('filterPub');
  const sMes = document.getElementById('filterMes');
  const currentYear = String(new Date().getFullYear());
  anios.forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a;if(a===currentYear)o.selected=true;sAnio.appendChild(o);});
  pubs.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;sPub.appendChild(o);});
  MESES.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;sMes.appendChild(o);});
  [sAnio,sMes,sPub].forEach(s=>s.addEventListener('change', applyFilters));
  // Aplicar filtro de año actual al arrancar
  applyFilters();
}

function applyFilters() {
  const anio = document.getElementById('filterAnio').value;
  const mes = document.getElementById('filterMes').value;
  const pub = document.getElementById('filterPub').value;
  let base = currentCanal === 'TODOS' ? DATA : DATA.filter(r=>r._canal===currentCanal);
  FILTERED = base.filter(r =>
    (!anio || r.year === anio) &&
    (!mes || norm(r.mes) === norm(mes)) &&
    (!pub || r.pub === pub)
  );
}

function clearFilters(keepYear = false) {
  if (keepYear) {
    ['filterMes','filterPub'].forEach(id=>document.getElementById(id).value='');
  } else {
    ['filterAnio','filterMes','filterPub'].forEach(id=>document.getElementById(id).value='');
  }
  applyFilters();
}

function setCanal(canal, el) {
  currentCanal = canal;
  document.querySelectorAll('.canal-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  clearFilters(true);
  
  // Si hay una búsqueda escrita, volver a ejecutarla con el nuevo canal
  const queryInput = document.getElementById('queryInput');
  if (queryInput && queryInput.value.trim()) {
    runQuery();
  }
}

function agg(data, keyFn) {
  const map = {};
  data.forEach(r => {
    const k = keyFn(r) || '(Sin valor)';
    if (!map[k]) map[k] = {key:k, total:0, count:0};
    map[k].total += r.ingreso;
    map[k].count++;
  });
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

function mesIdx(s) {
  const n = norm(s);
  const i = MESES.findIndex(m => norm(m).includes(n.slice(0,3)) || n.includes(norm(m).slice(3,6)));
  return i >= 0 ? i : 99;
}

function bars(title, rows, icon, top, color) {
  top = top||12; color = color||CANAL_COLORS[currentCanal];
  const slice = rows.slice(0,top), max = slice[0]?.total||1;
  const b = slice.map(r=>`
    <div class="bar-row">
      <span class="bar-lbl" title="${r.key}">${r.key}</span>
      <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.total/max*100)}%;background:${color}"></div></div>
      <span class="bar-val">${fmt(r.total)}</span>
    </div>`).join('');
  return `<div class="result-card"><h3><span class="ico">${icon}</span>${title}</h3>${b}</div>`;
}

function tbl(title, headers, rows, icon) {
  icon = icon||'📋';
  const ths = headers.map(h=>`<th>${h}</th>`).join('');
  const trs = rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i>0?'num':''}">${c}</td>`).join('')}</tr>`).join('');
  return `<div class="result-card"><h3><span class="ico">${icon}</span>${title}</h3>
    <table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
}

  'social organic': _PRODUCTOS_SOCIAL_ORGANICO,

};

// Etiquetas bonitas para mostrar (en vez del alias tal cual escrito)
const _PROD_GRUPO_LABEL = {
  'social paid': 'Social Paid',
  'paid social': 'Social Paid',
  'social organico': 'Social Organic',
  'social organica': 'Social Organic',
  'social organic': 'Social Organic',
  'organico social': 'Social Organic',

};

// Función para detectar grupo de producto desde query (qNorm ya normalizada)
function detectarGrupoProducto(qNorm) {
  const aliasOrdenados = Object.keys(_PROD_GRUPO).sort((a,b) => b.length - a.length);
  for (const alias of aliasOrdenados) {
    const aliasNorm = norm(alias);
    if (qNorm.includes(aliasNorm)) {
      return { alias: alias, productos: _PROD_GRUPO[alias], label: _PROD_GRUPO_LABEL[alias] || alias };
    }
  }
  return null;
}

// Función para detectar familia desde query
function detectarFamilia(qNorm) {
  // qNorm ya viene normalizado desde runQuery
  
  // 1. Buscar en alias exactos PRIMERO (más largos primero para match greedy)
  //    Esto permite que "programatica directa" se detecte antes que "programatica"
  const aliasOrdenados = Object.keys(_FAM_EXACTO).sort((a,b) => b.length - a.length);
  for (const alias of aliasOrdenados) {
    const aliasNorm = norm(alias);
    if (qNorm.includes(aliasNorm)) {
      return { tipo: 'exacto', alias: alias, familia: _FAM_EXACTO[alias], label: _FAM_EXACTO[alias] };
    }
  }
  
  // 2. Buscar en grupos (más largos primero)
  const gruposOrdenados = Object.keys(_FAM_GRUPO).sort((a,b) => b.length - a.length);
  for (const alias of gruposOrdenados) {
    const aliasNorm = norm(alias);
    if (qNorm.includes(aliasNorm)) {
      return { tipo: 'grupo', alias: alias, familias: _FAM_GRUPO[alias], label: alias };
    }
  }
  
  // 3. Buscar familia canónica directamente en la query
  const canonicasOrdenadas = _FAMILIAS_CANONICAS.slice().sort((a,b) => b.length - a.length);
  for (const fam of canonicasOrdenadas) {
    const famNorm = norm(fam);
    if (qNorm.includes(famNorm)) {
      return { tipo: 'exacto', alias: null, familia: fam, label: fam };
    }
  }
  
  return null;
}


// Función para extraer términos compuestos de una query
function extraerTerminosCompuestos(queryNorm) {
  const encontrados = [];
  let queryRestante = queryNorm;
  
  for (const tc of TODOS_TERMINOS_COMPUESTOS) {
    const tcNorm = norm(tc.texto);
    if (queryRestante.includes(tcNorm)) {
      encontrados.push({
        termino: tcNorm,
        tipo: tc.tipo,
        campo: tc.campo,
        original: tc.texto
      });
      queryRestante = queryRestante.replace(tcNorm, ' ').replace(/\s+/g, ' ').trim();
    }
  }
  
  return { encontrados, queryRestante };
}

// Función para detectar el tipo de un término simple
function detectarTipoTermino(termino) {
  const t = norm(termino);
  if (CONOCIDOS_COMERCIALES.has(t)) return { tipo: 'comercial', campo: 'comercial' };
  if (CONOCIDOS_SECTORES.has(t)) return { tipo: 'sector', campo: 'sector' };
  if (CONOCIDOS_FAMILIAS_SIMPLES.has(t)) return { tipo: 'familia', campo: 'familia' };
  if (CONOCIDOS_PRODUCTOS_SIMPLES.has(t)) return { tipo: 'producto', campo: 'producto' };
  // Buscar coincidencias parciales
  for (const c of CONOCIDOS_COMERCIALES) if (c.includes(t) || t.includes(c.split(' ')[0])) return { tipo: 'comercial', campo: 'comercial' };
  for (const s of CONOCIDOS_SECTORES) if (s.includes(t) || t.includes(s.split(' ')[0])) return { tipo: 'sector', campo: 'sector' };
  return null;
}

// Detecta si la query contiene un mes y devuelve el valor canónico ("01 Enero", etc.) o null
function detectMes(q) {
  // Iterar del más largo al más corto para evitar que "mar" matchee "marzo" antes que "marzo"
  const sorted = Object.keys(MES_ALIAS).sort((a,b) => b.length - a.length);
  for (const alias of sorted) {
    // Debe estar como palabra completa (bordes de palabra o inicio/fin de string)
    const re = new RegExp('(?:^|\\s)' + alias + '(?:\\s|$)');
    if (re.test(q)) return MES_ALIAS[alias];
  }
  return null;
}

// ─── FUSIÓN DE VENTAS CONJUNTAS MADRID + BARCELONA ───────────────────────────
// Cuando una misma campaña se reparte en el Excel entre un comercial de Madrid
// y otro de Barcelona (misma línea partida en dos), se fusionan en una sola
// fila con los dos nombres de comercial y el importe sumado. Aplica tanto a
// líneas positivas como a reparos (negativas), emparejando 1 a 1 por importe
// exacto dentro de un mismo anunciante+marca+publicación+producto+mes+año.
function mergeVentasConjuntas(hits) {
  const groups = new Map();
  hits.forEach(r => {
    const key = [norm(r.anunciante), norm(r.marca), norm(r.pub), norm(r.producto), r.mes, r.year].join('|||');
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  });

  const result = [];
  groups.forEach(items => {
    const byImporte = new Map();
    items.forEach(r => {
      const k = Math.round((r.ingreso || 0) * 100);
      if (!byImporte.has(k)) byImporte.set(k, []);
      byImporte.get(k).push(r);
    });
    byImporte.forEach(list => {
      const madrid = list.filter(r => getZona(r.area) === 'Madrid');
      const barcelona = list.filter(r => getZona(r.area) === 'Barcelona');
      const usados = new Set([...madrid, ...barcelona]);
      const otros = list.filter(r => !usados.has(r));
      const pairs = Math.min(madrid.length, barcelona.length);
      for (let i = 0; i < pairs; i++) {
        const m = madrid[i], b = barcelona[i];
        if (norm(m.comercial) !== norm(b.comercial)) {
          result.push({ ...m, comercial: (m.comercial || '—') + ' + ' + (b.comercial || '—'), ingreso: (m.ingreso || 0) + (b.ingreso || 0) });
        } else {
          result.push(m, b);
        }
      }
      for (let i = pairs; i < madrid.length; i++) result.push(madrid[i]);
      for (let i = pairs; i < barcelona.length; i++) result.push(barcelona[i]);
      otros.forEach(r => result.push(r));
    });
  });
  return result;
}

// ─── BLOQUE DE INSERCIONES (colapsable) ──────────────────────────────────────

  if (!hits || hits.length === 0) return '';
