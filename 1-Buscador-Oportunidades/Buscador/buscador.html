<style>
:root {
  --bg: #f4f5f7; --bg2: #ffffff; --bg3: #f0f1f4;
  --border: rgba(0,0,0,0.08);
  --text: #1a1a2e; --text2: #3a3a5c; --text3: #7a7a9a;
  --accent: #2563eb; --green: #16a34a; --red: #dc2626;
  --purple: #7c3aed; --orange: #f59e0b;
  --radius: 10px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5; min-height: 100vh; }

/* TOPBAR */
.topbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; height: 52px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
.topbar-brand { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.topbar-right { display: flex; align-items: center; gap: 12px; }
.date-badge { font-size: 11px; color: var(--text3); background: var(--bg3); padding: 3px 10px; border-radius: 20px; }

/* STATUS */
#status { padding: 10px 24px; background: var(--bg3); border-bottom: 1px solid var(--border); font-size: 12px; }
.status-loading { color: var(--text3); }
.status-ok { color: var(--green); }
.status-error { color: var(--red); }

/* UPLOAD FALLBACK */
.upload-fallback { display: none; padding: 10px 24px; background: #fff8f0; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text3); }
.upload-fallback label { cursor: pointer; color: var(--accent); text-decoration: underline; }

/* STATS */


/* CANAL TABS */
.canal-tabs { display: flex; gap: 6px; padding: 0 24px 12px; }
.section-title { font-size: 22px; font-weight: 700; color: var(--text); padding: 28px 24px 16px; text-align: center; }
.canal-tab { padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg2); color: var(--text2); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; }
.canal-tab:hover { border-color: var(--accent); color: var(--accent); }
.canal-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.canal-tab.digital.active { background: var(--accent); border-color: var(--accent); }
.canal-tab.print.active { background: var(--purple); border-color: var(--purple); }
.canal-tab.eventos.active { background: var(--orange); border-color: var(--orange); }

/* SEARCH */
.search-wrap { background: var(--bg2); margin: 8px 24px 16px; border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; }
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.filter-row label { font-size: 11px; color: var(--text3); }
.filter-row select { padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; font-family: 'DM Sans', sans-serif; background: var(--bg3); color: var(--text); outline: none; }
.filter-row select:focus { border-color: var(--accent); }
.filter-row button { padding: 5px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; background: var(--bg2); color: var(--text2); cursor: pointer; }
.filter-row button:hover { background: var(--bg3); }
.search-row { display: flex; gap: 8px; margin-bottom: 12px; }
.search-row input { flex: 1; font-size: 14px; padding: 10px 14px; border: 2px solid #bfdbfe; border-radius: 8px; outline: none; font-family: 'DM Sans', sans-serif; background: #eff6ff; color: var(--text); }
.search-row input:focus { border-color: var(--accent); background: #e0eeff; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
.search-row input::placeholder { color: #93afd4; }
.search-row button { padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; }
.search-row button:hover { opacity: 0.9; }
.mic-btn { padding: 10px 14px; background: var(--bg2); color: var(--accent); border: 2px solid #bfdbfe; border-radius: 8px; font-size: 15px; cursor: pointer; transition: all 0.15s; }
.mic-btn:hover { background: #eff6ff; }
.mic-btn.listening { background: var(--red); border-color: var(--red); color: #fff; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.6;} }
.mic-btn.unsupported { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 11px; padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2); cursor: pointer; transition: all 0.15s; }
.chip:hover { background: #eef4ff; border-color: var(--accent); color: var(--accent); }

/* RESULTS */
.results { padding: 0 24px 32px; }
.result-card { background: var(--bg2); border-radius: var(--radius); border: 1px solid var(--border); padding: 16px; margin-bottom: 14px; }
.result-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; color: var(--text); }
.result-card h3 .ico { font-size: 16px; }

/* BARS */
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; font-size: 12px; }
.bar-lbl { min-width: 150px; max-width: 200px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-wrap { flex: 1; background: var(--bg3); border-radius: 4px; height: 7px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; }
.bar-val { min-width: 90px; text-align: right; color: var(--text2); font-family: 'DM Mono', monospace; font-size: 11px; }

/* TABLE */
table { width: 100%; border-collapse: collapse; font-size: 12px; }
thead th { text-align: center; color: var(--text3); font-weight: 500; padding: 5px 8px; border-bottom: 1px solid var(--border); }
tbody td { padding: 7px 8px; border-bottom: 1px solid var(--bg3); color: var(--text); text-align: center; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--bg3); }
.num { text-align: center; font-family: 'DM Mono', monospace; }

/* TREND */
.up { color: var(--green); } .dn { color: var(--red); }

/* SUMMARY STATS */
.sum-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.sum-stat { background: var(--bg3); border-radius: 8px; padding: 10px 14px; }
.sum-stat .v { font-size: 17px; font-weight: 600; }
.sum-stat .l { font-size: 11px; color: var(--text3); }

/* CANAL PILL */
.pill { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 10px; margin-right: 4px; }
.pill.DIGITAL { background: #dbeafe; color: #1d4ed8; }
.pill.PRINT { background: #ede9fe; color: #6d28d9; }
.pill.EVENTOS { background: #fef3c7; color: #b45309; }

.hidden { display: none; }

/* INSERCIONES BLOCK */
.ins-block { background: var(--bg2); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 14px; overflow: hidden; }
.ins-block-header { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; cursor: pointer; user-select: none; }
.ins-block-header:hover { background: var(--bg3); }
.ins-block-header h3 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--text); margin: 0; }
.ins-block-toggle { font-size: 11px; color: var(--text3); display: flex; align-items: center; gap: 6px; }
.ins-block-body { display: none; border-top: 1px solid var(--border); }
.ins-block-body.open { display: block; }
.ins-detect { font-size: 11px; color: var(--text2); padding: 10px 16px; background: var(--bg3); border-bottom: 1px solid var(--border); }
.ins-table-wrap { overflow-x: auto; max-height: 420px; overflow-y: auto; }
.ins-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.ins-table thead th { position: sticky; top: 0; background: var(--bg3); text-align: left; color: var(--text3); font-weight: 500; padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; z-index: 1; }
.ins-table thead th.r { text-align: right; }
.ins-table thead th.c { text-align: center; }
.ins-table tbody td { padding: 6px 10px; border-bottom: 1px solid var(--bg3); color: var(--text); }
.ins-table tbody td.r { text-align: right; font-family: 'DM Mono', monospace; font-size: 11px; }
.ins-table tbody td.c { text-align: center; }
.ins-table tbody tr:last-child td { border-bottom: none; }
.ins-table tbody tr:hover td { background: #f0f4ff; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand"><div class="dot"></div>Actividad Comercial · Hearst España</div>
  <div class="topbar-right">
    <a class="date-badge" id="sourceBadge" href="https://hearstspain-my.sharepoint.com/:x:/g/personal/japaricio_hearst_es" target="_blank" style="text-decoration:none">📂 SharePoint · japaricio_hearst_es</a>
  </div>
</div>

<div id="status" class="status-loading">⏳ Conectando con SharePoint...</div>
<div class="upload-fallback" id="uploadFallback">
  No se pudo cargar automáticamente. <label>Selecciona un Excel manualmente<input type="file" id="manualFile" accept=".xlsx,.xls" style="display:none" onchange="loadManualFile(this)"></label>
</div>

<div id="mainContent" class="hidden">
  <div class="section-title">Buscador Actividad Comercial</div>
  <div class="canal-tabs">
    <div class="canal-tab active" data-canal="TODOS" onclick="setCanal('TODOS',this)">Todos</div>
    <div class="canal-tab digital" data-canal="DIGITAL" onclick="setCanal('DIGITAL',this)">Digital</div>
    <div class="canal-tab print" data-canal="PRINT" onclick="setCanal('PRINT',this)">Print</div>
    <div class="canal-tab eventos" data-canal="EVENTOS" onclick="setCanal('EVENTOS',this)">Eventos</div>
  </div>

  <div class="search-wrap">
    <div class="filter-row">
      <label>Año:</label>
      <select id="filterAnio"><option value="">Todos</option></select>
      <label>Mes:</label>
      <select id="filterMes"><option value="">Todos</option></select>
      <label>Publicación:</label>
      <select id="filterPub"><option value="">Todas</option></select>
      <button onclick="clearFilters()">✕ Limpiar filtros</button>

    <div class="search-row">
      <input type="text" id="queryInput" placeholder='Ej: "ingresos", "Coca-Cola", "ranking sectores", "top comerciales", "evolución mensual", "belleza"...' />
      <button class="mic-btn" id="micBtn" onclick="toggleVoiceSearch()" title="Buscar por voz">🎤</button>
      <button onclick="runQuery()">🔍 Buscar</button>
    </div>

  <div class="results" id="results"></div>

<script>
const EXCEL_SOURCES = [
  { url: 'https://hearstspain-my.sharepoint.com/personal/japaricio_hearst_es/_layouts/15/download.aspx?share=IQBtUVlYDjlRRoCaM7gsBE1eATJ8miXAVtnTs6Qcuioee-Y', canal: 'DIGITAL', name: 'PRODUCCION DIGITAL.xlsx' },
  { url: 'https://hearstspain-my.sharepoint.com/personal/japaricio_hearst_es/_layouts/15/download.aspx?share=IQCgA4a20KbOTIY3RsToUyewAROi0viVXnYcoXICS4M0cNU', canal: 'PRINT', name: 'PRODUCCION PRINT.xlsx' },
  { url: 'https://hearstspain-my.sharepoint.com/personal/japaricio_hearst_es/_layouts/15/download.aspx?share=IQDZNkSJLhXFToC-uOPwQt-KAcAnft0wGr7bEwH4pJhzMoU', canal: 'EVENTOS', name: 'PRODUCCION EVENTOS.xlsx' }
];
const SHEET_NAME = 'Analizador general';
const MESES = ['01 Enero','02 Febrero','03 Marzo','04 Abril','05 Mayo','06 Junio','07 Julio','08 Agosto','09 Septiembre','10 Octubre','11 Noviembre','12 Diciembre'];

const DIRECT_MAP = {
  'elle decoration':'Elle Decor','www.elledecor.com/es/':'Elle Decor',
  'elle':'Elle','www.elle.com/es/':'Elle',
  'elle gourmet':'Elle Gourmet','www.elle.com/es/gourmet/':'Elle Gourmet',
  'elle travel':'Elle Travel','www.elle.com/es/travel/':'Elle Travel',
  'cosmopolitan':'Cosmopolitan','www.cosmopolitan.com/es/':'Cosmopolitan',
  "harper´s bazaar":"Harper's Bazaar","harper's bazaar":"Harper's Bazaar",'www.harpersbazaar.com/es':"Harper's Bazaar",
  'esquire':'Esquire','www.esquire.com/es/':'Esquire',
  'fotogramas & video':'Fotogramas','fotogramas':'Fotogramas','www.fotogramas.es':'Fotogramas',
  'diez minutos':'Diez Minutos','www.diezminutos.es':'Diez Minutos',
  "men´s health":"Men's Health","men's health":"Men's Health",'www.menshealth.com/es':"Men's Health",
  'car & driver':'Car & Driver','www.caranddriver.com/es/':'Car & Driver',
  "women´s health":"Women's Health","women's health":"Women's Health",'www.womenshealthmag.com/es/':"Women's Health",
  "runner´s world":"Runner's World","runner's world":"Runner's World",'www.runnersworld.com/es/':"Runner's World",
  'nuevo estilo':'Nuevo Estilo / Mi Casa','www.micasarevista.com':'Nuevo Estilo / Mi Casa','www.nuevo-estilo.es':'Nuevo Estilo / Mi Casa'
};

const ZONAS = {
  'Madrid': ['BRAND EXPERIENCE','CLIENT EXPERIENCE LIFESTYLE','CLIENT EXPERIENCE LUJO'],
  'Barcelona': ['CLIENT EXPERIENCE BARCELONA'],
  'Internacional': ['INTERNACIONAL'],
  'Programática': ['PROGRAMÁTICA']
};

const CANAL_COLORS = { DIGITAL: '#2563eb', PRINT: '#7c3aed', EVENTOS: '#f59e0b', TODOS: '#2563eb' };

let DATA = [], FILTERED = [], currentCanal = 'TODOS';

function norm(s) {
  return String(s||'')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/[''´`']/g,'')
    .replace(/\./g,'')
    .replace(/[-_]/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
// Formateadores — forzamos es-ES explícito con useGrouping para punto de miles
const _nfEur  = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:0,useGrouping:true});
const _nfInt  = new Intl.NumberFormat('es-ES',{minimumFractionDigits:0,maximumFractionDigits:0,useGrouping:true});
const _nfDec1 = new Intl.NumberFormat('es-ES',{minimumFractionDigits:0,maximumFractionDigits:1,useGrouping:true});
function fmt(n)  {
  const s = _nfEur.format(n).replace(/\s*€/,'€');
  return n < 0 ? `<span style="color:var(--red)">${s}</span>` : s;
}
function fmtN(n) { return _nfInt.format(n); }
function fmtK(n) {
  if (n >= 1e6) return _nfDec1.format(n/1e6) + 'M€';
  if (n >= 1e3) return _nfInt.format(Math.round(n/1e3)) + 'K€';
  return _nfInt.format(Math.round(n)) + '€';
}

function normNoSpace(s) { return norm(s).replace(/\s+/g,''); }

function cleanSector(s) { return s ? s.replace(/^\d+\s*[\*\+]\s*/,'').trim() : ''; }

function getZona(area) {
  if (!area) return null;
  const a = area.toUpperCase().trim();
  for (const [zona, areas] of Object.entries(ZONAS)) {
    if (areas.some(z => a.includes(z) || z.includes(a))) return zona;
  }
  return null;
}

function leerFechaMeta(wb) {
  const metaSheet = wb.SheetNames.find(n => /^meta$/i.test(n.trim()) || /^fecha$/i.test(n.trim()));
  if (!metaSheet) return null;
  const ws = wb.Sheets[metaSheet];
  const rows = XLSX.utils.sheet_to_json(ws, {header:1,defval:''});
  for (const row of rows) {
    for (const cell of row) {
      if (cell instanceof Date && !isNaN(cell)) return cell;
      if (typeof cell === 'number' && cell > 40000 && cell < 60000) {
        const d = new Date(Math.round((cell - 25569)*86400*1000));
        if (!isNaN(d)) return d;
      }
    }
  }
  return null;
}

async function loadFromSharePoint() {
  const statusEl = document.getElementById('status');
  let allRows = [], errors = [], fileDates = [];

  for (const src of EXCEL_SOURCES) {
    statusEl.textContent = '⏳ Cargando ' + src.name + '...';
    try {
      const res = await fetch(src.url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const ct = res.headers.get('content-type') || '';
      if (ct.includes('text/html')) throw new Error('Error de autenticación');
      const buffer = await res.arrayBuffer();
      const wb = XLSX.read(buffer, {type:'array'});

      const fechaMeta = leerFechaMeta(wb);
      if (fechaMeta) fileDates.push({ canal: src.canal, fecha: fechaMeta });

      const sheetName = wb.SheetNames.includes(SHEET_NAME) ? SHEET_NAME : wb.SheetNames[0];
      const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {defval:''});
      const detalleKey = raw.length ? Object.keys(raw[0]).find(k => k.toLowerCase().trim() === 'detalle') : null;

      const rowsRaw = raw.map(row => ({
        pub: (row['Publicación'] || '').trim(),
        mes: (row['Mes inserción'] || '').trim(),
        year: String(row['Año inserción'] || '').trim(),
        ingreso: parseFloat(row['Imp.Neto a Comisionar']) || 0,
        familia: (row['Familia'] || '').trim(),
        area: (row['ÁREAS'] || '').trim(),
        sector: cleanSector((row['Sector'] || '').trim()),
        producto: (row['Producto'] || '').trim(),
        anunciante: (row['Anunciante'] || '').trim(),
        marca: (row['Marca'] || '').trim(),
        comercial: (row['Comercial'] || '').trim(),
        detalle: (detalleKey ? row[detalleKey] : (row['Detalle'] || '')).toString().trim(),
        oficina: (row['Oficina de venta / Centro de'] || '').trim(),
        _canal: src.canal
      })).filter(r => r.pub);

      const rows = [];
      rowsRaw.forEach(row => {
        const pubNorm = row.pub.toLowerCase().trim().replace(/\/+$/,'');
        if (pubNorm === 'www.elle.com/es') {
          const d = row.detalle.toLowerCase();
          if (d.includes('elle.com/es/gourmet')) { rows.push({...row, pub:'www.elle.com/es/gourmet/'}); return; }
          if (d.includes('living/viajes') || d.includes('elle.com/es/travel')) { rows.push({...row, pub:'www.elle.com/es/travel/'}); return; }
        }
        rows.push(row);
      });

      allRows = allRows.concat(rows);
    } catch(err) {
      console.error('✗', src.name, err);
      errors.push(src.name);
    }
  }

  if (allRows.length === 0) {
    statusEl.textContent = '⚠️ No se pudieron cargar los archivos desde SharePoint.';
    statusEl.className = 'status-error';
    document.getElementById('uploadFallback').style.display = 'block';
    return;
  }

  DATA = allRows;
  FILTERED = DATA;

  // Fecha de actualización (más reciente entre los 3 archivos)
  let fechaTxt = '';
  if (fileDates.length) {
    const latest = fileDates.sort((a,b) => b.fecha - a.fecha)[0];
    fechaTxt = ' · 🗓️ Actualizado: ' + latest.fecha.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
  }

  const errMsg = errors.length ? ' · ⚠️ No cargó: ' + errors.join(', ') : '';
  statusEl.textContent = '✅ ' + fmtN(DATA.length) + ' filas cargadas (Digital + Print + Eventos)' + fechaTxt + errMsg;
  statusEl.className = 'status-ok';

  buildFilters();
  buildChips();
  document.getElementById('mainContent').classList.remove('hidden');
}

function loadManualFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(ws, {defval:''});
    DATA = raw.map(row => ({
      pub:(row['Publicación']||'').trim(), mes:(row['Mes inserción']||'').trim(),
      year:String(row['Año inserción']||''), ingreso:parseFloat(row['Imp.Neto a Comisionar'])||0,
      familia:(row['Familia']||'').trim(), area:(row['ÁREAS']||'').trim(),
      sector:cleanSector((row['Sector']||'').trim()), producto:(row['Producto']||'').trim(),
      anunciante:(row['Anunciante']||'').trim(), marca:(row['Marca']||'').trim(),
      comercial:(row['Comercial']||'').trim(), detalle:(row['Detalle']||'').toString().trim(),
      oficina:(row['Oficina de venta / Centro de']||'').trim(), _canal:'DIGITAL'
    })).filter(r=>r.pub);
    FILTERED = DATA;
    document.getElementById('status').textContent = '✅ ' + fmtN(DATA.length) + ' filas cargadas desde ' + file.name;
    document.getElementById('status').className = 'status-ok';
    buildFilters(); buildChips();
    document.getElementById('mainContent').classList.remove('hidden');
  };
  reader.readAsArrayBuffer(file);
}

function buildFilters() {
  const anios = [...new Set(DATA.map(r=>r.year))].filter(Boolean).sort();
  const pubs = [...new Set(DATA.map(r=>r.pub))].filter(Boolean).sort();
  const sAnio = document.getElementById('filterAnio');
  const sPub = document.getElementById('filterPub');
  const sMes = document.getElementById('filterMes');
  const currentYear = String(new Date().getFullYear());
  anios.forEach(a=>{const o=document.createElement('option');o.value=a;o.textContent=a;if(a===currentYear)o.selected=true;sAnio.appendChild(o);});

  [sAnio,sMes,sPub].forEach(s=>s.addEventListener('change', applyFilters));

}

function applyFilters() {
  const anio = document.getElementById('filterAnio').value;
  const mes = document.getElementById('filterMes').value;
  const pub = document.getElementById('filterPub').value;
  let base = currentCanal === 'TODOS' ? DATA : DATA.filter(r=>r._canal===currentCanal);
  FILTERED = base.filter(r =>
    (!anio || r.year === anio) &&
    (!mes || norm(r.mes) === norm(mes)) &&
    (!pub || r.pub === pub)
  );
}

function clearFilters(keepYear = false) {
  if (keepYear) {
    ['filterMes','filterPub'].forEach(id=>document.getElementById(id).value='');

function agg(data, keyFn) {
  const map = {};
  data.forEach(r => {
    const k = keyFn(r) || '(Sin valor)';
    if (!map[k]) map[k] = {key:k, total:0, count:0};
    map[k].total += r.ingreso;
    map[k].count++;
  });
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

function mesIdx(s) {
  const n = norm(s);
  const i = MESES.findIndex(m => norm(m).includes(n.slice(0,3)) || n.includes(norm(m).slice(3,6)));
  return i >= 0 ? i : 99;
}

  top = top||12; color = color||CANAL_COLORS[currentCanal];

    <div class="bar-row">
      <span class="bar-lbl" title="${r.key}">${r.key}</span>
      <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.total/max*100)}%;background:${color}"></div></div>
      <span class="bar-val">${fmt(r.total)}</span>
    </div>`).join('');
  return `<div class="result-card"><h3><span class="ico">${icon}</span>${title}</h3>${b}</div>`;
}

function tbl(title, headers, rows, icon) {
  icon = icon||'📋';
  const ths = headers.map(h=>`<th>${h}</th>`).join('');
  const trs = rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i>0?'num':''}">${c}</td>`).join('')}</tr>`).join('');
  return `<div class="result-card"><h3><span class="ico">${icon}</span>${title}</h3>
    <table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
}

  for (const alias of aliasOrdenados) {

    if (qNorm.includes(aliasNorm)) {

// Función para detectar familia desde query
function detectarFamilia(qNorm) {
  // qNorm ya viene normalizado desde runQuery
  
  // 1. Buscar en alias exactos PRIMERO (más largos primero para match greedy)
  //    Esto permite que "programatica directa" se detecte antes que "programatica"
  const aliasOrdenados = Object.keys(_FAM_EXACTO).sort((a,b) => b.length - a.length);
  for (const alias of aliasOrdenados) {
    const aliasNorm = norm(alias);
    if (qNorm.includes(aliasNorm)) {
      return { tipo: 'exacto', alias: alias, familia: _FAM_EXACTO[alias], label: _FAM_EXACTO[alias] };
    }
  }
  
  // 2. Buscar en grupos (más largos primero)
  const gruposOrdenados = Object.keys(_FAM_GRUPO).sort((a,b) => b.length - a.length);
  for (const alias of gruposOrdenados) {
    const aliasNorm = norm(alias);
    if (qNorm.includes(aliasNorm)) {
      return { tipo: 'grupo', alias: alias, familias: _FAM_GRUPO[alias], label: alias };
    }
  }
  
  // 3. Buscar familia canónica directamente en la query
  const canonicasOrdenadas = _FAMILIAS_CANONICAS.slice().sort((a,b) => b.length - a.length);
  for (const fam of canonicasOrdenadas) {
    const famNorm = norm(fam);
    if (qNorm.includes(famNorm)) {
      return { tipo: 'exacto', alias: null, familia: fam, label: fam };
    }
  }
  
  return null;
}


// Función para extraer términos compuestos de una query
function extraerTerminosCompuestos(queryNorm) {
  const encontrados = [];
  let queryRestante = queryNorm;
  
  for (const tc of TODOS_TERMINOS_COMPUESTOS) {
    const tcNorm = norm(tc.texto);
    if (queryRestante.includes(tcNorm)) {
      encontrados.push({
        termino: tcNorm,
        tipo: tc.tipo,
        campo: tc.campo,
        original: tc.texto
      });
      queryRestante = queryRestante.replace(tcNorm, ' ').replace(/\s+/g, ' ').trim();
    }
  }
  
  return { encontrados, queryRestante };
}

// Función para detectar el tipo de un término simple
function detectarTipoTermino(termino) {
  const t = norm(termino);
  if (CONOCIDOS_COMERCIALES.has(t)) return { tipo: 'comercial', campo: 'comercial' };
  if (CONOCIDOS_SECTORES.has(t)) return { tipo: 'sector', campo: 'sector' };
  if (CONOCIDOS_FAMILIAS_SIMPLES.has(t)) return { tipo: 'familia', campo: 'familia' };
  if (CONOCIDOS_PRODUCTOS_SIMPLES.has(t)) return { tipo: 'producto', campo: 'producto' };
  // Buscar coincidencias parciales
  for (const c of CONOCIDOS_COMERCIALES) if (c.includes(t) || t.includes(c.split(' ')[0])) return { tipo: 'comercial', campo: 'comercial' };
  for (const s of CONOCIDOS_SECTORES) if (s.includes(t) || t.includes(s.split(' ')[0])) return { tipo: 'sector', campo: 'sector' };
  return null;
}

// Detecta si la query contiene un mes y devuelve el valor canónico ("01 Enero", etc.) o null
function detectMes(q) {
  // Iterar del más largo al más corto para evitar que "mar" matchee "marzo" antes que "marzo"
  const sorted = Object.keys(MES_ALIAS).sort((a,b) => b.length - a.length);
  for (const alias of sorted) {
    // Debe estar como palabra completa (bordes de palabra o inicio/fin de string)
    const re = new RegExp('(?:^|\\s)' + alias + '(?:\\s|$)');
    if (re.test(q)) return MES_ALIAS[alias];
  }
  return null;
}

// ─── FUSIÓN DE VENTAS CONJUNTAS MADRID + BARCELONA ───────────────────────────
// Cuando una misma campaña se reparte en el Excel entre un comercial de Madrid
// y otro de Barcelona (misma línea partida en dos), se fusionan en una sola
// fila con los dos nombres de comercial y el importe sumado. Aplica tanto a
// líneas positivas como a reparos (negativas), emparejando 1 a 1 por importe
// exacto dentro de un mismo anunciante+marca+publicación+producto+mes+año.
function mergeVentasConjuntas(hits) {
  const groups = new Map();
  hits.forEach(r => {
    const key = [norm(r.anunciante), norm(r.marca), norm(r.pub), norm(r.producto), r.mes, r.year].join('|||');
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  });

  const result = [];
  groups.forEach(items => {
    const byImporte = new Map();
    items.forEach(r => {
      const k = Math.round((r.ingreso || 0) * 100);
      if (!byImporte.has(k)) byImporte.set(k, []);
      byImporte.get(k).push(r);
    });
    byImporte.forEach(list => {
      const madrid = list.filter(r => getZona(r.area) === 'Madrid');
      const barcelona = list.filter(r => getZona(r.area) === 'Barcelona');
      const usados = new Set([...madrid, ...barcelona]);
      const otros = list.filter(r => !usados.has(r));
      const pairs = Math.min(madrid.length, barcelona.length);
      for (let i = 0; i < pairs; i++) {
        const m = madrid[i], b = barcelona[i];
        if (norm(m.comercial) !== norm(b.comercial)) {
          result.push({ ...m, comercial: (m.comercial || '—') + ' + ' + (b.comercial || '—'), ingreso: (m.ingreso || 0) + (b.ingreso || 0) });
        } else {
          result.push(m, b);
        }
      }
      for (let i = pairs; i < madrid.length; i++) result.push(madrid[i]);
      for (let i = pairs; i < barcelona.length; i++) result.push(barcelona[i]);
      otros.forEach(r => result.push(r));
    });
  });
  return result;
}

// ─── BLOQUE DE INSERCIONES (colapsable) ──────────────────────────────────────
let _insBlockCounter = 0;

function insertionsBlock(hits, detectadosArr) {
  if (!hits || hits.length === 0) return '';
  const id = 'ins_' + (++_insBlockCounter);
  const MAX = 500;
  const fusionadas = mergeVentasConjuntas(hits);
  const sorted = fusionadas.slice().sort((a,b) => b.ingreso - a.ingreso);
  const mostrar = sorted.slice(0, MAX);
  const detectStr = detectadosArr && detectadosArr.length
    ? '🔎 ' + detectadosArr.join(' · ')
    : '';
  const rows = mostrar.map(r => `
    <tr>
      <td><strong>${r.anunciante||'—'}</strong></td>
      <td>${r.marca||'—'}</td>
      <td>${r.pub||'—'}</td>
      <td>${r.producto||'—'}</td>
      <td>${r.familia||'—'}</td>
      <td>${r.comercial||'—'}</td>
      <td class="c">${r.mes||'—'}</td>
      <td class="c">${r.year||'—'}</td>
      <td class="r">${fmt(r.ingreso)}</td>
    </tr>`).join('');
  const labelExtra = fusionadas.length > MAX ? ` (mostrando ${MAX})` : '';
  return `
  <div class="ins-block" id="${id}_wrap">
    <div class="ins-block-header" onclick="(function(){const b=document.getElementById('${id}');b.classList.toggle('open');document.querySelector('#${id}_wrap .ins-block-toggle').textContent=b.classList.contains('open')?'▲ Ocultar':'▼ Ver listado';})()">
      <h3><span class="ico">📋</span>Listado de inserciones · ${fmtN(fusionadas.length)}${labelExtra}</h3>
      <span class="ins-block-toggle">▼ Ver listado</span>
    </div>
    <div class="ins-block-body" id="${id}">
      ${detectStr ? `<div class="ins-detect">${detectStr}</div>` : ''}
      <div class="ins-table-wrap">
        <table class="ins-table">
          <thead><tr>
            <th>Anunciante</th><th>Marca</th><th>Publicación</th>
            <th>Producto</th><th>Familia</th><th>Comercial</th>
            <th class="c">Mes</th><th class="c">Año</th><th class="r">Importe</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  </div>`;
}

// Devuelve true si la publicación de la fila coincide con el término de publicación detectado
// (usa PUB_MATCH_GROUPS para cubrir print+digital y evita el cruce Men's/Women's Health)
function pubRowMatches(rowPub, pubTerm) {
  const pubMatchFrags = PUB_MATCH_GROUPS[pubTerm] || [normNoSpace(pubTerm)];
  const rp = normNoSpace(rowPub);
  return pubMatchFrags.some(f => {
    if (f === 'menshealth') return rp.includes('menshealth') && !rp.includes('womenshealth');
    return rp.includes(f);
  });
}

function runQuery() {
  const raw = document.getElementById('queryInput').value.trim();
  const q = norm(raw);
  if (!q) return;

  const baseData = FILTERED.length ? FILTERED : DATA;
  const data = currentCanal === 'TODOS' ? baseData : baseData.filter(r => r._canal === currentCanal);
  if (!data.length) return;

  const has = (...t) => t.some(x => q.includes(norm(x)));
  let html = '';

  // ══════════════════════════════════════════════════════════════════════
  // PASO 1: DETECTAR todos los elementos de la query
  // ══════════════════════════════════════════════════════════════════════

  // 1a. Mes (flexible: ene/enero/01 enero)
  const queryMes = detectMes(q);

  // 1b. Publicación (flexible: elle / www.elle.com/es)
  const queryPubTerm = PUB_FRAGMENTS.find(p => normNoSpace(q).includes(normNoSpace(p)));

  // 1c. Producto EXACTO — primero compuestos (más largos), luego simples
  //     Solo si la query contiene el término normalizado completo como palabra
  const queryProductoComp = TERMINOS_COMPUESTOS_PRODUCTOS.find(p => {
    const pn = norm(p);
    const re2 = new RegExp('(^|\\s)' + pn.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '(\\s|$)');
    return re2.test(q);
  });
  const queryProductoSimple = !queryProductoComp
    ? [...CONOCIDOS_PRODUCTOS_SIMPLES].find(p => {
        const re2 = new RegExp('(^|\\s)' + p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '(\\s|$)');
        return re2.test(q);
      })
    : null;
  const queryProductoNorm = queryProductoComp ? norm(queryProductoComp) : (queryProductoSimple || null);
  const queryProductoLabel = queryProductoComp || queryProductoSimple || null;

  // 1c-bis. Grupo de producto (Social Paid / Social Organic / Social Ignition, etc.)
  //     Se detecta antes que familia para que "social paid/organic" no choque con el alias "social" de familia
  const queryProductoGrupo = !queryProductoNorm ? detectarGrupoProducto(q) : null;

  // 1d. Familia — usando nuevo sistema de alias (_FAM_EXACTO, _FAM_GRUPO)
  //     Solo si no se detectó ya como producto exacto ni como grupo de producto
  const _famDetect = (!queryProductoNorm && !queryProductoGrupo) ? detectarFamilia(q) : null;
  const queryFamiliaGrupo = _famDetect?.tipo === 'grupo' ? _famDetect : null;  // {alias, familias[], label}
  const queryFamiliaNorm = _famDetect?.tipo === 'exacto' ? _famDetect.familia : null;
  const queryFamiliaLabel = _famDetect?.label || null;

  // 1e. Sector (token exacto de la lista)
  const querySector = SECTORES_KNOWN.find(s => {
    const sn = norm(s);
    return q.split(' ').some(t => t === sn) || q === sn;
  });

  // 1f. Comercial (parcial)
  const queryComercial = [...CONOCIDOS_COMERCIALES].find(c => q.includes(norm(c)));

  // 1g. Términos libres — lo que queda tras quitar todo lo anterior
  const stopWords = new Set(['en','de','el','la','los','las','un','una','y','o','del','al','con','por','para','a','su','se']);
  let qLibre = q;
  if (queryMes)         qLibre = qLibre.replace(norm(queryMes), ' ');
  if (queryPubTerm) {
    const pubPattern = norm(queryPubTerm).split(/\s+/).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s*');
    qLibre = qLibre.replace(new RegExp(pubPattern), ' ');
  }
  if (queryProductoNorm) qLibre = qLibre.replace(queryProductoNorm, ' ');
  if (queryProductoGrupo) qLibre = qLibre.replace(norm(queryProductoGrupo.alias), ' ');
  // Quitar familia: el alias usado O la familia canónica
  if (_famDetect) {
    const aliasUsado = _famDetect.alias ? norm(_famDetect.alias) : null;
    const famCanonica = _famDetect.familia ? norm(_famDetect.familia) : null;
    const famGrupoLabel = _famDetect.tipo === 'grupo' ? norm(_famDetect.label) : null;
    if (aliasUsado) qLibre = qLibre.replace(aliasUsado, ' ');
    if (famCanonica && famCanonica !== aliasUsado) qLibre = qLibre.replace(famCanonica, ' ');
    if (famGrupoLabel && famGrupoLabel !== aliasUsado) qLibre = qLibre.replace(famGrupoLabel, ' ');
  }
  if (querySector)      qLibre = qLibre.replace(norm(querySector), ' ');
  if (queryComercial)   qLibre = qLibre.replace(norm(queryComercial), ' ');
  const tokensLibres = qLibre.split(/\s+/).filter(t => t.length > 1 && !stopWords.has(t) && !INTENT_WORDS.has(t));

  // ══════════════════════════════════════════════════════════════════════
  // PASO 2: FILTRAR datos en cadena con todo lo detectado
  // ══════════════════════════════════════════════════════════════════════

  // Lógica Elle vs Elle Decor
  const buscoElleSolo  = norm(raw).includes('elle') && !norm(raw).includes('decor') && !norm(raw).includes('decoration') && !norm(raw).includes('decoracion');
  const buscoElleDecor = norm(raw).includes('elle') && (norm(raw).includes('decor') || norm(raw).includes('decoration') || norm(raw).includes('decoracion'));

  function filtrarElleDecor(r) {
    const pubNorm = norm(r.pub);
    const esElleDecor = pubNorm.includes('decor') || pubNorm.includes('decoration');
    if (buscoElleSolo && esElleDecor) return false;
    if (buscoElleDecor && pubNorm.includes('elle') && !esElleDecor) return false;
    return true;
  }

  let base = data;

  // Filtro Elle/Decor siempre
  base = base.filter(r => filtrarElleDecor(r));

  // Filtro pub
  if (queryPubTerm) {
    base = base.filter(r => pubRowMatches(r.pub, queryPubTerm));
  }

  // Filtro mes
  if (queryMes) base = base.filter(r => norm(r.mes) === norm(queryMes));

  // Filtro sector
  if (querySector) base = base.filter(r => norm(r.sector).includes(norm(querySector)));

  // Filtro familia — soporta grupos (_FAM_GRUPO) y exactos (_FAM_EXACTO)
  if (queryFamiliaGrupo) {
    // Grupo: filtra por cualquiera de las familias del grupo
    base = base.filter(r => queryFamiliaGrupo.familias.some(f => norm(r.familia) === norm(f)));
  } else if (queryFamiliaNorm) {
    // Exacto: filtra por una sola familia
    base = base.filter(r => norm(r.familia) === norm(queryFamiliaNorm));
  }

  // Filtro producto (EXACTO)
  if (queryProductoNorm) base = base.filter(r => norm(r.producto) === queryProductoNorm);

  // Filtro grupo de producto (Social Paid / Social Organic / Social Ignition, etc.)
  if (queryProductoGrupo) base = base.filter(r => queryProductoGrupo.productos.some(p => norm(r.producto) === norm(p)));

  // Filtro comercial
  if (queryComercial) base = base.filter(r => norm(r.comercial).includes(norm(queryComercial)));

  // Filtro libre (anunciante, marca, detalle)
  const freeFields = ['anunciante','marca','detalle','oficina'];
  if (tokensLibres.length > 0) {
    base = base.filter(r => {
      const allContent = freeFields.map(f => norm(r[f]||'')).join(' ');
      return tokensLibres.every(t => allContent.includes(t));
    });
  }

  // ══════════════════════════════════════════════════════════════════════
  // PASO 3: DECIDIR QUÉ MOSTRAR según intención de la query
  // ══════════════════════════════════════════════════════════════════════

  const hayDatos   = base.length > 0;
  const hayLibres  = tokensLibres.length > 0;
  const hayFiltros = !!(queryPubTerm || queryMes || querySector || queryFamiliaGrupo || queryFamiliaNorm || queryProductoNorm || queryProductoGrupo || queryComercial || tokensLibres.length > 0);
  const esQueryPura = !hayFiltros;

  const pidePresupuesto = has('presupuesto','ticket medio','insercion media','coste medio','precio medio');
  const pideEvolucion   = has('evolucion','evolución','mensual','por mes','mensualmente');
  const pideSector      = has('sector','sectores') || !!querySector;
  const pideFamilia     = has('familia','familias') || !!queryFamiliaNorm;
  const pideProducto    = has('producto','productos') || !!queryProductoNorm || !!queryProductoGrupo;
  const pideComercial   = has('comercial','comerciales') || !!queryComercial;
  const pideAnunciante  = has('anunciante','anunciantes');
  const pideMarca       = has('marca','marcas');
  const pideArea        = has('area','área','zona','zonas');
  const pideOficina     = has('oficina','centro');
  const pideMix         = has('mix','canal','canales');
  const pideIngresos    = has('ingreso','ingresos','facturacion','facturación','revenue','total','resumen','overview');
  const pideRanking     = has('ranking','top');

  // Etiqueta de filtros aplicados para mostrar en cabecera
  const filtroDesc = [
    queryPubTerm || null,
    queryMes ? queryMes.slice(3) : null,
    querySector || null,
    queryFamiliaLabel || null,
    queryProductoLabel || null,
    queryProductoGrupo ? queryProductoGrupo.label : null,
    queryComercial || null,
    tokensLibres.length > 0 ? tokensLibres.join(' ') : null
  ].filter(Boolean).join(' · ') || 'todos los datos';

  // Construir _det para insertionsBlock
  const _det = [];
  if (queryProductoLabel) _det.push(`<strong>Producto:</strong> ${queryProductoLabel}`);
  if (queryProductoGrupo) _det.push(`<strong>Grupo:</strong> ${queryProductoGrupo.label}`);
  if (queryFamiliaLabel)  _det.push(`<strong>Familia:</strong> ${queryFamiliaLabel}`);
  if (querySector)        _det.push(`<strong>Sector:</strong> ${querySector}`);
  if (queryPubTerm)       _det.push(`<strong>Publicación:</strong> ${queryPubTerm}`);
  if (queryMes)           _det.push(`<strong>Mes:</strong> ${queryMes.slice(3)}`);
  if (queryComercial)     _det.push(`<strong>Comercial:</strong> ${queryComercial}`);
  if (tokensLibres.length > 0) _det.push(`<strong>Búsqueda libre:</strong> ${tokensLibres.join(', ')}`);
  _det.push(`<strong>Año:</strong> ${document.getElementById('filterAnio').value || 'todos'}`);

  // ── PRESUPUESTO MEDIO ───────────────────────────────────────────────
  if (pidePresupuesto) {
    if (!hayDatos) {
      html += '<div class="result-card"><h3><span class="ico">💶</span>Presupuesto medio</h3><p style="color:var(--text3)">No se encontraron inserciones para ese filtro.</p></div>';
    } else {

      // ── CANCELAR REPAROS: agrupa por pub+anunciante+marca+producto (ignora mes y año)
      // 1) Reparo TOTAL: pareja pos/neg con el MISMO importe exacto → se eliminan las DOS líneas
      // 2) Reparo PARCIAL: lo que queda sin pareja exacta se fusiona en una sola línea
      //    con el importe neto (pos + neg), porque esa es la venta real
      // 3) Si solo quedan positivos sin pareja → sin reparo → se quedan tal cual
      const gruposReparo = {};
      base.forEach(r => {
        const key = [norm(r.pub), norm(r.anunciante), norm(r.marca), norm(r.producto)].join('||');
        if (!gruposReparo[key]) gruposReparo[key] = [];
        gruposReparo[key].push(r);
      });

      const baseLimpia = [];
      let nReparos = 0;
      Object.values(gruposReparo).forEach(rows => {
        const pos = rows.filter(r => r.ingreso > 0);
        const neg = rows.filter(r => r.ingreso < 0);
        const usedPos = new Set();
        const usedNeg = new Set();

        // 1) Reparo total: pareja exacta en valor absoluto
        neg.forEach(nr => {
          if (usedNeg.has(nr)) return;
          const absNeg = Math.abs(nr.ingreso);
          const match = pos.find(pr => !usedPos.has(pr) && Math.abs(pr.ingreso - absNeg) < 0.01);
          if (match) { usedPos.add(match); usedNeg.add(nr); nReparos += 2; }
        });

        // 2) Reparo parcial: empareja lo que sobra y fusiona en una línea con el neto
        const posRestantes = pos.filter(pr => !usedPos.has(pr));
        const negRestantes = neg.filter(nr => !usedNeg.has(nr));
        const n = Math.min(posRestantes.length, negRestantes.length);
        for (let k = 0; k < n; k++) {
          const pr = posRestantes[k], nr = negRestantes[k];
          baseLimpia.push({...pr, ingreso: pr.ingreso + nr.ingreso});
          nReparos += 2;
        }

        // 3) Resto de positivos sin pareja → se quedan igual
        for (let k = n; k < posRestantes.length; k++) baseLimpia.push(posRestantes[k]);
        // Negativos sin pareja sin pareja → se quedan igual (no afectan, ya negativos)
        for (let k = n; k < negRestantes.length; k++) baseLimpia.push(negRestantes[k]);
      });

      // ── CALCULAR: con y sin líneas a cero
      const totalP     = baseLimpia.reduce((s,r) => s+r.ingreso, 0);
      const conIngreso = baseLimpia.filter(r => r.ingreso > 0);
      const mediaSin   = conIngreso.length > 0 ? totalP / conIngreso.length : 0;
      const mediaCon   = baseLimpia.length > 0 ? totalP / baseLimpia.length : 0;

      const byPubP  = agg(conIngreso, r=>r.pub).map(r=>({...r,media:r.total/r.count})).sort((a,b)=>b.media-a.media);
      const byProdP = agg(conIngreso, r=>r.producto).map(r=>({...r,media:r.total/r.count})).sort((a,b)=>b.media-a.media).slice(0,8);
      const byMesP  = agg(conIngreso, r=>r.mes).map(r=>({...r,media:r.total/r.count})).sort((a,b)=>mesIdx(a.key)-mesIdx(b.key));

      html += `<div class="result-card">
        <h3><span class="ico">💶</span>Presupuesto medio · <span style="font-weight:400;color:var(--text3)">${filtroDesc}</span></h3>
        <div class="sum-stats">
          <div class="sum-stat"><div class="v">${fmt(mediaSin)}</div><div class="l">presupuesto medio (sin ceros)</div></div>
          <div class="sum-stat"><div class="v">${fmt(mediaCon)}</div><div class="l">presupuesto medio (con ceros)</div></div>
          <div class="sum-stat"><div class="v">${fmtN(conIngreso.length)}</div><div class="l">inserciones con ingreso</div></div>
          <div class="sum-stat"><div class="v">${fmt(totalP)}</div><div class="l">ingreso total</div></div>
          ${nReparos > 0 ? `<div class="sum-stat"><div class="v" style="color:var(--red)">${fmtN(nReparos)}</div><div class="l">reparos cancelados</div></div>` : ''}
        </div></div>`;
      if (byPubP.length>1){const mx=Math.max(...byPubP.map(r=>r.media));html+=`<div class="result-card"><h3><span class="ico">📰</span>Presupuesto medio por publicación</h3>${byPubP.map(r=>`<div class="bar-row"><span class="bar-lbl">${r.key}</span><div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.media/mx*100)}%;background:var(--accent)"></div></div><span class="bar-val">${fmt(r.media)} <span style="color:var(--text3);font-size:11px">(${fmtN(r.count)} ins.)</span></span></div>`).join('')}</div>`;}
      if (byProdP.length>1){const mx=Math.max(...byProdP.map(r=>r.media));html+=`<div class="result-card"><h3><span class="ico">📦</span>Presupuesto medio por producto</h3>${byProdP.map(r=>`<div class="bar-row"><span class="bar-lbl">${r.key}</span><div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.media/mx*100)}%;background:#7c3aed"></div></div><span class="bar-val">${fmt(r.media)} <span style="color:var(--text3);font-size:11px">(${fmtN(r.count)} ins.)</span></span></div>`).join('')}</div>`;}
      if (byMesP.length>1){const mx=Math.max(...byMesP.map(r=>r.media));html+=`<div class="result-card"><h3><span class="ico">📅</span>Presupuesto medio por mes</h3>${byMesP.map(r=>`<div class="bar-row"><span class="bar-lbl">${r.key}</span><div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.media/mx*100)}%;background:#f59e0b"></div></div><span class="bar-val">${fmt(r.media)} <span style="color:var(--text3);font-size:11px">(${fmtN(r.count)} ins.)</span></span></div>`).join('')}</div>`;}
    }
  }

  // ── EVOLUCIÓN MENSUAL ───────────────────────────────────────────────
  // Solo si pide evolución explícitamente, O si hay solo un mes sin producto/familia/sector/libre
  else if (pideEvolucion || (queryMes && !queryProductoNorm && !queryProductoGrupo && !queryFamiliaNorm && !querySector && !queryComercial && tokensLibres.length===0)) {
    const anioActual = document.getElementById('filterAnio').value || String(new Date().getFullYear());
    const anioAnt = String(parseInt(anioActual)-1);
    const aniosDisp = [...new Set(data.map(r=>r.year))].filter(Boolean).sort();
    const hayAnioAnt = aniosDisp.includes(anioAnt);

    function basePub(anio) {
      let b = data.filter(r=>r.year===anio).filter(r=>filtrarElleDecor(r));
      if (queryPubTerm)      b = b.filter(r=>pubRowMatches(r.pub, queryPubTerm));
      if (querySector)       b = b.filter(r=>norm(r.sector).includes(norm(querySector)));
      if (queryFamiliaNorm)  b = b.filter(r=>norm(r.familia).includes(queryFamiliaNorm));
      if (queryProductoNorm) b = b.filter(r=>norm(r.producto) === queryProductoNorm);
      if (queryProductoGrupo) b = b.filter(r=>queryProductoGrupo.productos.some(p => norm(r.producto) === norm(p)));
      if (queryComercial)    b = b.filter(r=>norm(r.comercial).includes(norm(queryComercial)));
      if (tokensLibres.length > 0) {
        const ff = ['anunciante','marca','detalle','oficina'];
        b = b.filter(r=>{ const ac=ff.map(f=>norm(r[f]||'')).join(' '); return tokensLibres.every(t=>ac.includes(t)); });
      }
      return b;
    }

    if (queryMes && !pideEvolucion) {
      // Detalle de un mes concreto
      const mesData = base;
      const totalIng = mesData.reduce((s,r)=>s+r.ingreso,0);
      const byPub = agg(mesData,r=>r.pub).slice(0,10);
      const bySector = agg(mesData,r=>r.sector).slice(0,8);
      const byAnunciante = agg(mesData,r=>r.anunciante).slice(0,10);
      const byCanal = agg(mesData,r=>r._canal);
      html += `<div class="result-card">
        <h3><span class="ico">📅</span>${queryMes.slice(3)}${queryPubTerm?' · '+queryPubTerm:''}</h3>
        <div class="sum-stats">
          <div class="sum-stat"><div class="v">${fmt(totalIng)}</div><div class="l">ingreso total</div></div>
          <div class="sum-stat"><div class="v">${fmtN(mesData.length)}</div><div class="l">inserciones</div></div>
          <div class="sum-stat"><div class="v">${new Set(mesData.map(r=>r.anunciante)).size}</div><div class="l">anunciantes</div></div>
        </div>
        ${byCanal.length>1?'<div style="margin-top:10px">'+byCanal.map(r=>`<span class="pill ${r.key}">${r.key}: ${fmt(r.total)}</span>`).join('')+'</div>':''}
      </div>`;
      if (byPub.length>1) html += bars('Por publicación', byPub, '📰', 10);
      if (bySector.length>1) html += bars('Sectores', bySector, '🏭', 8, '#7c3aed');
      if (byAnunciante.length>1) html += bars('Top anunciantes', byAnunciante, '🏢', 10, '#16a34a');
      html += insertionsBlock(mesData, _det);
    } else {
      // Evolución mensual con comparativa año anterior
      const dataAct = basePub(anioActual);
      const dataAnt = basePub(anioAnt);
      const mapAct={}, mapAnt={};
      dataAct.forEach(r=>{mapAct[norm(r.mes)]=(mapAct[norm(r.mes)]||0)+r.ingreso;});
      dataAnt.forEach(r=>{mapAnt[norm(r.mes)]=(mapAnt[norm(r.mes)]||0)+r.ingreso;});
      const mesesConDatos = MESES.filter(m=>mapAct[norm(m)]>0);
      const maxVal = Math.max(...mesesConDatos.map(m=>Math.max(mapAct[norm(m)]||0,mapAnt[norm(m)]||0)),1);
      const color = CANAL_COLORS[currentCanal];
      const colorAnt = '#cbd5e1';
      const tituloEntidad = queryPubTerm ? ` · ${queryPubTerm}` : '';

      // ── SPARKLINE SVG ──────────────────────────────────────────────────────
      const totalAct = dataAct.reduce((s,r)=>s+r.ingreso,0);
      const totalAnt = dataAnt.reduce((s,r)=>s+r.ingreso,0);
      const varTotal = totalAnt>0 ? ((totalAct-totalAnt)/totalAnt*100) : null;
      const tendPct  = varTotal!==null ? (varTotal>=0?'+':'')+varTotal.toFixed(1)+'%' : '';
      const tendColor = varTotal===null ? '#94a3b8' : (varTotal>=0 ? '#16a34a' : '#dc2626');
      const tendIcon  = varTotal===null ? '→' : (varTotal>=0 ? '▲' : '▼');

      // Construir sparkline con los valores del año actual
      const spW=280, spH=64, spPad=8;
      const spVals = mesesConDatos.map(m=>mapAct[norm(m)]||0);
      const spMin=Math.min(...spVals), spMax=Math.max(...spVals);
      const spRng=spMax-spMin||1;
      const spN=spVals.length;
      const spPts = spVals.map((v,i)=>{
        const x=spPad+(spN===1?(spW-spPad*2)/2:i/(spN-1)*(spW-spPad*2));
        const y=spPad+(spH-spPad*2)-((v-spMin)/spRng*(spH-spPad*2));
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const spLine=spPts.join(' ');
      const spArea=`${spPad},${spH-spPad} ${spLine} ${spW-spPad},${spH-spPad}`;
      const gradId='spg'+Math.floor(Math.random()*99999);

      const sparkCard = `<div style="background:linear-gradient(135deg,#1e40af,#3b82f6);border-radius:14px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:20px;box-shadow:0 4px 16px rgba(37,99,235,0.25)">
        <div style="flex:1;min-width:0">
          <div style="color:rgba(255,255,255,0.75);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">
            Evolución${tituloEntidad} · ${anioActual}
          </div>
          <div style="color:#fff;font-size:26px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px">${fmtK(totalAct)}</div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <span style="color:rgba(255,255,255,0.7);font-size:12px">${fmtN(dataAct.length)} inserciones</span>
            ${varTotal!==null?`<span style="background:rgba(255,255,255,0.15);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px">${tendIcon} ${tendPct} vs ${anioAnt}</span>`:''}
          </div>
          ${hayAnioAnt?`<div style="color:rgba(255,255,255,0.55);font-size:11px;margin-top:4px">${anioAnt}: ${fmtK(totalAnt)}</div>`:''}
        </div>
        <div style="flex-shrink:0">
          <svg width="${spW}" height="${spH}" viewBox="0 0 ${spW} ${spH}" style="display:block">
            <defs>
              <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
                <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
              </linearGradient>
            </defs>
            <polygon points="${spArea}" fill="url(#${gradId})"/>
            <polyline points="${spLine}" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
            ${spPts.map((pt,i)=>{
              const [x,y]=pt.split(',');
              const isMax=spVals[i]===spMax, isMin=spVals[i]===spMin;
              if(!isMax&&!isMin) return '';
              return `<circle cx="${x}" cy="${y}" r="4" fill="${isMax?'#fbbf24':'rgba(255,255,255,0.6)'}" stroke="white" stroke-width="1.5"/>`;
            }).join('')}
          </svg>
        </div>
      </div>`;

      // ── BARRAS DOBLES (año actual vs anterior) ─────────────────────────────
      const barsHtml = mesesConDatos.map(m=>{
        const mn=norm(m); const vAct=mapAct[mn]||0,vAnt=mapAnt[mn]||0;
        const pAct=Math.round(vAct/maxVal*100),pAnt=Math.round(vAnt/maxVal*100);
        const diff=vAnt>0?((vAct-vAnt)/vAnt*100):null;
        const diffStr=diff===null?'':`<span class="${diff>=0?'up':'dn'}" style="font-size:10px;margin-left:4px">${diff>=0?'▲':'▼'}${Math.abs(diff).toFixed(1)}%</span>`;
        return `<div class="bar-row" style="margin-bottom:10px">
          <span class="bar-lbl" style="font-weight:500">${m.slice(3)}</span>
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
              <div class="bar-wrap" style="flex:1"><div class="bar-fill" style="width:${pAct}%;background:${color}"></div></div>
              <span style="min-width:90px;text-align:right;font-family:'DM Mono',monospace;font-size:11px">${fmt(vAct)}${diffStr}</span>
            </div>
            ${hayAnioAnt?`<div style="display:flex;align-items:center;gap:6px">
              <div class="bar-wrap" style="flex:1"><div class="bar-fill" style="width:${pAnt}%;background:${colorAnt}"></div></div>
              <span style="min-width:90px;text-align:right;font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)">${fmt(vAnt)}</span>
            </div>`:''}
          </div>
        </div>`;
      }).join('');

      const leyenda = hayAnioAnt?`<div style="display:flex;gap:16px;margin-bottom:14px;font-size:11px">
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${color};margin-right:4px"></span>${anioActual}</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${colorAnt};margin-right:4px"></span>${anioAnt}</span>
      </div>`:'';

      html += sparkCard;
      html += `<div class="result-card"><h3><span class="ico">📈</span>Mes a mes${tituloEntidad}</h3>${leyenda}${barsHtml}</div>`;

      // ── DESGLOSE adicional ─────────────────────────────────────────────────
      const byPubEv = agg(dataAct, r=>r.pub).slice(0,8);
      const bySectorEv = agg(dataAct, r=>r.sector).slice(0,6);
      const byAnuncianteEv = agg(dataAct, r=>r.anunciante).slice(0,8);
      const byProductoEv = agg(dataAct, r=>r.producto).slice(0,6);

      if (!queryPubTerm && byPubEv.length>1) html += bars('Ingresos por publicación', byPubEv, '📰', 8);
      if (bySectorEv.length>1) html += bars('Top sectores', bySectorEv, '🏭', 6, '#7c3aed');
      if (byAnuncianteEv.length>1) html += bars('Top anunciantes', byAnuncianteEv, '🏢', 8, '#16a34a');
      if (byProductoEv.length>1) html += bars('Top productos', byProductoEv, '📦', 6, '#f59e0b');
    }
  }
  // ── RANKING SECTORES (puro, sin otros filtros) ──────────────────────
  else if (pideSector && esQueryPura) {
    const rows = agg(data, r=>r.sector);
    html += bars('Ingresos por sector', rows, '🏭', 15);
    html += tbl('Ranking de sectores',['#','Sector','Ingresos','Inserciones'],
      rows.slice(0,20).map((r,i)=>[`${['🥇','🥈','🥉'][i]||i+1}`,r.key,fmt(r.total),fmtN(r.count)]),'📊');
  }

  // ── RANKING MARCAS (puro) ───────────────────────────────────────────
  else if (pideMarca && esQueryPura) {
    const rows = agg(data, r=>r.marca);
    html += bars('Top marcas', rows, '🏷️', 10);
    html += tbl('Top 20 marcas',['#','Marca','Ingresos','Inserciones'],
      rows.slice(0,20).map((r,i)=>[i+1,r.key,fmt(r.total),fmtN(r.count)]),'📋');
  }

  // ── RANKING ANUNCIANTES (puro) ──────────────────────────────────────
  else if (pideAnunciante && esQueryPura) {
    const rows = agg(data, r=>r.anunciante);
    html += bars('Top anunciantes', rows, '🏢', 10);
    html += tbl('Top 20 anunciantes',['#','Anunciante','Ingresos','Inserciones'],
      rows.slice(0,20).map((r,i)=>[i+1,r.key,fmt(r.total),fmtN(r.count)]),'📋');
  }

  // ── RANKING COMERCIALES (puro) ──────────────────────────────────────
  else if (pideComercial && esQueryPura) {
    const rows = agg(data, r=>r.comercial);
    html += bars('Ingresos por comercial', rows, '👤', 15);
    html += tbl('Ranking comerciales',['#','Comercial','Ingresos','Inserciones'],
      rows.slice(0,20).map((r,i)=>[i+1,r.key,fmt(r.total),fmtN(r.count)]),'📋');
  }

  // ── ÁREA / ZONA (puro) ──────────────────────────────────────────────
  else if (pideArea && esQueryPura) {
    const byArea = agg(data, r=>r.area);
    html += bars('Ingresos por área', byArea, '📍', 12);
    const byZona = agg(data, r=>getZona(r.area)||'Otras');
    html += bars('Ingresos por zona', byZona, '🗺️', 6, '#16a34a');
    html += tbl('Detalle por zona',['Zona','Ingresos','Inserciones'],
      byZona.map(r=>[r.key,fmt(r.total),fmtN(r.count)]),'📋');
  }

  // ── FAMILIA ESPECÍFICA (grupo o exacta, sin términos libres) ────────
  else if ((queryFamiliaGrupo || queryFamiliaNorm) && !hayLibres) {
    const totalIng = base.reduce((s,r)=>s+r.ingreso,0);
    const totalIns = base.length;
    const numAnunciantes = new Set(base.map(r=>r.anunciante)).size;
    const labelFam = queryFamiliaGrupo ? queryFamiliaGrupo.label.toUpperCase() : queryFamiliaLabel;
    
    // Tarjeta resumen
    html += `<div class="result-card">
      <h3><span class="ico">🗂️</span>${labelFam}</h3>
      <div class="sum-stats">
        <div class="sum-stat"><div class="v">${fmt(totalIng)}</div><div class="l">ingreso total</div></div>
        <div class="sum-stat"><div class="v">${fmtN(totalIns)}</div><div class="l">inserciones</div></div>
        <div class="sum-stat"><div class="v">${numAnunciantes}</div><div class="l">anunciantes</div></div>
      </div>
    </div>`;
    
    // Si es grupo, mostrar desglose por subfamilia
    if (queryFamiliaGrupo) {
      const bySubfam = agg(base, r=>r.familia);
      const maxSub = bySubfam[0]?.total || 1;
      const desgloseHtml = bySubfam.map(r => `
        <div class="bar-row">
          <span class="bar-lbl">${r.key}</span>
          <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.total/maxSub*100)}%;background:${CANAL_COLORS[currentCanal]}"></div></div>
          <span class="bar-val">${fmt(r.total)}</span>
        </div>`).join('');
      html += `<div class="result-card"><h3><span class="ico">📊</span>Desglose por subfamilia</h3>${desgloseHtml}</div>`;
    }
    
    // Por publicación
    const byPub = agg(base, r=>r.pub).slice(0,10);
    if (byPub.length > 1) html += bars('Por publicación', byPub, '📰', 10);
    
    // Evolución mensual
    const byMes = agg(base, r=>r.mes).sort((a,b)=>mesIdx(a.key)-mesIdx(b.key));
    if (byMes.length > 1) {
      const maxMes = Math.max(...byMes.map(r=>r.total));
      const mesHtml = byMes.map(r => `
        <div class="bar-row">
          <span class="bar-lbl">${r.key}</span>
          <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.total/maxMes*100)}%;background:${CANAL_COLORS[currentCanal]}"></div></div>
          <span class="bar-val">${fmt(r.total)}</span>
        </div>`).join('');
      html += `<div class="result-card"><h3><span class="ico">📈</span>Evolución mensual</h3>${mesHtml}</div>`;
    }
    
    // Top anunciantes
    const byAnunciante = agg(base, r=>r.anunciante).slice(0,10);
    if (byAnunciante.length > 1) html += bars('Top anunciantes', byAnunciante, '🏢', 10, '#16a34a');
    
    // Inserciones
    const _det = queryFamiliaGrupo ? [`Grupo: ${queryFamiliaGrupo.label}`] : [`Familia: ${queryFamiliaLabel}`];
    html += insertionsBlock(base, _det);
  }

  // ── GRUPO DE PRODUCTO ESPECÍFICO (Social Paid / Social Organic / Social Ignition, etc.) ──
  else if (queryProductoGrupo && !hayLibres) {
    const totalIng = base.reduce((s,r)=>s+r.ingreso,0);
    const totalIns = base.length;
    const numAnunciantes = new Set(base.map(r=>r.anunciante)).size;

    // Tarjeta resumen
    html += `<div class="result-card">
      <h3><span class="ico">📱</span>${queryProductoGrupo.label}</h3>
      <div class="sum-stats">
        <div class="sum-stat"><div class="v">${fmt(totalIng)}</div><div class="l">ingreso total</div></div>
        <div class="sum-stat"><div class="v">${fmtN(totalIns)}</div><div class="l">inserciones</div></div>
        <div class="sum-stat"><div class="v">${numAnunciantes}</div><div class="l">anunciantes</div></div>
      </div>
    </div>`;

    // Desglose por producto dentro del grupo
    const byProdGrupo = agg(base, r=>r.producto);
    if (byProdGrupo.length > 1) {
      const maxProd = byProdGrupo[0]?.total || 1;
      const desgloseHtml = byProdGrupo.map(r => `
        <div class="bar-row">
          <span class="bar-lbl">${r.key}</span>
          <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.total/maxProd*100)}%;background:${CANAL_COLORS[currentCanal]}"></div></div>
          <span class="bar-val">${fmt(r.total)}</span>
        </div>`).join('');
      html += `<div class="result-card"><h3><span class="ico">📊</span>Desglose por producto</h3>${desgloseHtml}</div>`;
    }

    // Por publicación
    const byPub = agg(base, r=>r.pub).slice(0,10);
    if (byPub.length > 1) html += bars('Por publicación', byPub, '📰', 10);

    // Evolución mensual
    const byMes = agg(base, r=>r.mes).sort((a,b)=>mesIdx(a.key)-mesIdx(b.key));
    if (byMes.length > 1) {
      const maxMes = Math.max(...byMes.map(r=>r.total));
      const mesHtml = byMes.map(r => `
        <div class="bar-row">
          <span class="bar-lbl">${r.key}</span>
          <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.total/maxMes*100)}%;background:${CANAL_COLORS[currentCanal]}"></div></div>
          <span class="bar-val">${fmt(r.total)}</span>
        </div>`).join('');
      html += `<div class="result-card"><h3><span class="ico">📈</span>Evolución mensual</h3>${mesHtml}</div>`;
    }

    // Top anunciantes
    const byAnunciante = agg(base, r=>r.anunciante).slice(0,10);
    if (byAnunciante.length > 1) html += bars('Top anunciantes', byAnunciante, '🏢', 10, '#16a34a');

    // Inserciones
    const _detGrupo = [`Grupo: ${queryProductoGrupo.label}`];
    html += insertionsBlock(base, _detGrupo);
  }

  // ── FAMILIAS (puro — listado general) ─────────────────────────────────
  else if (pideFamilia && esQueryPura) {
    const rows = agg(data, r=>r.familia);
    html += bars('Ingresos por familia de producto', rows, '🗂️', 10);
    html += tbl('Ranking familias',['#','Familia','Ingresos','Inserciones'],
      rows.slice(0,15).map((r,i)=>[i+1,r.key,fmt(r.total),fmtN(r.count)]),'📋');
  }

  // ── PRODUCTOS (puro) ────────────────────────────────────────────────
  else if (pideProducto && esQueryPura) {
    const rows = agg(data, r=>r.producto);
    html += bars('Top productos', rows, '📦', 10);
    html += tbl('Top 20 productos',['#','Producto','Ingresos','Inserciones'],
      rows.slice(0,20).map((r,i)=>[i+1,r.key,fmt(r.total),fmtN(r.count)]),'📋');
  }

  // ── MIX DE CANAL (puro) ─────────────────────────────────────────────
  else if (pideMix && esQueryPura) {
    const byCanal = agg(data, r=>r._canal);
    const total = byCanal.reduce((s,r)=>s+r.total,0);
    const b = byCanal.map(r=>`
      <div class="bar-row">
        <span class="bar-lbl"><span class="pill ${r.key}">${r.key}</span></span>
        <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.total/total*100)}%;background:${CANAL_COLORS[r.key]||'#888'}"></div></div>
        <span class="bar-val">${fmt(r.total)} (${Math.round(r.total/total*100)}%)</span>
      </div>`).join('');
    html += `<div class="result-card"><h3><span class="ico">📊</span>Mix de canal</h3>${b}</div>`;
    html += tbl('Detalle por canal',['Canal','Ingresos','%','Inserciones'],
      byCanal.map(r=>[`<span class="pill ${r.key}">${r.key}</span>`,fmt(r.total),Math.round(r.total/total*100)+'%',fmtN(r.count)]),'📊');
  }

  // ── OFICINAS (puro) ─────────────────────────────────────────────────
  else if (pideOficina && esQueryPura) {
    const rows = agg(data, r=>r.oficina);
    html += bars('Ingresos por oficina / centro de venta', rows, '🏪', 10);
    html += tbl('Ranking oficinas',['#','Oficina','Ingresos','Inserciones'],
      rows.slice(0,15).map((r,i)=>[i+1,r.key,fmt(r.total),fmtN(r.count)]),'📋');
  }

  // ── RESUMEN GENERAL (puro) ──────────────────────────────────────────
  else if ((pideIngresos || pideRanking) && esQueryPura) {
    const totalIng = data.reduce((s,r)=>s+r.ingreso,0);
    const byCanal = agg(data, r=>r._canal);
    const byPub = agg(data, r=>r.pub).slice(0,10);
    const bySector = agg(data, r=>r.sector).slice(0,10);
    const byMes = agg(data, r=>r.mes).sort((a,b)=>mesIdx(a.key)-mesIdx(b.key));
    const byAnunciante = agg(data, r=>r.anunciante).slice(0,10);
    html += `<div class="result-card">
      <h3><span class="ico">💰</span>Resumen de ingresos</h3>
      <div class="sum-stats">
        <div class="sum-stat"><div class="v">${fmt(totalIng)}</div><div class="l">ingreso total</div></div>
        <div class="sum-stat"><div class="v">${fmtN(data.length)}</div><div class="l">inserciones</div></div>
        <div class="sum-stat"><div class="v">${new Set(data.map(r=>r.anunciante)).size}</div><div class="l">anunciantes</div></div>
      </div>
      <div style="margin-top:14px">
        ${byCanal.map(r=>`<span class="pill ${r.key}">${r.key}: ${fmt(r.total)} (${Math.round(r.total/totalIng*100)}%)</span>`).join(' ')}
      </div>
    </div>`;
    html += bars('Top publicaciones', byPub, '📰', 10);
    html += bars('Top sectores', bySector, '🏭', 10, '#7c3aed');
    html += bars('Top anunciantes', byAnunciante, '🏢', 10, '#16a34a');
    if (byMes.length>1){
      const max=Math.max(...byMes.map(r=>r.total));
      html+=`<div class="result-card"><h3><span class="ico">📈</span>Evolución mensual</h3>${byMes.map(r=>`<div class="bar-row"><span class="bar-lbl">${r.key}</span><div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.total/max*100)}%;background:${CANAL_COLORS[currentCanal]}"></div></div><span class="bar-val">${fmt(r.total)}</span></div>`).join('')}</div>`;
    }
  }

  // ── BÚSQUEDA COMBINADA — cualquier combinación de filtros ───────────
  // "ingresos elle", "insider elle enero", "branded content cosmopolitan marzo", "nike elle"...
  else if (hayDatos) {
    const totalIng = base.reduce((s,r)=>s+r.ingreso,0);
    const byPub = agg(base, r=>r.pub).slice(0,8);
    const byMes = agg(base, r=>r.mes).sort((a,b)=>mesIdx(a.key)-mesIdx(b.key));
    const bySector = agg(base, r=>r.sector).slice(0,6);
    const byAnunciante = agg(base, r=>r.anunciante).slice(0,8);
    const byProducto = agg(base, r=>r.producto).slice(0,6);
    const byFamilia = agg(base, r=>r.familia).slice(0,6);
    const byCanal = agg(base, r=>r._canal);

    html += `<div class="result-card">
      <h3><span class="ico">💰</span>Ingresos · <span style="font-weight:400;color:var(--text3)">${filtroDesc}</span></h3>
      <div class="sum-stats">
        <div class="sum-stat"><div class="v">${fmt(totalIng)}</div><div class="l">ingreso total</div></div>
        <div class="sum-stat"><div class="v">${fmtN(base.length)}</div><div class="l">inserciones</div></div>
        <div class="sum-stat"><div class="v">${new Set(base.map(r=>r.anunciante)).size}</div><div class="l">anunciantes</div></div>
      </div>
      ${byCanal.length>1?'<div style="margin-top:10px">'+byCanal.map(r=>`<span class="pill ${r.key}">${r.key}: ${fmt(r.total)}</span>`).join('')+'</div>':''}
    </div>`;
    if (byPub.length>1) html += bars('Por publicación / site', byPub, '📰', 8);
    if (bySector.length>1) html += bars('Sectores', bySector, '🏭', 6, '#7c3aed');
    if (byAnunciante.length>1) html += bars('Top anunciantes', byAnunciante, '🏢', 8, '#16a34a');
    if (byProducto.length>1) html += bars('Productos', byProducto, '📦', 6, '#f59e0b');
    if (byFamilia.length>1) html += bars('Familias', byFamilia, '🗂️', 6, '#0891b2');
    if (!queryMes && byMes.length>1){
      const max=Math.max(...byMes.map(r=>r.total));
      html+=`<div class="result-card"><h3><span class="ico">📈</span>Evolución mensual</h3>${byMes.map(r=>`<div class="bar-row"><span class="bar-lbl">${r.key}</span><div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.total/max*100)}%;background:${CANAL_COLORS[currentCanal]}"></div></div><span class="bar-val">${fmt(r.total)}</span></div>`).join('')}</div>`;
    }
    html += insertionsBlock(base, _det);
  }

  // ── SIN RESULTADOS ──────────────────────────────────────────────────
  if (!html) {
    html = '<div style="color:#dc2626;font-weight:600;font-size:14px;padding:20px 0;">⚠️ No se han encontrado resultados para tu búsqueda. Prueba con otros términos.</div>';
  }

  document.getElementById('results').innerHTML = html;
  document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});
}

    document.getElementById('micBtn').textContent = '⏺️';
  };

// Correcciones de palabras que el reconocimiento de voz suele confundir.
// Añade aquí más entradas si detectas otras confusiones (todo en minúsculas).
const VOICE_CORRECTIONS = [
  { from: /\bel\b/gi, to: 'Elle' },
  { from: /\bél\b/gi, to: 'Elle' }
];

function applyVoiceCorrections(text) {
  let corrected = text;
  VOICE_CORRECTIONS.forEach(rule => { corrected = corrected.replace(rule.from, rule.to); });
  return corrected;
}

  recognition.onresult = (event) => {
    const transcript = applyVoiceCorrections(event.results[0][0].transcript);
    document.getElementById('queryInput').value = transcript;
    runQuery();
  };

  recognition.onerror = (event) => {
    console.warn('Error de reconocimiento de voz:', event.error);
    if (event.error === 'not-allowed' || event.error === 'permission-denied') {
      alert('Necesitas dar permiso de micrófono para usar la búsqueda por voz.');
    }
  };

  recognition.onend = () => {
    isListening = false;
    const btn = document.getElementById('micBtn');
    btn.classList.remove('listening');
    btn.textContent = '🎤';
  };
} else {
  // Navegador sin soporte: ocultamos el botón
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('micBtn');
    if (btn) btn.classList.add('unsupported');
  });
}

function toggleVoiceSearch() {
  if (!recognition) return;
  if (isListening) {
    recognition.stop();
  } else {
    recognition.start();
  }
}

document.addEventListener('DOMContentLoaded', loadFromSharePoint);

// PWA: registra el service worker (no afecta a la carga de los Excel)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW no registrado:', err));
  });
}
</script>
