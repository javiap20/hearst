}

// Devuelve true si la publicación de la fila coincide con el término de publicación detectado
// (usa PUB_MATCH_GROUPS para cubrir print+digital y evita el cruce Men's/Women's Health)
function pubRowMatches(rowPub, pubTerm) {
  const pubMatchFrags = PUB_MATCH_GROUPS[pubTerm] || [normNoSpace(pubTerm)];
  const rp = normNoSpace(rowPub);
  const rpA = rp.replace(/[^a-z0-9]/g, '');   // solo letras y números (www.elle.com/es/gourmet/ → wwwellecomesgourmet)
  return pubMatchFrags.some(f => {
    if (f === 'menshealth') return rp.includes('menshealth') && !rp.includes('womenshealth');
    return rp.includes(f) || rpA.includes(f);
  });
}

// Convierte direcciones web escritas en la búsqueda en el nombre de la publicación:
// "www.elle.com/es" → "elle", "elle.com/es/gourmet" → "elle gourmet", "harpersbazaar.com/es" → "harpersbazaar"
function rewriteUrls(text) {
  return text.replace(/(?:https?:\/\/)?(?:www\.)?([a-z0-9][a-z0-9-]*)\.(?:com|es|net|org|eu)(?![a-z0-9-])(\/[^\s]*)?/gi, (m, label, path) => {
    let out = label.toLowerCase().replace(/-/g, '');
    const p = (path || '').toLowerCase();
    if (/\/gourmet/.test(p)) out += ' gourmet';
    else if (/\/(travel|viajes)/.test(p)) out += ' travel';
    return ' ' + out + ' ';
  }).replace(/\s+/g, ' ').trim();
}

// Filtro por sectores en «anunciantes contactar»: ninguno marcado = todos; marcados = solo esos.
function toggleSectorContactar(el) {
  const wrap = el.closest('.contactar-wrap');
  if (el.dataset.sec === 'todos') wrap.querySelectorAll('.chip.chip-on').forEach(x => x.classList.remove('chip-on'));
  else el.classList.toggle('chip-on');
  const on = [...wrap.querySelectorAll('.chip.chip-on')].map(x => x.dataset.sec);
  wrap.querySelectorAll('.sec-block').forEach(b => { b.style.display = (!on.length || on.includes(b.dataset.sec)) ? '' : 'none'; });
}

function runQuery() {
  const raw = rewriteUrls(document.getElementById('queryInput').value.trim());
  const q = norm(raw);
  if (!q) return;

  // Año escrito en la búsqueda (p. ej. "elle 2025"): tiene prioridad sobre el selector.
  // Solo se acepta si existe en los datos, para no confundirlo con otros números.
  const _aniosData = new Set(DATA.map(r => r.year));
  const _mAnio = q.match(/(?:^|\s)(20\d{2})(?=\s|$)/);
  const queryAnio = (_mAnio && _aniosData.has(_mAnio[1])) ? _mAnio[1] : null;

  let baseData;
  if (queryAnio) {
    const _mesSel = document.getElementById('filterMes').value;
    const _pubSel = document.getElementById('filterPub').value;
    baseData = DATA.filter(r =>
      r.year === queryAnio &&
      (!_mesSel || norm(r.mes) === norm(_mesSel)) &&
      (!_pubSel || r.pub === _pubSel));
  } else {
    baseData = FILTERED;
  }
  const data = currentCanal === 'TODOS' ? baseData : baseData.filter(r => r._canal === currentCanal);

  // Si los filtros no dejan ninguna fila, avisar en lugar de buscar en todos los datos.
  if (DATA.length && !data.length) {
    const _f = [
      queryAnio ? 'Año ' + queryAnio : (document.getElementById('filterAnio').value ? 'Año ' + document.getElementById('filterAnio').value : null),
      document.getElementById('filterMes').value ? 'Mes ' + document.getElementById('filterMes').value.slice(3) : null,
      document.getElementById('filterPub').value ? 'Pub. ' + document.getElementById('filterPub').value : null,
      currentCanal !== 'TODOS' ? 'Canal ' + currentCanal : null
    ].filter(Boolean).join(' · ') || 'los filtros actuales';
    document.getElementById('results').innerHTML =
      '<div class="result-card"><h3><span class="ico">⚠️</span>Sin datos para estos filtros</h3>' +
      '<p style="color:var(--text3)">No hay filas para <strong>' + _f + '</strong>. ' +
      'Prueba a cambiar los filtros o pulsa «Limpiar filtros».</p></div>';
    document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  if (!data.length) return;

  const has = (...t) => t.some(x => q.includes(norm(x)));
  let html = '';

  // ══════════════════════════════════════════════════════════════════════
  // PASO 1: DETECTAR todos los elementos de la query
  // ══════════════════════════════════════════════════════════════════════

  // 1a. Mes (flexible: ene/enero/01 enero)
  const queryMes = detectMes(q);

  // 1b. Publicación (flexible: elle / www.elle.com/es)
  const queryPubTerm = PUB_FRAGMENTS.find(p => queryHasWholeFragment(raw, p));

  // 1c. Producto EXACTO — primero compuestos (más largos), luego simples
  //     Solo si la query contiene el término normalizado completo como palabra
  const queryProductoComp = TERMINOS_COMPUESTOS_PRODUCTOS.find(p => {
    const pn = norm(p);
    const re2 = new RegExp('(^|\\s)' + pn.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '(\\s|$)');
    return re2.test(q);
  });
  const queryProductoSimple = !queryProductoComp
    ? [...CONOCIDOS_PRODUCTOS_SIMPLES].find(p => {
        const re2 = new RegExp('(^|\\s)' + p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '(\\s|$)');
        return re2.test(q);
      })
    : null;
  const queryProductoNorm = queryProductoComp ? norm(queryProductoComp) : (queryProductoSimple || null);
  const queryProductoLabel = queryProductoComp || queryProductoSimple || null;

  // 1c-bis. Grupo de producto (Social Paid / Social Organic / Social Ignition, etc.)
  //     Se detecta antes que familia para que "social paid/organic" no choque con el alias "social" de familia
  const queryProductoGrupo = !queryProductoNorm ? detectarGrupoProducto(q) : null;

  // 1d. Familia — usando nuevo sistema de alias (_FAM_EXACTO, _FAM_GRUPO)
  //     Solo si no se detectó ya como producto exacto ni como grupo de producto
  const _famDetect = (!queryProductoNorm && !queryProductoGrupo) ? detectarFamilia(q) : null;
  const queryFamiliaGrupo = _famDetect?.tipo === 'grupo' ? _famDetect : null;  // {alias, familias[], label}
  const queryFamiliaNorm = _famDetect?.tipo === 'exacto' ? _famDetect.familia : null;
  const queryFamiliaLabel = _famDetect?.label || null;

  // 1e. Sector (token exacto de la lista)
  // Primero sectores de varias palabras tal y como vienen en los datos
  // ("belleza e higiene", "deportes y tiempo libre"…): gana el nombre más largo que aparezca
  // completo en la búsqueda. Si no hay, se usa la lista de sectores de una palabra.
  const _sectoresMulti = [...new Set(DATA.map(r => norm(r.sector)))]
    .filter(sn => /[\s\/]/.test(sn) && sn.length > 3)
    .sort((a, b) => b.length - a.length);
  const querySector = _sectoresMulti.find(sn => {
      const esc = sn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      return new RegExp('(^|\\s)' + esc + '(\\s|$)').test(q);
    })
    || SECTORES_KNOWN.find(s => {
      const sn = norm(s);
      return q.split(' ').some(t => t === sn) || q === sn;
    });

  // 1f. Comercial (parcial)
  const queryComercial = [...CONOCIDOS_COMERCIALES].find(c => q.includes(norm(c)));

  // 1f-bis. Oficina de venta (Madrid / Barcelona / Internacional) — palabra completa
  const _tokQ = _tokensAlnum(raw);
  const queryOficinas = OFICINAS_KNOWN.filter(o => _tokQ.includes(o));

  // 1g. Términos libres — lo que queda tras quitar todo lo anterior
  const stopWords = new Set(['en','de','el','la','los','las','un','una','y','o','del','al','con','por','para','a','su','se']);
  let qLibre = q;
  if (queryMes)         qLibre = qLibre.replace(norm(queryMes), ' ');
  if (queryAnio)        qLibre = qLibre.replace(queryAnio, ' ');
  if (queryPubTerm) {
    qLibre = removeWholeFragment(qLibre, queryPubTerm);
  }
  if (queryProductoNorm) qLibre = qLibre.replace(queryProductoNorm, ' ');
  if (queryProductoGrupo) qLibre = qLibre.replace(norm(queryProductoGrupo.alias), ' ');
  // Quitar familia: el alias usado O la familia canónica
  if (_famDetect) {
    const aliasUsado = _famDetect.alias ? norm(_famDetect.alias) : null;
    const famCanonica = _famDetect.familia ? norm(_famDetect.familia) : null;
    const famGrupoLabel = _famDetect.tipo === 'grupo' ? norm(_famDetect.label) : null;
    if (aliasUsado) qLibre = qLibre.replace(aliasUsado, ' ');
    if (famCanonica && famCanonica !== aliasUsado) qLibre = qLibre.replace(famCanonica, ' ');
    if (famGrupoLabel && famGrupoLabel !== aliasUsado) qLibre = qLibre.replace(famGrupoLabel, ' ');
  }
  if (querySector)      qLibre = qLibre.replace(norm(querySector), ' ');
  if (queryComercial)   qLibre = qLibre.replace(norm(queryComercial), ' ');
  queryOficinas.forEach(o => { qLibre = qLibre.replace(new RegExp('(^|\\s)' + o + '(?=\\s|$)'), ' '); });
  const tokensLibres = qLibre.split(/\s+/).filter(t => t.length > 1 && !stopWords.has(t) && !INTENT_WORDS.has(t));

  // ══════════════════════════════════════════════════════════════════════
  // PASO 2: FILTRAR datos en cadena con todo lo detectado
  // ══════════════════════════════════════════════════════════════════════

  // Lógica Elle vs Elle Decor
  const _mencionaElle = _tokensAlnum(raw).some(t => /^elle(decor|decoration|gourmet|travel)?$/.test(t));
  const buscoElleSolo  = _mencionaElle && !norm(raw).includes('decor') && !norm(raw).includes('decoration') && !norm(raw).includes('decoracion');
  const buscoElleDecor = _mencionaElle && (norm(raw).includes('decor') || norm(raw).includes('decoration') || norm(raw).includes('decoracion'));

  function filtrarElleDecor(r) {
    const pubNorm = norm(r.pub);
    const esElleDecor = pubNorm.includes('decor') || pubNorm.includes('decoration');
    if (buscoElleSolo && esElleDecor) return false;
    if (buscoElleDecor && pubNorm.includes('elle') && !esElleDecor) return false;
    return true;
  }

  // Filtros de la query encapsulados para poder reutilizarlos (p. ej. «perdidos» compara dos años).
  // conMes=false ignora el mes de la query (el bloque «perdidos» lo gestiona por su cuenta).
  const freeFields = ['anunciante','marca','detalle','oficina'];
  const _free = tokensLibres.length > 0 ? buildFreeMatcher(tokensLibres) : null;

  function aplicarFiltros(arr, conMes, conOficina = true, campos = freeFields) {
    let b = arr.filter(r => filtrarElleDecor(r));
    if (queryPubTerm) b = b.filter(r => pubRowMatches(r.pub, queryPubTerm));
    if (conMes && queryMes) b = b.filter(r => norm(r.mes) === norm(queryMes));
    if (querySector) b = b.filter(r => norm(r.sector).includes(norm(querySector)));
    if (queryFamiliaGrupo) {
      b = b.filter(r => queryFamiliaGrupo.familias.some(f => norm(r.familia) === norm(f)));
    } else if (queryFamiliaNorm) {
      b = b.filter(r => norm(r.familia) === norm(queryFamiliaNorm));
    }
    if (queryProductoNorm) b = b.filter(r => norm(r.producto) === queryProductoNorm);
    if (queryProductoGrupo) b = b.filter(r => queryProductoGrupo.productos.some(p => norm(r.producto) === norm(p)));
    if (queryComercial) b = b.filter(r => norm(r.comercial).includes(norm(queryComercial)));
    // Oficina de venta (Madrid / Barcelona / Internacional) sobre «Oficina de venta / Centro de coste»
    if (conOficina && queryOficinas.length) b = b.filter(r => queryOficinas.some(o => norm(r.oficina).includes(o)));
    if (_free) {
      b = b.filter(r => _free.test(campos.map(f => norm(r[f]||'')).join(' ')));
    }
    return b;
  }

  let base = aplicarFiltros(data, true);

  // ══════════════════════════════════════════════════════════════════════
  // PASO 3: DECIDIR QUÉ MOSTRAR según intención de la query
  // ══════════════════════════════════════════════════════════════════════

  const hayDatos   = base.length > 0;
  const hayLibres  = tokensLibres.length > 0;
  const hayFiltros = !!(queryPubTerm || queryAnio || queryMes || querySector || queryFamiliaGrupo || queryFamiliaNorm || queryProductoNorm || queryProductoGrupo || queryComercial || queryOficinas.length || tokensLibres.length > 0);
  const esQueryPura = !hayFiltros;

  const pidePresupuesto = has('presupuesto','ticket medio','insercion media','coste medio','precio medio');
  const pideEvolucion   = has('evolucion','evolución','mensual','por mes','mensualmente');
  const pideSector      = has('sector','sectores') || !!querySector;
  const pideFamilia     = has('familia','familias') || !!queryFamiliaNorm;
  const pideProducto    = has('producto','productos') || !!queryProductoNorm || !!queryProductoGrupo;
  const pideComercial   = has('comercial','comerciales') || !!queryComercial;
  const pideAnunciante  = has('anunciante','anunciantes');
  const pideMarca       = has('marca','marcas');
  const pideArea        = has('area','área','zona','zonas');
  const pideOficina     = has('oficina','centro');
  const pideMix         = has('mix','canal','canales');
  const pideIngresos    = has('ingreso','ingresos','facturacion','facturación','revenue','total','resumen','overview');
  const pideRanking     = has('ranking','top');
  const pideContactar   = /(^|\s)contactar(\s|$)/.test(q);
  const pidePerdidos    = /(^|\s)perdid[oa]s?(\s|$)/.test(q);

  // Etiqueta de filtros aplicados para mostrar en cabecera
  const filtroDesc = [
    queryPubTerm || null,
    queryMes ? queryMes.slice(3) : null,
    queryAnio || null,
    querySector || null,
    queryFamiliaLabel || null,
    queryProductoLabel || null,
    queryProductoGrupo ? queryProductoGrupo.label : null,
    queryComercial || null,
    queryOficinas.length ? 'oficina ' + queryOficinas.join(' + ') : null,
    tokensLibres.length > 0 ? tokensLibres.join(' ') : null
  ].filter(Boolean).join(' · ') || 'todos los datos';

  // Construir _det para insertionsBlock
  const _det = [];
  if (queryProductoLabel) _det.push(`<strong>Producto:</strong> ${queryProductoLabel}`);
  if (queryProductoGrupo) _det.push(`<strong>Grupo:</strong> ${queryProductoGrupo.label}`);
  if (queryFamiliaLabel)  _det.push(`<strong>Familia:</strong> ${queryFamiliaLabel}`);
  if (querySector)        _det.push(`<strong>Sector:</strong> ${querySector}`);
  if (queryPubTerm)       _det.push(`<strong>Publicación:</strong> ${queryPubTerm}`);
  if (queryMes)           _det.push(`<strong>Mes:</strong> ${queryMes.slice(3)}`);
  if (queryComercial)     _det.push(`<strong>Comercial:</strong> ${queryComercial}`);
  if (queryOficinas.length) _det.push(`<strong>Oficina:</strong> ${queryOficinas.join(' + ')}`);
  if (tokensLibres.length > 0) _det.push(`<strong>Búsqueda libre:</strong> ${tokensLibres.join(', ')}`);
  _det.push(`<strong>Año:</strong> ${queryAnio || document.getElementById('filterAnio').value || 'todos'}`);

  // ── ANUNCIANTES A CONTACTAR ─────────────────────────────────────────
  // Con ingreso en el mes M del año anterior y sin ingreso en el mes M de este año (en cualquier oficina).
  // Sin mes en la query: mes actual. Agrupado por sector (el de mayor importe del anunciante).
  if (pideContactar) {
    const _esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const _anios = DATA.map(r => parseInt(r.year, 10)).filter(Boolean);
    const anioAct = queryAnio || document.getElementById('filterAnio').value || String(Math.max(..._anios));
    const anioAnt = String(parseInt(anioAct, 10) - 1);
    const mesC = queryMes || document.getElementById('filterMes').value || MESES[new Date().getMonth()];
    const mC = MESES.findIndex(m => norm(m) === norm(mesC)) + 1;
    const nomMes = MESES[mC - 1].slice(3);

    const _baseC = DATA.filter(r =>
      (currentCanal === 'TODOS' || r._canal === currentCanal) &&
      (!document.getElementById('filterPub').value || r.pub === document.getElementById('filterPub').value));
    const dataC = aplicarFiltros(_baseC, false, true, ['anunciante']);
    const dataCAct = queryOficinas.length ? aplicarFiltros(_baseC, false, false, ['anunciante']) : dataC;
    const mesDe = r => MESES.indexOf(r.mes) + 1;

    const map = new Map();
    const get = r => {
      const k = norm(r.anunciante);
      if (!map.has(k)) map.set(k, {k, nombre: r.anunciante, ant: 0, act: 0, prods: new Map(), marcas: new Map(), sectores: new Map()});
      return map.get(k);
    };
    dataC.forEach(r => {
      if (!r.anunciante || r.year !== anioAnt || mesDe(r) !== mC) return;
      const a = get(r), pr = r.producto || '(Sin producto)', pk = pr + '|||' + (r.pub || '');
      a.ant += r.ingreso;
      if (!a.prods.has(pk)) a.prods.set(pk, {prod: pr, pub: r.pub || '', v: 0});
      a.prods.get(pk).v += r.ingreso;
      if (r.marca) a.marcas.set(r.marca, (a.marcas.get(r.marca) || 0) + r.ingreso);
      const sc = r.sector || '(Sin sector)';
      a.sectores.set(sc, (a.sectores.get(sc) || 0) + r.ingreso);
    });
    dataCAct.forEach(r => {
      if (!r.anunciante || r.year !== anioAct || mesDe(r) !== mC) return;
      get(r).act += r.ingreso;
    });
    const lista = [...map.values()].filter(a => a.ant > 0.01 && a.act <= 0.01);
    lista.forEach(a => { a.sector = [...a.sectores.entries()].sort((x, y) => y[1] - x[1])[0][0]; });

    const porSector = new Map();
    lista.forEach(a => { if (!porSector.has(a.sector)) porSector.set(a.sector, []); porSector.get(a.sector).push(a); });
    const sectores = [...porSector.entries()]
      .map(([nombre, arr]) => ({nombre, arr: arr.sort((x, y) => y.ant - x.ant), total: arr.reduce((t, a) => t + a.ant, 0)}))
      .sort((x, y) => y.total - x.total);
    const totalC = lista.reduce((t, a) => t + a.ant, 0);

    function tablaContactar(arr, id) {
      const filas = arr.map((a, i) => {
        const prods = [...a.prods.values()].filter(p => p.v > 0.01).sort((x, y) => y.v - x.v);
        const celdaProd = prods.map(p => `<div style="display:flex;justify-content:space-between;gap:16px"><span>${_esc(p.prod)}${p.pub ? ' <span style="color:var(--text3)">· ' + _esc(p.pub) + '</span>' : ''}</span><span class="num" style="white-space:nowrap">${fmt(p.v)}</span></div>`).join('');
        const ms = [...a.marcas.entries()].filter(([, v]) => v > 0.01).sort((x, y) => y[1] - x[1]).map(([n]) => n);
        const txtMarcas = ms.length ? ' <span style="font-weight:400;color:var(--text3)">(' + _esc(ms.slice(0, 4).join(', ')) + (ms.length > 4 ? ' +' + (ms.length - 4) : '') + ')</span>' : '';
        return `<tr class="${id}-row" style="${i >= 30 ? 'display:none' : ''}"><td style="text-align:left;vertical-align:top;font-weight:500">${_esc(a.nombre)}${txtMarcas}</td><td style="text-align:left">${celdaProd}</td><td class="num" style="vertical-align:top;font-weight:600">${fmt(a.ant)}</td></tr>`;
      }).join('');
      const mas = arr.length > 30 ? `<div style="text-align:center;margin-top:10px"><button class="chip" onclick="document.querySelectorAll('.${id}-row').forEach(x=>x.style.display='');this.remove()">Ver los ${fmtN(arr.length)} anunciantes</button></div>` : '';
      return `<table><thead><tr><th style="text-align:left">Anunciante (marcas)</th><th style="text-align:left">Producto · publicación · importe ${anioAnt}</th><th>${nomMes} ${anioAnt}</th></tr></thead><tbody>${filas}</tbody></table>${mas}`;
    }

    html += `<div class="contactar-wrap"><div class="result-card">
      <h3><span class="ico">📞</span>Anunciantes a contactar · <span style="font-weight:400;color:var(--text3)">${_esc(filtroDesc)}${queryMes ? '' : ' · ' + nomMes}</span></h3>
      <div style="font-size:12px;color:var(--text3);margin-bottom:10px">Con ingreso en ${nomMes} ${anioAnt} y sin ingreso en ${nomMes} ${anioAct}</div>
      <div class="sum-stats">
        <div class="sum-stat"><div class="v">${fmt(totalC)}</div><div class="l">a recuperar</div></div>
        <div class="sum-stat"><div class="v">${fmtN(lista.length)}</div><div class="l">anunciantes</div></div>
        <div class="sum-stat"><div class="v">${fmtN(sectores.length)}</div><div class="l">sectores</div></div>
      </div>
      ${sectores.length > 1 ? `<div class="chips" style="margin-top:12px"><span class="chip" data-sec="todos" onclick="toggleSectorContactar(this)">Todos</span>${sectores.map((x, i) => `<span class="chip" data-sec="${i}" onclick="toggleSectorContactar(this)">${_esc(x.nombre)} · ${fmtN(x.arr.length)}</span>`).join('')}</div>` : ''}
    </div>`;
    if (!sectores.length) html += `<div class="result-card"><p style="color:var(--text3)">No hay anunciantes que contactar para este filtro y mes.</p></div>`;
    sectores.forEach((x, i) => {
      html += `<div class="result-card sec-block" data-sec="${i}"><h3><span class="ico">🏭</span>${_esc(x.nombre)} <span style="font-weight:400;color:var(--text3)">· ${fmtN(x.arr.length)} anunciantes · ${fmt(x.total)}</span></h3>${tablaContactar(x.arr, 'ct' + i)}</div>`;
    });
    html += `</div>`;
  }

  // ── ANUNCIANTES PERDIDOS ────────────────────────────────────────────
  // Perdido = ingreso neto > 0 el año anterior y sin ingreso neto este año (reparos ya netos),
  // en el mismo conjunto de meses. Sin mes: meses cerrados (hasta el actual) + aviso de los 2 siguientes.
  else if (pidePerdidos) {
    const _esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    const _anios = DATA.map(r => parseInt(r.year, 10)).filter(Boolean);
    const anioAct = queryAnio || document.getElementById('filterAnio').value || String(Math.max(..._anios));
    const anioAnt = String(parseInt(anioAct, 10) - 1);
    const mesSel = queryMes || document.getElementById('filterMes').value || '';
    const mNum = r => MESES.indexOf(r.mes) + 1;
    const hoy = new Date();
    // Referencia: enero hasta el mes pedido (o hasta el mes actual, o los 12 si es un año ya cerrado) del año anterior.
    // Se comprueba si el anunciante aparece en CUALQUIER mes del año actual.
    let hastaMes;
    if (mesSel) hastaMes = MESES.findIndex(m => norm(m) === norm(mesSel)) + 1;
    else if (parseInt(anioAct, 10) === hoy.getFullYear()) hastaMes = hoy.getMonth() + 1;
    else hastaMes = 12;
    const mesesA = Array.from({length: hastaMes}, (_, i) => i + 1);
    const lblMeses = ms => !ms.length ? '' : ms.length === 1 ? MESES[ms[0]-1].slice(3)
      : MESES[ms[0]-1].slice(3,6) + '–' + MESES[ms[ms.length-1]-1].slice(3,6);

    const _baseCanalPub = DATA.filter(r =>
      (currentCanal === 'TODOS' || r._canal === currentCanal) &&
      (!document.getElementById('filterPub').value || r.pub === document.getElementById('filterPub').value));
    // Año anterior: con todos los filtros (incluida la oficina). Año actual: sin filtrar por oficina,
    // para que quien haya facturado este año en cualquier oficina no cuente como perdido.
    const dataPerd = aplicarFiltros(_baseCanalPub, false, true, ['anunciante']);
    const dataPerdAct = queryOficinas.length ? aplicarFiltros(_baseCanalPub, false, false, ['anunciante']) : dataPerd;

    // Oficina de la fila (Madrid / Barcelona / Internacional; el resto va a «otras»)
    const ofiDe = r => { const o = norm(r.oficina); return o.includes('madrid') ? 'madrid' : o.includes('barcelona') ? 'barcelona' : o.includes('internacional') ? 'internacional' : 'otras'; };
    const ETQ = {madrid:'MADRID', barcelona:'BARCELONA', internacional:'INTERNACIONAL', otras:'OTRAS / SIN OFICINA'};
    const todosMeses = Array.from({length: 12}, (_, i) => i + 1);

    // Perdido en una oficina = ingreso en mesesAnt del año anterior en ESA oficina y ningún ingreso
    // en ningún mes de este año (en cualquier oficina).
    function calcPerdidos(mesesAnt, mesesAct, ofi) {
      const setAnt = new Set(mesesAnt), setAct = new Set(mesesAct), map = new Map();
      const get = r => {
        const k = norm(r.anunciante);
        if (!map.has(k)) map.set(k, {k, nombre: r.anunciante, ant: 0, act: 0, prods: new Map(), marcas: new Map()});
        return map.get(k);
      };
      dataPerd.forEach(r => {
        if (!r.anunciante || r.year !== anioAnt || !setAnt.has(mNum(r)) || ofiDe(r) !== ofi) return;
        const a = get(r), pn = r.producto || '(Sin producto)';
        a.ant += r.ingreso;
        a.prods.set(pn, (a.prods.get(pn) || 0) + r.ingreso);
        if (r.marca) a.marcas.set(r.marca, (a.marcas.get(r.marca) || 0) + r.ingreso);
      });
      dataPerdAct.forEach(r => {
        if (!r.anunciante || r.year !== anioAct || !setAct.has(mNum(r))) return;
        get(r).act += r.ingreso;
      });
      return [...map.values()].filter(a => a.ant > 0.01 && a.act <= 0.01).sort((x, y) => y.ant - x.ant);
    }

    function tablaPerdidos(lista, id) {
      const filas = lista.map((a, i) => {
        const prods = [...a.prods.entries()].filter(([, v]) => v > 0.01).sort((x, y) => y[1] - x[1]);
        const celdaProd = prods.map(([n, v]) => `<div style="display:flex;justify-content:space-between;gap:16px"><span>${_esc(n)}</span><span class="num" style="white-space:nowrap">${fmt(v)}</span></div>`).join('');
        const ms = [...a.marcas.entries()].filter(([, v]) => v > 0.01).sort((x, y) => y[1] - x[1]).map(([n]) => n);
        const txtMarcas = ms.length ? ' <span style="font-weight:400;color:var(--text3)">(' + _esc(ms.slice(0, 4).join(', ')) + (ms.length > 4 ? ' +' + (ms.length - 4) : '') + ')</span>' : '';
        return `<tr class="${id}-row" style="${i >= 50 ? 'display:none' : ''}"><td style="text-align:left;vertical-align:top;font-weight:500">${_esc(a.nombre)}${txtMarcas}</td><td style="text-align:left">${celdaProd}</td><td class="num" style="vertical-align:top;font-weight:600">${fmt(a.ant)}</td></tr>`;
      }).join('');
      const mas = lista.length > 50 ? `<div style="text-align:center;margin-top:10px"><button class="chip" onclick="document.querySelectorAll('.${id}-row').forEach(x=>x.style.display='');this.remove()">Ver los ${fmtN(lista.length)} anunciantes</button></div>` : '';
      return `<table><thead><tr><th style="text-align:left">Anunciante (marcas)</th><th style="text-align:left">Producto · importe ${anioAnt}</th><th>Total perdido</th></tr></thead><tbody>${filas}</tbody></table>${mas}`;
    }

    // Sin oficina en la query: una tarjeta por oficina. Con oficina: solo las pedidas.
    const grupos = queryOficinas.length ? [...queryOficinas] : ['madrid', 'barcelona', 'internacional'];
    if (!queryOficinas.length && dataPerd.some(r => r.year === anioAnt && ofiDe(r) === 'otras')) grupos.push('otras');
    const res = grupos.map(g => ({g, lista: calcPerdidos(mesesA, todosMeses, g)}));
    const totalPerd = res.reduce((t, x) => t + x.lista.reduce((s, a) => s + a.ant, 0), 0);
    const unicos = new Set(res.flatMap(x => x.lista.map(a => a.k))).size;

    html += `<div class="result-card">
      <h3><span class="ico">📉</span>Anunciantes perdidos · <span style="font-weight:400;color:var(--text3)">${_esc(filtroDesc)}</span></h3>
      <div style="font-size:12px;color:var(--text3);margin-bottom:10px">Con ingreso en ${lblMeses(mesesA)} ${anioAnt} y sin ningún ingreso en todo ${anioAct}</div>
      <div class="sum-stats">
        <div class="sum-stat"><div class="v dn">${fmt(totalPerd)}</div><div class="l">total perdido</div></div>
        <div class="sum-stat"><div class="v">${fmtN(unicos)}</div><div class="l">anunciantes perdidos</div></div>
        ${res.length > 1 ? res.filter(x => x.g !== 'otras' || x.lista.length).map(x => `<div class="sum-stat"><div class="v">${fmt(x.lista.reduce((s, a) => s + a.ant, 0))}</div><div class="l">${ETQ[x.g]} · ${fmtN(x.lista.length)}</div></div>`).join('') : ''}
      </div></div>`;
    res.forEach(x => {
      if (x.g === 'otras' && !x.lista.length) return;
      const tot = x.lista.reduce((s, a) => s + a.ant, 0);
      html += `<div class="result-card"><h3><span class="ico">📍</span>${ETQ[x.g]} <span style="font-weight:400;color:var(--text3)">· ${fmtN(x.lista.length)} anunciantes · ${fmt(tot)}</span></h3>` +
        (x.lista.length ? tablaPerdidos(x.lista, 'perd-' + x.g) : `<p style="color:var(--text3)">Ningún anunciante perdido en esta oficina.</p>`) + `</div>`;
    });
  }

  // ── PRESUPUESTO MEDIO ───────────────────────────────────────────────
  else if (pidePresupuesto) {
    if (!hayDatos) {
      html += '<div class="result-card"><h3><span class="ico">💶</span>Presupuesto medio</h3><p style="color:var(--text3)">No se encontraron inserciones para ese filtro.</p></div>';
    } else {

      // ── CANCELAR REPAROS: agrupa por pub+anunciante+marca+producto (ignora mes y año)
      // 1) Reparo TOTAL: pareja pos/neg con el MISMO importe exacto → se eliminan las DOS líneas
      // 2) Reparo PARCIAL: lo que queda sin pareja exacta se fusiona en una sola línea
      //    con el importe neto (pos + neg), porque esa es la venta real
      // 3) Si solo quedan positivos sin pareja → sin reparo → se quedan tal cual
      const gruposReparo = {};
      base.forEach(r => {
        const key = [norm(r.pub), norm(r.anunciante), norm(r.marca), norm(r.producto)].join('||');
        if (!gruposReparo[key]) gruposReparo[key] = [];
        gruposReparo[key].push(r);
      });

      const baseLimpia = [];
      let nReparos = 0;
      Object.values(gruposReparo).forEach(rows => {
        const pos = rows.filter(r => r.ingreso > 0);
        const neg = rows.filter(r => r.ingreso < 0);
        const usedPos = new Set();
        const usedNeg = new Set();

        // 1) Reparo total: pareja exacta en valor absoluto
        neg.forEach(nr => {
          if (usedNeg.has(nr)) return;
          const absNeg = Math.abs(nr.ingreso);
          const match = pos.find(pr => !usedPos.has(pr) && Math.abs(pr.ingreso - absNeg) < 0.01);
          if (match) { usedPos.add(match); usedNeg.add(nr); nReparos += 2; }
        });

        // 2) Reparo parcial: empareja lo que sobra y fusiona en una línea con el neto
        const posRestantes = pos.filter(pr => !usedPos.has(pr));
        const negRestantes = neg.filter(nr => !usedNeg.has(nr));
        const n = Math.min(posRestantes.length, negRestantes.length);
        for (let k = 0; k < n; k++) {
          const pr = posRestantes[k], nr = negRestantes[k];
          baseLimpia.push({...pr, ingreso: pr.ingreso + nr.ingreso});
          nReparos += 2;
        }

        // 3) Resto de positivos sin pareja → se quedan igual
        for (let k = n; k < posRestantes.length; k++) baseLimpia.push(posRestantes[k]);
        // Negativos sin pareja sin pareja → se quedan igual (no afectan, ya negativos)
        for (let k = n; k < negRestantes.length; k++) baseLimpia.push(negRestantes[k]);
      });

      // ── CALCULAR: con y sin líneas a cero
      const totalP     = baseLimpia.reduce((s,r) => s+r.ingreso, 0);
      const conIngreso = baseLimpia.filter(r => r.ingreso > 0);
      const mediaSin   = conIngreso.length > 0 ? totalP / conIngreso.length : 0;
      const mediaCon   = baseLimpia.length > 0 ? totalP / baseLimpia.length : 0;

      const byPubP  = agg(conIngreso, r=>r.pub).map(r=>({...r,media:r.total/r.count})).sort((a,b)=>b.media-a.media);
      const byProdP = agg(conIngreso, r=>r.producto).map(r=>({...r,media:r.total/r.count})).sort((a,b)=>b.media-a.media).slice(0,8);
      const byMesP  = agg(conIngreso, r=>r.mes).map(r=>({...r,media:r.total/r.count})).sort((a,b)=>mesIdx(a.key)-mesIdx(b.key));

      html += `<div class="result-card">
        <h3><span class="ico">💶</span>Presupuesto medio · <span style="font-weight:400;color:var(--text3)">${filtroDesc}</span></h3>
        <div class="sum-stats">
          <div class="sum-stat"><div class="v">${fmt(mediaSin)}</div><div class="l">presupuesto medio (sin ceros)</div></div>
          <div class="sum-stat"><div class="v">${fmt(mediaCon)}</div><div class="l">presupuesto medio (con ceros)</div></div>
          <div class="sum-stat"><div class="v">${fmtN(conIngreso.length)}</div><div class="l">inserciones con ingreso</div></div>
          <div class="sum-stat"><div class="v">${fmt(totalP)}</div><div class="l">ingreso total</div></div>
          ${nReparos > 0 ? `<div class="sum-stat"><div class="v" style="color:var(--red)">${fmtN(nReparos)}</div><div class="l">reparos cancelados</div></div>` : ''}
        </div></div>`;
      if (byPubP.length>1){const mx=Math.max(...byPubP.map(r=>r.media));html+=`<div class="result-card"><h3><span class="ico">📰</span>Presupuesto medio por publicación</h3>${byPubP.map(r=>`<div class="bar-row"><span class="bar-lbl">${r.key}</span><div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.media/mx*100)}%;background:var(--accent)"></div></div><span class="bar-val">${fmt(r.media)} <span style="color:var(--text3);font-size:11px">(${fmtN(r.count)} ins.)</span></span></div>`).join('')}</div>`;}
      if (byProdP.length>1){const mx=Math.max(...byProdP.map(r=>r.media));html+=`<div class="result-card"><h3><span class="ico">📦</span>Presupuesto medio por producto</h3>${byProdP.map(r=>`<div class="bar-row"><span class="bar-lbl">${r.key}</span><div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.media/mx*100)}%;background:#7c3aed"></div></div><span class="bar-val">${fmt(r.media)} <span style="color:var(--text3);font-size:11px">(${fmtN(r.count)} ins.)</span></span></div>`).join('')}</div>`;}
      if (byMesP.length>1){const mx=Math.max(...byMesP.map(r=>r.media));html+=`<div class="result-card"><h3><span class="ico">📅</span>Presupuesto medio por mes</h3>${byMesP.map(r=>`<div class="bar-row"><span class="bar-lbl">${r.key}</span><div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.media/mx*100)}%;background:#f59e0b"></div></div><span class="bar-val">${fmt(r.media)} <span style="color:var(--text3);font-size:11px">(${fmtN(r.count)} ins.)</span></span></div>`).join('')}</div>`;}
    }
  }

  // ── EVOLUCIÓN MENSUAL ───────────────────────────────────────────────
  // Solo si pide evolución explícitamente, O si hay solo un mes sin producto/familia/sector/libre
  else if (pideEvolucion || (queryMes && !queryProductoNorm && !queryProductoGrupo && !queryFamiliaNorm && !querySector && !queryComercial && !queryOficinas.length && tokensLibres.length===0)) {
    const anioActual = queryAnio || document.getElementById('filterAnio').value || String(new Date().getFullYear());
    const anioAnt = String(parseInt(anioActual)-1);
    // Para comparar con el año anterior se usan los datos SIN el filtro de año
    // (se respetan canal, Mes y Publicación del selector).
    const _evMes = document.getElementById('filterMes').value;
    const _evPub = document.getElementById('filterPub').value;
    const dataEvo = DATA.filter(r =>
      (currentCanal === 'TODOS' || r._canal === currentCanal) &&
      (!_evMes || norm(r.mes) === norm(_evMes)) &&
      (!_evPub || r.pub === _evPub));
    const aniosDisp = [...new Set(dataEvo.map(r=>r.year))].filter(Boolean).sort();
    const hayAnioAnt = aniosDisp.includes(anioAnt);

    function basePub(anio) {
      let b = dataEvo.filter(r=>r.year===anio).filter(r=>filtrarElleDecor(r));
      if (queryPubTerm)      b = b.filter(r=>pubRowMatches(r.pub, queryPubTerm));
      if (querySector)       b = b.filter(r=>norm(r.sector).includes(norm(querySector)));
      if (queryFamiliaNorm)  b = b.filter(r=>norm(r.familia).includes(queryFamiliaNorm));
      if (queryProductoNorm) b = b.filter(r=>norm(r.producto) === queryProductoNorm);
      if (queryProductoGrupo) b = b.filter(r=>queryProductoGrupo.productos.some(p => norm(r.producto) === norm(p)));
      if (queryComercial)    b = b.filter(r=>norm(r.comercial).includes(norm(queryComercial)));
      if (queryOficinas.length) b = b.filter(r=>queryOficinas.some(o=>norm(r.oficina).includes(o)));
      if (tokensLibres.length > 0) {
        const ff = ['anunciante','marca','detalle','oficina'];
        b = b.filter(r=>{ const ac=ff.map(f=>norm(r[f]||'')).join(' '); return _free.test(ac); });
      }
      return b;
    }

    if (queryMes && !pideEvolucion) {
      // Detalle de un mes concreto
      const mesData = base;
      const totalIng = mesData.reduce((s,r)=>s+r.ingreso,0);
      const byPub = agg(mesData,r=>r.pub).slice(0,10);
      const bySector = agg(mesData,r=>r.sector).slice(0,8);
      const byAnunciante = agg(mesData,r=>r.anunciante).slice(0,10);
      const byCanal = agg(mesData,r=>r._canal);
      html += `<div class="result-card">
        <h3><span class="ico">📅</span>${queryMes.slice(3)}${queryPubTerm?' · '+queryPubTerm:''}</h3>
        <div class="sum-stats">
          <div class="sum-stat"><div class="v">${fmt(totalIng)}</div><div class="l">ingreso total</div></div>
          <div class="sum-stat"><div class="v">${fmtN(mesData.length)}</div><div class="l">inserciones</div></div>
          <div class="sum-stat"><div class="v">${new Set(mesData.map(r=>r.anunciante)).size}</div><div class="l">anunciantes</div></div>
        </div>
        ${byCanal.length>1?'<div style="margin-top:10px">'+byCanal.map(r=>`<span class="pill ${r.key}">${r.key}: ${fmt(r.total)}</span>`).join('')+'</div>':''}
      </div>`;
      if (byPub.length>1) html += bars('Por publicación', byPub, '📰', 10);
      if (bySector.length>1) html += bars('Sectores', bySector, '🏭', 8, '#7c3aed');
      if (byAnunciante.length>1) html += bars('Top anunciantes', byAnunciante, '🏢', 10, '#16a34a');
      html += insertionsBlock(mesData, _det);
    } else {
      // Evolución mensual con comparativa año anterior
      const dataAct = basePub(anioActual);
      const dataAnt = basePub(anioAnt);
      const mapAct={}, mapAnt={};
      dataAct.forEach(r=>{mapAct[norm(r.mes)]=(mapAct[norm(r.mes)]||0)+r.ingreso;});
      dataAnt.forEach(r=>{mapAnt[norm(r.mes)]=(mapAnt[norm(r.mes)]||0)+r.ingreso;});
      const mesesConDatos = MESES.filter(m=>mapAct[norm(m)]>0);
      const maxVal = Math.max(...mesesConDatos.map(m=>Math.max(mapAct[norm(m)]||0,mapAnt[norm(m)]||0)),1);
      const color = CANAL_COLORS[currentCanal];
      const colorAnt = '#cbd5e1';
      const tituloEntidad = queryPubTerm ? ` · ${queryPubTerm}` : '';

      // ── SPARKLINE SVG ──────────────────────────────────────────────────────
      const totalAct = dataAct.reduce((s,r)=>s+r.ingreso,0);
      const totalAnt = dataAnt.reduce((s,r)=>s+r.ingreso,0);
      const varTotal = totalAnt>0 ? ((totalAct-totalAnt)/totalAnt*100) : null;
      const tendPct  = varTotal!==null ? (varTotal>=0?'+':'')+varTotal.toFixed(1)+'%' : '';
      const tendColor = varTotal===null ? '#94a3b8' : (varTotal>=0 ? '#16a34a' : '#dc2626');
      const tendIcon  = varTotal===null ? '→' : (varTotal>=0 ? '▲' : '▼');

      // Construir sparkline con los valores del año actual
      const spW=280, spH=64, spPad=8;
      const spVals = mesesConDatos.map(m=>mapAct[norm(m)]||0);
      const spMin=Math.min(...spVals), spMax=Math.max(...spVals);
      const spRng=spMax-spMin||1;
      const spN=spVals.length;
      const spPts = spVals.map((v,i)=>{
        const x=spPad+(spN===1?(spW-spPad*2)/2:i/(spN-1)*(spW-spPad*2));
        const y=spPad+(spH-spPad*2)-((v-spMin)/spRng*(spH-spPad*2));
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      });
      const spLine=spPts.join(' ');
      const spArea=`${spPad},${spH-spPad} ${spLine} ${spW-spPad},${spH-spPad}`;
      const gradId='spg'+Math.floor(Math.random()*99999);

      const sparkCard = `<div style="background:linear-gradient(135deg,#1e40af,#3b82f6);border-radius:14px;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:20px;box-shadow:0 4px 16px rgba(37,99,235,0.25)">
        <div style="flex:1;min-width:0">
          <div style="color:rgba(255,255,255,0.75);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px">
            Evolución${tituloEntidad} · ${anioActual}
          </div>
          <div style="color:#fff;font-size:26px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px">${fmtK(totalAct)}</div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <span style="color:rgba(255,255,255,0.7);font-size:12px">${fmtN(dataAct.length)} inserciones</span>
            ${varTotal!==null?`<span style="background:rgba(255,255,255,0.15);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px">${tendIcon} ${tendPct} vs ${anioAnt}</span>`:''}
          </div>
          ${hayAnioAnt?`<div style="color:rgba(255,255,255,0.55);font-size:11px;margin-top:4px">${anioAnt}: ${fmtK(totalAnt)}</div>`:''}
        </div>
        <div style="flex-shrink:0">
          <svg width="${spW}" height="${spH}" viewBox="0 0 ${spW} ${spH}" style="display:block">
            <defs>
              <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
                <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
              </linearGradient>
            </defs>
            <polygon points="${spArea}" fill="url(#${gradId})"/>
            <polyline points="${spLine}" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
            ${spPts.map((pt,i)=>{
              const [x,y]=pt.split(',');
              const isMax=spVals[i]===spMax, isMin=spVals[i]===spMin;
              if(!isMax&&!isMin) return '';
              return `<circle cx="${x}" cy="${y}" r="4" fill="${isMax?'#fbbf24':'rgba(255,255,255,0.6)'}" stroke="white" stroke-width="1.5"/>`;
            }).join('')}
          </svg>
        </div>
      </div>`;

      // ── BARRAS DOBLES (año actual vs anterior) ─────────────────────────────
      const barsHtml = mesesConDatos.map(m=>{
        const mn=norm(m); const vAct=mapAct[mn]||0,vAnt=mapAnt[mn]||0;
        const pAct=Math.round(vAct/maxVal*100),pAnt=Math.round(vAnt/maxVal*100);
        const diff=vAnt>0?((vAct-vAnt)/vAnt*100):null;
        const diffStr=diff===null?'':`<span class="${diff>=0?'up':'dn'}" style="font-size:10px;margin-left:4px">${diff>=0?'▲':'▼'}${Math.abs(diff).toFixed(1)}%</span>`;
        return `<div class="bar-row" style="margin-bottom:10px">
          <span class="bar-lbl" style="font-weight:500">${m.slice(3)}</span>
          <div style="flex:1">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
              <div class="bar-wrap" style="flex:1"><div class="bar-fill" style="width:${pAct}%;background:${color}"></div></div>
              <span style="min-width:90px;text-align:right;font-family:'DM Mono',monospace;font-size:11px">${fmt(vAct)}${diffStr}</span>
            </div>
            ${hayAnioAnt?`<div style="display:flex;align-items:center;gap:6px">
              <div class="bar-wrap" style="flex:1"><div class="bar-fill" style="width:${pAnt}%;background:${colorAnt}"></div></div>
              <span style="min-width:90px;text-align:right;font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)">${fmt(vAnt)}</span>
            </div>`:''}
          </div>
        </div>`;
      }).join('');

      const leyenda = hayAnioAnt?`<div style="display:flex;gap:16px;margin-bottom:14px;font-size:11px">
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${color};margin-right:4px"></span>${anioActual}</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${colorAnt};margin-right:4px"></span>${anioAnt}</span>
      </div>`:'';

      html += sparkCard;
      html += `<div class="result-card"><h3><span class="ico">📈</span>Mes a mes${tituloEntidad}</h3>${leyenda}${barsHtml}</div>`;

      // ── DESGLOSE adicional ─────────────────────────────────────────────────
      const byPubEv = agg(dataAct, r=>r.pub).slice(0,8);
      const bySectorEv = agg(dataAct, r=>r.sector).slice(0,6);
      const byAnuncianteEv = agg(dataAct, r=>r.anunciante).slice(0,8);
      const byProductoEv = agg(dataAct, r=>r.producto).slice(0,6);

      if (!queryPubTerm && byPubEv.length>1) html += bars('Ingresos por publicación', byPubEv, '📰', 8);
      if (bySectorEv.length>1) html += bars('Top sectores', bySectorEv, '🏭', 6, '#7c3aed');
      if (byAnuncianteEv.length>1) html += bars('Top anunciantes', byAnuncianteEv, '🏢', 8, '#16a34a');
      if (byProductoEv.length>1) html += bars('Top productos', byProductoEv, '📦', 6, '#f59e0b');
    }
  }
  // ── RANKING SECTORES (puro, sin otros filtros) ──────────────────────
  else if (pideSector && esQueryPura) {
    const rows = agg(data, r=>r.sector);
    html += bars('Ingresos por sector', rows, '🏭', 15);
    html += tbl('Ranking de sectores',['#','Sector','Ingresos','Inserciones'],
      rows.slice(0,20).map((r,i)=>[`${['🥇','🥈','🥉'][i]||i+1}`,r.key,fmt(r.total),fmtN(r.count)]),'📊');
  }

  // ── RANKING MARCAS (puro) ───────────────────────────────────────────
  else if (pideMarca && esQueryPura) {
    const rows = agg(data, r=>r.marca);
    html += bars('Top marcas', rows, '🏷️', 10);
    html += tbl('Top 20 marcas',['#','Marca','Ingresos','Inserciones'],
      rows.slice(0,20).map((r,i)=>[i+1,r.key,fmt(r.total),fmtN(r.count)]),'📋');
  }

  // ── RANKING ANUNCIANTES (puro) ──────────────────────────────────────
  else if (pideAnunciante && esQueryPura) {
    const rows = agg(data, r=>r.anunciante);
    html += bars('Top anunciantes', rows, '🏢', 10);
    html += tbl('Top 20 anunciantes',['#','Anunciante','Ingresos','Inserciones'],
      rows.slice(0,20).map((r,i)=>[i+1,r.key,fmt(r.total),fmtN(r.count)]),'📋');
  }

  // ── RANKING COMERCIALES (puro) ──────────────────────────────────────
  else if (pideComercial && esQueryPura) {
    const rows = agg(data, r=>r.comercial);
    html += bars('Ingresos por comercial', rows, '👤', 15);
    html += tbl('Ranking comerciales',['#','Comercial','Ingresos','Inserciones'],
      rows.slice(0,20).map((r,i)=>[i+1,r.key,fmt(r.total),fmtN(r.count)]),'📋');
  }

  // ── ÁREA / ZONA (puro) ──────────────────────────────────────────────
  else if (pideArea && esQueryPura) {
    const byArea = agg(data, r=>r.area);
    html += bars('Ingresos por área', byArea, '📍', 12);
    const byZona = agg(data, r=>getZona(r.area)||'Otras');
    html += bars('Ingresos por zona', byZona, '🗺️', 6, '#16a34a');
    html += tbl('Detalle por zona',['Zona','Ingresos','Inserciones'],
      byZona.map(r=>[r.key,fmt(r.total),fmtN(r.count)]),'📋');
  }

  // ── FAMILIA ESPECÍFICA (grupo o exacta, sin términos libres) ────────
  else if ((queryFamiliaGrupo || queryFamiliaNorm) && !hayLibres) {
    const totalIng = base.reduce((s,r)=>s+r.ingreso,0);
    const totalIns = base.length;
    const numAnunciantes = new Set(base.map(r=>r.anunciante)).size;
    const labelFam = queryFamiliaGrupo ? queryFamiliaGrupo.label.toUpperCase() : queryFamiliaLabel;
    
    // Tarjeta resumen
    html += `<div class="result-card">
      <h3><span class="ico">🗂️</span>${labelFam}</h3>
      <div class="sum-stats">
        <div class="sum-stat"><div class="v">${fmt(totalIng)}</div><div class="l">ingreso total</div></div>
        <div class="sum-stat"><div class="v">${fmtN(totalIns)}</div><div class="l">inserciones</div></div>
        <div class="sum-stat"><div class="v">${numAnunciantes}</div><div class="l">anunciantes</div></div>
      </div>
    </div>`;
    
    // Si es grupo, mostrar desglose por subfamilia
    if (queryFamiliaGrupo) {
      const bySubfam = agg(base, r=>r.familia);
      const maxSub = bySubfam[0]?.total || 1;
      const desgloseHtml = bySubfam.map(r => `
        <div class="bar-row">
          <span class="bar-lbl">${r.key}</span>
          <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.total/maxSub*100)}%;background:${CANAL_COLORS[currentCanal]}"></div></div>
          <span class="bar-val">${fmt(r.total)}</span>
        </div>`).join('');
      html += `<div class="result-card"><h3><span class="ico">📊</span>Desglose por subfamilia</h3>${desgloseHtml}</div>`;
    }
    
    // Por publicación
    const byPub = agg(base, r=>r.pub).slice(0,10);
    if (byPub.length > 1) html += bars('Por publicación', byPub, '📰', 10);
    
    // Evolución mensual
    const byMes = agg(base, r=>r.mes).sort((a,b)=>mesIdx(a.key)-mesIdx(b.key));
    if (byMes.length > 1) {
      const maxMes = Math.max(...byMes.map(r=>r.total));
      const mesHtml = byMes.map(r => `
        <div class="bar-row">
          <span class="bar-lbl">${r.key}</span>
          <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.total/maxMes*100)}%;background:${CANAL_COLORS[currentCanal]}"></div></div>
          <span class="bar-val">${fmt(r.total)}</span>
        </div>`).join('');
      html += `<div class="result-card"><h3><span class="ico">📈</span>Evolución mensual</h3>${mesHtml}</div>`;
    }
    
    // Top anunciantes
    const byAnunciante = agg(base, r=>r.anunciante).slice(0,10);
    if (byAnunciante.length > 1) html += bars('Top anunciantes', byAnunciante, '🏢', 10, '#16a34a');
    
    // Inserciones
    const _det = queryFamiliaGrupo ? [`Grupo: ${queryFamiliaGrupo.label}`] : [`Familia: ${queryFamiliaLabel}`];
    html += insertionsBlock(base, _det);
  }

  // ── GRUPO DE PRODUCTO ESPECÍFICO (Social Paid / Social Organic / Social Ignition, etc.) ──
  else if (queryProductoGrupo && !hayLibres) {
    const totalIng = base.reduce((s,r)=>s+r.ingreso,0);
    const totalIns = base.length;
    const numAnunciantes = new Set(base.map(r=>r.anunciante)).size;

    // Tarjeta resumen
    html += `<div class="result-card">
      <h3><span class="ico">📱</span>${queryProductoGrupo.label}</h3>
      <div class="sum-stats">
        <div class="sum-stat"><div class="v">${fmt(totalIng)}</div><div class="l">ingreso total</div></div>
        <div class="sum-stat"><div class="v">${fmtN(totalIns)}</div><div class="l">inserciones</div></div>
        <div class="sum-stat"><div class="v">${numAnunciantes}</div><div class="l">anunciantes</div></div>
      </div>
    </div>`;

    // Desglose por producto dentro del grupo
    const byProdGrupo = agg(base, r=>r.producto);
    if (byProdGrupo.length > 1) {
      const maxProd = byProdGrupo[0]?.total || 1;
      const desgloseHtml = byProdGrupo.map(r => `
        <div class="bar-row">
          <span class="bar-lbl">${r.key}</span>
          <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.total/maxProd*100)}%;background:${CANAL_COLORS[currentCanal]}"></div></div>
          <span class="bar-val">${fmt(r.total)}</span>
        </div>`).join('');
      html += `<div class="result-card"><h3><span class="ico">📊</span>Desglose por producto</h3>${desgloseHtml}</div>`;
    }

    // Por publicación
    const byPub = agg(base, r=>r.pub).slice(0,10);
    if (byPub.length > 1) html += bars('Por publicación', byPub, '📰', 10);

    // Evolución mensual
    const byMes = agg(base, r=>r.mes).sort((a,b)=>mesIdx(a.key)-mesIdx(b.key));
    if (byMes.length > 1) {
      const maxMes = Math.max(...byMes.map(r=>r.total));
      const mesHtml = byMes.map(r => `
        <div class="bar-row">
          <span class="bar-lbl">${r.key}</span>
          <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.total/maxMes*100)}%;background:${CANAL_COLORS[currentCanal]}"></div></div>
          <span class="bar-val">${fmt(r.total)}</span>
        </div>`).join('');
      html += `<div class="result-card"><h3><span class="ico">📈</span>Evolución mensual</h3>${mesHtml}</div>`;
    }

    // Top anunciantes
    const byAnunciante = agg(base, r=>r.anunciante).slice(0,10);
    if (byAnunciante.length > 1) html += bars('Top anunciantes', byAnunciante, '🏢', 10, '#16a34a');

    // Inserciones
    const _detGrupo = [`Grupo: ${queryProductoGrupo.label}`];
    html += insertionsBlock(base, _detGrupo);
  }

  // ── FAMILIAS (puro — listado general) ─────────────────────────────────
  else if (pideFamilia && esQueryPura) {
    const rows = agg(data, r=>r.familia);
    html += bars('Ingresos por familia de producto', rows, '🗂️', 10);
    html += tbl('Ranking familias',['#','Familia','Ingresos','Inserciones'],
      rows.slice(0,15).map((r,i)=>[i+1,r.key,fmt(r.total),fmtN(r.count)]),'📋');
  }

  // ── PRODUCTOS (puro) ────────────────────────────────────────────────
  else if (pideProducto && esQueryPura) {
    const rows = agg(data, r=>r.producto);
    html += bars('Top productos', rows, '📦', 10);
    html += tbl('Top 20 productos',['#','Producto','Ingresos','Inserciones'],
      rows.slice(0,20).map((r,i)=>[i+1,r.key,fmt(r.total),fmtN(r.count)]),'📋');
  }

  // ── MIX DE CANAL (puro) ─────────────────────────────────────────────
  else if (pideMix && esQueryPura) {
    const byCanal = agg(data, r=>r._canal);
    const total = byCanal.reduce((s,r)=>s+r.total,0);
    const b = byCanal.map(r=>`
      <div class="bar-row">
        <span class="bar-lbl"><span class="pill ${r.key}">${r.key}</span></span>
        <div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.total/total*100)}%;background:${CANAL_COLORS[r.key]||'#888'}"></div></div>
        <span class="bar-val">${fmt(r.total)} (${Math.round(r.total/total*100)}%)</span>
      </div>`).join('');
    html += `<div class="result-card"><h3><span class="ico">📊</span>Mix de canal</h3>${b}</div>`;
    html += tbl('Detalle por canal',['Canal','Ingresos','%','Inserciones'],
      byCanal.map(r=>[`<span class="pill ${r.key}">${r.key}</span>`,fmt(r.total),Math.round(r.total/total*100)+'%',fmtN(r.count)]),'📊');
  }

  // ── OFICINAS (puro) ─────────────────────────────────────────────────
  else if (pideOficina && esQueryPura) {
    const rows = agg(data, r=>r.oficina);
    html += bars('Ingresos por oficina / centro de venta', rows, '🏪', 10);
    html += tbl('Ranking oficinas',['#','Oficina','Ingresos','Inserciones'],
      rows.slice(0,15).map((r,i)=>[i+1,r.key,fmt(r.total),fmtN(r.count)]),'📋');
  }

  // ── RESUMEN GENERAL (puro) ──────────────────────────────────────────
  else if ((pideIngresos || pideRanking) && esQueryPura) {
    const totalIng = data.reduce((s,r)=>s+r.ingreso,0);
    const byCanal = agg(data, r=>r._canal);
    const byPub = agg(data, r=>r.pub).slice(0,10);
    const bySector = agg(data, r=>r.sector).slice(0,10);
    const byMes = agg(data, r=>r.mes).sort((a,b)=>mesIdx(a.key)-mesIdx(b.key));
    const byAnunciante = agg(data, r=>r.anunciante).slice(0,10);
    html += `<div class="result-card">
      <h3><span class="ico">💰</span>Resumen de ingresos</h3>
      <div class="sum-stats">
        <div class="sum-stat"><div class="v">${fmt(totalIng)}</div><div class="l">ingreso total</div></div>
        <div class="sum-stat"><div class="v">${fmtN(data.length)}</div><div class="l">inserciones</div></div>
        <div class="sum-stat"><div class="v">${new Set(data.map(r=>r.anunciante)).size}</div><div class="l">anunciantes</div></div>
      </div>
      <div style="margin-top:14px">
        ${byCanal.map(r=>`<span class="pill ${r.key}">${r.key}: ${fmt(r.total)} (${Math.round(r.total/totalIng*100)}%)</span>`).join(' ')}
      </div>
    </div>`;
    html += bars('Top publicaciones', byPub, '📰', 10);
    html += bars('Top sectores', bySector, '🏭', 10, '#7c3aed');
    html += bars('Top anunciantes', byAnunciante, '🏢', 10, '#16a34a');
    if (byMes.length>1){
      const max=Math.max(...byMes.map(r=>r.total));
      html+=`<div class="result-card"><h3><span class="ico">📈</span>Evolución mensual</h3>${byMes.map(r=>`<div class="bar-row"><span class="bar-lbl">${r.key}</span><div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.total/max*100)}%;background:${CANAL_COLORS[currentCanal]}"></div></div><span class="bar-val">${fmt(r.total)}</span></div>`).join('')}</div>`;
    }
  }

  // ── BÚSQUEDA COMBINADA — cualquier combinación de filtros ───────────
  // "ingresos elle", "insider elle enero", "branded content cosmopolitan marzo", "nike elle"...
  else if (hayDatos) {
    const totalIng = base.reduce((s,r)=>s+r.ingreso,0);
    const byPub = agg(base, r=>r.pub).slice(0,8);
    const byMes = agg(base, r=>r.mes).sort((a,b)=>mesIdx(a.key)-mesIdx(b.key));
    const bySector = agg(base, r=>r.sector).slice(0,6);
    const byAnunciante = agg(base, r=>r.anunciante).slice(0,8);
    const byProducto = agg(base, r=>r.producto).slice(0,6);
    const byFamilia = agg(base, r=>r.familia).slice(0,6);
    const byCanal = agg(base, r=>r._canal);

    html += `<div class="result-card">
      <h3><span class="ico">💰</span>Ingresos · <span style="font-weight:400;color:var(--text3)">${filtroDesc}</span></h3>
      <div class="sum-stats">
        <div class="sum-stat"><div class="v">${fmt(totalIng)}</div><div class="l">ingreso total</div></div>
        <div class="sum-stat"><div class="v">${fmtN(base.length)}</div><div class="l">inserciones</div></div>
        <div class="sum-stat"><div class="v">${new Set(base.map(r=>r.anunciante)).size}</div><div class="l">anunciantes</div></div>
      </div>
      ${byCanal.length>1?'<div style="margin-top:10px">'+byCanal.map(r=>`<span class="pill ${r.key}">${r.key}: ${fmt(r.total)}</span>`).join('')+'</div>':''}
    </div>`;
    if (byPub.length>1) html += bars('Por publicación / site', byPub, '📰', 8);
    if (bySector.length>1) html += bars('Sectores', bySector, '🏭', 6, '#7c3aed');
    if (byAnunciante.length>1) html += bars('Top anunciantes', byAnunciante, '🏢', 8, '#16a34a');
    if (byProducto.length>1) html += bars('Productos', byProducto, '📦', 6, '#f59e0b');
    if (byFamilia.length>1) html += bars('Familias', byFamilia, '🗂️', 6, '#0891b2');
    if (!queryMes && byMes.length>1){
      const max=Math.max(...byMes.map(r=>r.total));
      html+=`<div class="result-card"><h3><span class="ico">📈</span>Evolución mensual</h3>${byMes.map(r=>`<div class="bar-row"><span class="bar-lbl">${r.key}</span><div class="bar-wrap"><div class="bar-fill" style="width:${Math.round(r.total/max*100)}%;background:${CANAL_COLORS[currentCanal]}"></div></div><span class="bar-val">${fmt(r.total)}</span></div>`).join('')}</div>`;
    }
    html += insertionsBlock(base, _det);
  }

  // ── SIN RESULTADOS ──────────────────────────────────────────────────
  if (!html) {
    html = '<div style="color:#dc2626;font-weight:600;font-size:14px;padding:20px 0;">⚠️ No se han encontrado resultados para tu búsqueda. Prueba con otros términos.</div>';
  }

  // Qué sector(es) se han incluido realmente (ayuda a comprobar que la cifra es la esperada)
  if (querySector && base.length) {
    const _nomSec = [...new Set(base.map(r => r.sector).filter(Boolean))];
    html = '<div style="background:#f5f3ff;border:1px solid #ddd6fe;color:#5b21b6;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:12px">🏭 Sector incluido: <strong>' +
      _nomSec.slice(0, 5).join(', ') + (_nomSec.length > 5 ? '…' : '') + '</strong></div>' + html;
  }

  // Aviso de palabras corregidas por tolerancia a errores tipográficos
  if (_free && _free.avisos.length) {
    html = '<div style="background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:12px">🔎 Buscando también: ' +
      _free.avisos.map(a => '<strong>' + a.corr.join(', ') + '</strong> (por «' + a.orig + '»)').join(' · ') + '</div>' + html;
  }

  document.getElementById('results').innerHTML = html;
  document.getElementById('results').scrollIntoView({behavior:'smooth',block:'start'});
}


// ── BÚSQUEDA POR VOZ ─────────────────────────────────────────────────
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;

if (SpeechRecognitionAPI) {
  recognition = new SpeechRecognitionAPI();
  recognition.lang = 'es-ES';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    isListening = true;
    document.getElementById('micBtn').classList.add('listening');
    document.getElementById('micBtn').textContent = '⏺️';
  };

// Correcciones de palabras que el reconocimiento de voz suele confundir.
// Añade aquí más entradas si detectas otras confusiones (todo en minúsculas).
const VOICE_CORRECTIONS = [
  { from: /\bel\b/gi, to: 'Elle' },
  { from: /\bél\b/gi, to: 'Elle' }
];

function applyVoiceCorrections(text) {
  let corrected = text;
  VOICE_CORRECTIONS.forEach(rule => { corrected = corrected.replace(rule.from, rule.to); });
  return corrected;
}

  recognition.onresult = (event) => {
    const transcript = applyVoiceCorrections(event.results[0][0].transcript);
    document.getElementById('queryInput').value = transcript;
    runQuery();
  };

  recognition.onerror = (event) => {
    console.warn('Error de reconocimiento de voz:', event.error);
    if (event.error === 'not-allowed' || event.error === 'permission-denied') {
      alert('Necesitas dar permiso de micrófono para usar la búsqueda por voz.');
    }
  };

  recognition.onend = () => {
    isListening = false;
    const btn = document.getElementById('micBtn');
    btn.classList.remove('listening');
    btn.textContent = '🎤';
  };
} else {
  // Navegador sin soporte: ocultamos el botón
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('micBtn');
    if (btn) btn.classList.add('unsupported');
  });
}

function toggleVoiceSearch() {
  if (!recognition) return;
  if (isListening) {
    recognition.stop();
  } else {
    recognition.start();
  }
}

document.addEventListener('DOMContentLoaded', loadFromSharePoint);

// PWA: registra el service worker (no afecta a la carga de los Excel)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW no registrado:', err));
  });
}
</script>
