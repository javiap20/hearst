function buildForecastMonthCards(base,actual,state,activeMonths,closedMonths){
  let cards='';
  const forecastYear=resolveForecastBaseYear()+1;
  const showAllMonths=forecastManualMonthView==='all';
  let visibleCount=0;
  for(let m=1;m<=12;m++){
    const isClosed=closedMonths.has(m);
    if(isClosed&&!showAllMonths) continue;
    visibleCount++;
    const forecastTotal=Math.round(FORECAST_CHANNELS.reduce((s,c)=>s+getEffectiveForecastValue(state,actual,closedMonths,m,c),0));
    const baseTotal=Math.round(base[m].total||0);
    const diff=forecastTotal-baseTotal;
    const pct=baseTotal!==0?diff/baseTotal*100:null;
    const tone=isClosed?'closed':diff>0?'positive':diff<0?'negative':'neutral';
    const pctClass=diff>0?'pos':diff<0?'neg':'';
    const rows=FORECAST_CHANNELS.map(c=>{
      const meta=FORECAST_CHANNEL_LABELS[c];
      const value=getEffectiveForecastValue(state,actual,closedMonths,m,c);

        ? `<div class="forecast-real-value" title="Mes finalizado: dato real de ${forecastYear}"><span>🔒</span>${formatEUR(value)}</div>`

          <button title="Restar 1.000 €" onclick="adjustForecast(${m},'${c}',-1000)">−</button>
          <input class="forecast-value-input" value="${formatEditableNumber(value)}" inputmode="decimal" onfocus="this.select()" onkeydown="if(event.key==='Enter')this.blur()" onchange="setForecastValue(${m},'${c}',this.value)">
          <button title="Sumar 1.000 €" onclick="adjustForecast(${m},'${c}',1000)">+</button>
        </div>`;
      return `<div class="forecast-channel-row${isClosed?' closed':''}">
        <div class="forecast-channel-name"><span class="forecast-channel-dot" style="background:${meta.color}"></span>${meta.icon} ${c}</div>
        <div class="forecast-base-value">${formatEUR(base[m][c]||0)}</div>
        ${valueControl}
      </div>`;

function forecastSummaryFocusMonth(activeMonths){

function forecastTableColgroup(metricColumnsOverride){

function buildForecastChannelObjectivePlan(base,state,activeMonths){
  const objectiveAnnual=Number(state.objective)||0;
  const baseAnnualTotal=Object.values(base).reduce((sum,item)=>sum+(Number(item&&item.total)||0),0);
  let objectiveSelected=0;
  for(let m=1;m<=12;m++){
    const monthObjective=objectiveAnnual*(baseAnnualTotal!==0?(Number(base[m]&&base[m].total)||0)/baseAnnualTotal:1/12);
    if(activeMonths.has(m)) objectiveSelected+=monthObjective;
  }

  const plan={objectiveAnnual,objectiveSelected,scale:0,channels:{}};
  let rawSelectedTotal=0;
  FORECAST_CHANNELS.forEach(canal=>{
    const annualInfo=resolveForecastChannelObjective(canal,base);
    const annualObjective=Number(annualInfo.value)||0;
    const baseAnnual=Object.values(base).reduce((sum,item)=>sum+(Number(item&&item[canal])||0),0);
    let baseSelected=0;
    for(let m=1;m<=12;m++) if(activeMonths.has(m)) baseSelected+=Number(base[m]&&base[m][canal])||0;
    const selectedWeight=baseAnnual!==0?baseSelected/baseAnnual:activeMonths.size/12;
    const rawSelected=annualObjective*selectedWeight;
    plan.channels[canal]={annualObjective,baseAnnual,rawSelected};
    rawSelectedTotal+=rawSelected;
  });
  plan.scale=rawSelectedTotal!==0?objectiveSelected/rawSelectedTotal:0;
  return plan;
}
function forecastChannelMonthlyObjective(plan,base,canal,month){
  const info=plan.channels[canal]||{annualObjective:0,baseAnnual:0};
  if(info.baseAnnual!==0){
    const raw=info.annualObjective*((Number(base[month]&&base[month][canal])||0)/info.baseAnnual);
    return raw*(plan.scale||0);
  }
  const activeChannelCount=Math.max(1,forecastActiveChannels().length||FORECAST_CHANNELS.length);
  const totalBaseAnnual=Object.values(base).reduce((sum,item)=>sum+(Number(item&&item.total)||0),0);
  const totalMonthObjective=plan.objectiveAnnual*(totalBaseAnnual!==0?(Number(base[month]&&base[month].total)||0)/totalBaseAnnual:1/12);
  return totalMonthObjective/activeChannelCount;
}

      <td class="${forecastDiffClass(vsBase)}"><div class="forecast-table-comparison-main">${vsBase>0?'+':''}${formatEUR(vsBase)}</div><div class="forecast-table-comparison-meta">${vsBasePct===null?'—':forecastPct(vsBasePct)+' vs. '+resolveForecastBaseYear()}</div></td>
      <td>${formatEUR(monthlyObjective)}</td>

function buildForecastSummary(base,actual,state,activeMonths,closedMonths){
  const forecastYear=resolveForecastBaseYear()+1;
  const isPrevision=forecastDashboardMode==='prevision';
  const focusMonth=forecastSummaryFocusMonth(activeMonths);

function forecastDimensionEmptyBucket(){
  return {total:0,estimable:0,programmatic:0};
}
function buildForecastDimensionDetail(rows,keyResolver){
  const detail={};
  for(let m=1;m<=12;m++){
    detail[m]={};
    FORECAST_CHANNELS.forEach(c=>{ detail[m][c]={}; });
  }
  (rows||[]).forEach(d=>{
    const m=Number(d.mes),canal=d.canal;
    if(!detail[m]||!FORECAST_CHANNELS.includes(canal)) return;
    const key=keyResolver(d)||'sin asignar';
    if(!detail[m][canal][key]) detail[m][canal][key]=forecastDimensionEmptyBucket();
    const value=Number(d.importe)||0;
    const bucket=detail[m][canal][key];
    bucket.total+=value;
    if(canal==='Digital'&&isProgramaticaProducto(d)) bucket.programmatic+=value;
    else bucket.estimable+=value;
  });
  return detail;
}
function forecastDimensionBucket(detail,month,canal,key){
  return detail&&detail[month]&&detail[month][canal]&&detail[month][canal][key]
    ? detail[month][canal][key]
    : forecastDimensionEmptyBucket();
}
function forecastDimensionActualMap(rows,month,year,canal,keyResolver,useCutoff){
  const groups={};
  (rows||[]).forEach(d=>{
    if(Number(d.mes)!==Number(month)||d.canal!==canal) return;
    const key=keyResolver(d)||'sin asignar';
    if(!groups[key]) groups[key]={all:[],estimable:[],programmatic:[]};
    groups[key].all.push(d);
    if(canal==='Digital'&&isProgramaticaProducto(d)) groups[key].programmatic.push(d);
    else groups[key].estimable.push(d);
  });
  const out={};
  const timing=forecastChannelTiming(month,year,canal);
  const cutoff=Math.min(Math.max(timing.asOfUtc,timing.periodStart),timing.periodEnd);
  Object.entries(groups).forEach(([key,group])=>{
    if(useCutoff){
      out[key]={
        total:forecastActualCumulativeAt(group.all,cutoff,timing,'raw',0),
        estimable:forecastActualCumulativeAt(group.estimable,cutoff,timing,'raw',0),
        programmatic:forecastActualCumulativeAt(group.programmatic,cutoff,timing,'raw',0)
      };
    }else{
      const sum=list=>list.reduce((total,row)=>total+(Number(row.importe)||0),0);
      out[key]={total:sum(group.all),estimable:sum(group.estimable),programmatic:sum(group.programmatic)};
    }
  });
  return out;
}
function forecastDimensionEstimateAllocation(totalEstimate,actualMap,baseDetail,month,canal,candidateKeys,excludedKeys=[]){
  const excluded=new Set(excludedKeys||[]);
  let candidates=Array.from(new Set(candidateKeys||[])).filter(key=>key&&!excluded.has(key));
  if(candidates.length===0&&Math.round(Number(totalEstimate)||0)!==0) candidates=['sin asignar'];
  const weights={};
  let weightTotal=0;
  candidates.forEach(key=>{
    const weight=Math.abs(Number(actualMap&&actualMap[key]&&actualMap[key].estimable)||0);
    weights[key]=weight;
    weightTotal+=weight;
  });
  if(weightTotal===0){
    candidates.forEach(key=>{
      const weight=Math.abs(Number(forecastDimensionBucket(baseDetail,month,canal,key).estimable)||0);
      weights[key]=weight;
      weightTotal+=weight;
    });
  }
  return allocateForecastByPublication(totalEstimate,weights,candidates);
}

function allocateForecastByPublication(total,weights,candidateKeys){
  const target=Math.round(Number(total)||0);
  const keys=Array.from(new Set([...(candidateKeys||[]),...Object.keys(weights||{})]));
  if(keys.length===0) return target===0?{}:{'sin asignar':target};
  const cleanWeights={};
  let weightTotal=0;
  keys.forEach(key=>{
    const weight=Math.abs(Number(weights&&weights[key])||0);
    cleanWeights[key]=weight;
    weightTotal+=weight;
  });
  if(weightTotal===0){
    keys.forEach(key=>{ cleanWeights[key]=1; });
    weightTotal=keys.length;
  }
  const out={};
  let allocated=0;
  keys.forEach(key=>{
    out[key]=Math.round(target*cleanWeights[key]/weightTotal);
    allocated+=out[key];
  });
  const delta=target-allocated;
  if(delta!==0){
    const lead=keys.slice().sort((a,b)=>cleanWeights[b]-cleanWeights[a])[0];
    out[lead]=(out[lead]||0)+delta;
  }
  return out;
}

function buildForecastPublicationSummary(baseRows,actualRows,base,state,activeMonths,closedMonths){
  const baseYear=resolveForecastBaseYear();
  const forecastYear=baseYear+1;
  const focusMonth=forecastSummaryFocusMonth(activeMonths);

  const keyResolver=d=>forecastPublicationGroupKey(getPublicacion(d));
  const baseDetail=buildForecastDimensionDetail(baseRows,keyResolver);
  const actualDetail=buildForecastDimensionDetail(actualRows,keyResolver);
  const objectivePlan=buildForecastChannelObjectivePlan(base,state,activeMonths);

  const tables=FORECAST_CHANNELS.map(canal=>{
    const metrics={};
    const ensure=key=>{
      if(!metrics[key]) metrics[key]=forecastDimensionMetricRecord();
      return metrics[key];
    };
    const keySet=forecastPublicationSeedKeys(canal);
    for(let m=1;m<=12;m++){
      Object.keys(baseDetail[m][canal]||{}).forEach(key=>keySet.add(key));
      Object.keys(actualDetail[m][canal]||{}).forEach(key=>keySet.add(key));
    }
    keySet.forEach(key=>{
      const info=ensure(key);
      for(let m=1;m<=12;m++) info.baseAnnual+=Number(forecastDimensionBucket(baseDetail,m,canal,key).total)||0;
    });

    for(let m=1;m<=12;m++){
      const isSimulationMonth=isPrevision&&m===focusMonth;
      const isClosed=closedMonths.has(m)&&!isSimulationMonth;
      const actualMap=forecastDimensionActualMap(actualRows,m,forecastYear,canal,keyResolver,isSimulationMonth);
      const extraSelection=!isClosed&&FORECAST_EXTRA.loaded?forecastExtraSelectionForMonth(m):{Digital:0,Print:0,Eventos:0,Programatica:0,byPublication:{}};
      const extraMap=forecastPublicationExtraMap(extraSelection,canal);
      Object.keys(actualMap).forEach(key=>keySet.add(key));
      Object.keys(extraMap).forEach(key=>keySet.add(key));
      Object.keys(baseDetail[m][canal]||{}).forEach(key=>keySet.add(key));
      const parts=getForecastMonthComponents(buildForecastBase(actualRows),state,closedMonths,m,base);
      const estimateKey=canal==='Digital'?'DigitalSinProgramatica':canal;
      const estimateTotal=Number(parts.estimate[estimateKey])||0;
      const allocation=forecastDimensionEstimateAllocation(estimateTotal,actualMap,baseDetail,m,canal,Array.from(keySet));
      const programmaticEstimateTotal=canal==='Digital'&&forecastDashboardMode==='calculator'?(Number(parts.estimate.Programatica)||0):0;
      const programmaticAllocation=forecastDimensionProgrammaticAllocation(programmaticEstimateTotal,actualMap,baseDetail,m,canal,Array.from(keySet));
      Object.keys(allocation).forEach(key=>keySet.add(key));
      Object.keys(programmaticAllocation).forEach(key=>keySet.add(key));
      keySet.forEach(key=>{
        const info=ensure(key);
        if(info.baseAnnual===0){
          for(let mm=1;mm<=12;mm++) info.baseAnnual+=Number(forecastDimensionBucket(baseDetail,mm,canal,key).total)||0;
        }
        if(!activeMonths.has(m)) return;
        const baseValue=Number(forecastDimensionBucket(baseDetail,m,canal,key).total)||0;
        const realValue=Number(actualMap[key]&&actualMap[key].total)||0;
        const forecastValue=Number(extraMap[key]&&extraMap[key].forecast)||0;
        const programmaticValue=canal==='Digital'?((Number(extraMap[key]&&extraMap[key].programmatic)||0)+(Number(programmaticAllocation[key])||0)):0;
        const estimateValue=Number(allocation[key])||0;
        info.baseSelected+=baseValue;
        info.realSelected+=realValue;
        info.forecastSelected+=forecastValue;
        info.programmaticSelected+=programmaticValue;
        info.estimateSelected+=estimateValue;
        info.projectedSelected+=realValue+forecastValue+programmaticValue+estimateValue;
      });
    }

    const rowsData=Array.from(keySet).map(key=>{
      const info=ensure(key);
      const annualObjective=forecastPublicationObjectiveForChannel(key,canal);
      const monthWeight=info.baseAnnual!==0?Math.max(0,Math.min(1,info.baseSelected/info.baseAnnual)):(activeMonths.size/12);
      const objectiveSelected=Number.isFinite(annualObjective)?annualObjective*monthWeight*(objectivePlan.scale||0):null;
      return {...info,key,label:forecastPublicationGroupLabel(key),objectiveSelected};
    }).filter(info=>{
      const values=[info.baseSelected,info.realSelected,info.forecastSelected,info.programmaticSelected,info.estimateSelected];
      return values.some(value=>Math.round(value)!==0)||Number.isFinite(info.objectiveSelected);
    }).sort((a,b)=>forecastPublicationSort(a.key,b.key));

    const totals=forecastDimensionMetricRecord();
    rowsData.forEach(info=>{
      ['baseSelected','realSelected','forecastSelected','programmaticSelected','estimateSelected','projectedSelected'].forEach(field=>{ totals[field]+=Number(info[field])||0; });
    });
    const objectiveTotal=forecastSelectedChannelObjective(objectivePlan,base,canal,activeMonths);
    return forecastDimensionRenderChannelTable({
      canal,primaryLabel:'Publicación Hearst',rowsData,totals,objectiveTotal,focusMonth,forecastYear,
      emptyLabel:'No hay publicaciones con datos para este canal.'
    });
  }).join('');

  const ruleText=mergeElleTravelIntoElle()
    ? `Elle Travel se integra en Elle mientras no tenga objetivo propio en la hoja vigente.`
    : `Elle Travel dispone de objetivo propio y se presenta como publicación independiente.`;
  const footnote=`<b>Cómo se calcula:</b> Ingreso y Real proceden del Excel de ventas. Forecast y Programática se leen directamente, publicación por publicación, del Excel mensual de Previsión. La Estimación conserva exactamente el total calculado para cada canal con el escenario seleccionado arriba y se reparte entre sus publicaciones según el Real disponible; si todavía no hay Real, utiliza el peso del año de referencia. Así, el total de cada tabla coincide con el ${isPrevision?'Resumen mensual por canal':'Detalle mensual'}. ${ruleText}`;
  return `<div class="forecast-table-block">
    <div class="forecast-section-title"><h2>Resumen por publicaciones Hearst</h2>${forecastPublicationRuleBadge()}</div>
    <div class="forecast-section-note" style="margin-top:7px;">Tres resúmenes independientes · mismas columnas y misma lógica que el bloque mensual</div>
    <div class="forecast-channel-summary-list">${tables}</div>
    <div class="forecast-footnote">${footnote}</div>
  </div>`;
}

function forecastSectorGroupKey(sector){
  return objectiveSectorKey(sector)||'sin sector';
}
function forecastSectorGroupLabel(key){
  if(key==='prevision extra sin sector') return 'PREVISIÓN SIN SECTOR ASIGNADO';
  if(key==='sin sector') return 'SIN SECTOR';
  if(key==='sin asignar') return 'SIN ASIGNAR';
  return OBJECTIVES.sectorLabels[key]||String(key||'SIN SECTOR').toUpperCase();
}
function forecastSectorSort(a,b){
  if(a==='prevision extra sin sector') return 1;
  if(b==='prevision extra sin sector') return -1;
  if(a==='sin sector'||a==='sin asignar') return 1;
  if(b==='sin sector'||b==='sin asignar') return -1;
  return forecastSectorGroupLabel(a).localeCompare(forecastSectorGroupLabel(b),'es');
}
function forecastSectorSeedKeys(canal,enabled){

}
function forecastSectorObjectiveForChannel(key,canal,enabled){
  if(!enabled||!OBJECTIVES.loaded||['sin sector','sin asignar','prevision extra sin sector'].includes(key)) return null;

  return Number.isFinite(value)?Number(value):null;
}
function forecastSectorExtraMap(extraSelection,canal){
  const forecast=Math.round(Number(extraSelection&&extraSelection[canal])||0);

function forecastProgrammaticSectorMap(year,month,useCutoff=false){
  const grouped={};
  DATA_PROG.filter(row=>Number(row.anio)===Number(year)&&Number(row.mes)===Number(month)).forEach(row=>{
    const key=forecastSectorGroupKey(row.sector);
    if(key==='sin sector'||key==='vendors') return;
    if(!OBJECTIVES.sectorLabels[key]) OBJECTIVES.sectorLabels[key]=String(row.sector||'').trim().toUpperCase();
    if(!grouped[key]) grouped[key]=[];
    grouped[key].push(row);
  });
  const out={};
  if(!useCutoff){
    Object.entries(grouped).forEach(([key,rows])=>{
      out[key]=rows.reduce((sum,row)=>sum+(Number(row.importe)||0),0);
    });
    return out;
  }
  const timing=forecastChannelTiming(month,year,'Digital');
  const cutoff=Math.min(Math.max(timing.asOfUtc,timing.periodStart),timing.periodEnd);
  Object.entries(grouped).forEach(([key,rows])=>{
    out[key]=forecastActualCumulativeAt(rows,cutoff,timing,'raw',0);
  });
  return out;
}
function forecastAdjustSectorBucket(bucket,delta){
  const target=bucket||forecastDimensionEmptyBucket();
  target.total=(Number(target.total)||0)+delta;
  target.programmatic=(Number(target.programmatic)||0)+delta;
  return target;
}
function forecastApplyProgrammaticToSectorDetail(detail,year){
  if(forecastSectorProgrammaticMode!=='with') return detail;
  const vendorKey=forecastSectorGroupKey('VENDORS');
  for(let month=1;month<=12;month++){
    const adjustments=forecastProgrammaticSectorMap(year,month,false);
    const digital=detail[month]&&detail[month].Digital;
    if(!digital) continue;
    Object.entries(adjustments).forEach(([sectorKey,amountRaw])=>{
      const amount=Number(amountRaw)||0;
      if(amount===0) return;
      digital[vendorKey]=forecastAdjustSectorBucket(digital[vendorKey],-amount);
      digital[sectorKey]=forecastAdjustSectorBucket(digital[sectorKey],amount);
    });
  }
  return detail;
}
function forecastApplyProgrammaticToSectorActualMap(actualMap,year,month,useCutoff){
  if(forecastSectorProgrammaticMode!=='with') return actualMap;
  const vendorKey=forecastSectorGroupKey('VENDORS');
  const adjustments=forecastProgrammaticSectorMap(year,month,useCutoff);
  Object.entries(adjustments).forEach(([sectorKey,amountRaw])=>{
    const amount=Number(amountRaw)||0;
    if(amount===0) return;
    actualMap[vendorKey]=forecastAdjustSectorBucket(actualMap[vendorKey],-amount);
    actualMap[sectorKey]=forecastAdjustSectorBucket(actualMap[sectorKey],amount);
  });
  return actualMap;
}

    content=`<div class="forecast-divider section-break publications"><span class="forecast-divider-label">Publicaciones Hearst</span></div>${buildForecastPublicationSummary(baseRows,actualRows,base,state,activeMonths,closedMonths)}`;
  }else if(forecastDeferredSection==='sectors'){
    content=`<div class="forecast-divider section-break sectors"><span class="forecast-divider-label">Sectores</span></div>${buildForecastSectorSummary(baseRows,actualRows,base,state,activeMonths,closedMonths)}`;
  }
  return content?`<div id="forecastDeferredContent" class="forecast-deferred-content">${content}</div>`:'';
}


function updateForecastFilterButtons(){
  const head=document.querySelector('.pub-filter-head');
  if(!head) return;
  const buttons=head.querySelectorAll('.mf-btn');
  if(buttons.length<2) return;
  const totalSelected=getSelectedPublicationCount();
  const allChipCount=document.querySelectorAll('#pubGroups .mf-chip').length;
  buttons[0].classList.toggle('active',false);
  buttons[1].classList.toggle('active',totalSelected===0||(allChipCount>0&&totalSelected===allChipCount));
}

// Esta declaración posterior sustituye al render del dashboard de Patrones de Ingreso.
function render(){
  const output=document.getElementById('output');
  updateDashboardModeUI();
  updateForecastFilterButtons();
  const totalRegistros=DATA.length+DATA_PROG.length;
  if(totalRegistros===0){
    output.innerHTML='<div class="forecast-empty"><p>📊 <b>Sin datos</b></p><p>Carga los Excel de ventas usando las tarjetas de arriba.</p></div>';
    return;
  }
  const baseYear=resolveForecastBaseYear();
  const rows=forecastRowsForYear(baseYear);
  if(forecastProductSelectionIsEmpty()){
    output.innerHTML='<div class="forecast-empty"><p>⚠️ <b>Sin productos seleccionados</b></p><p>Activa al menos un producto en cada canal que quieras incluir en la previsión.</p></div>';
    return;
  }
  if(rows.length===0){
    output.innerHTML='<div class="forecast-empty"><p>⚠️ <b>Sin ingreso de referencia</b></p><p>No hay registros para '+baseYear+' con la selección actual. Prueba con otro año, publicación o producto.</p></div>';
    return;
  }
  const base=buildForecastBase(rows);
  const actualRows=forecastRowsForYear(baseYear+1);
  const actual=buildForecastBase(actualRows);
  const closedMonths=forecastClosedMonths(baseYear+1);
  const state=loadForecastState(baseYear,base);
  const objectiveInfo=resolveForecastObjective(base);
  state.objective=objectiveInfo.value;
  const activeMonths=forecastMonthsActive();
  const isPrevision=forecastDashboardMode==='prevision';
  const focusMonthLabel=forecastMonthDisplay(forecastFocusMonth(activeMonths));
  const previsionSuffix=isPrevision?' · '+focusMonthLabel:'';
  const primaryTitle=isPrevision?'Configuración de la previsión'+previsionSuffix:'Configuración de la calculadora';
  const situationTitle=isPrevision?'Situación general · patrón histórico'+previsionSuffix:'Situación general · calculadora';
  output.innerHTML=`<div class="forecast-shell mode-${forecastDashboardMode}">
    <div class="forecast-entry-separator" aria-hidden="true"><span class="forecast-entry-symbol"></span></div>
    <div class="forecast-divider primary"><span class="forecast-divider-label">${primaryTitle}</span></div>
    ${buildForecastToolbar(baseYear,state,objectiveInfo,base,activeMonths)}
    ${isPrevision?'':buildForecastManualDetail(base,actual,state,activeMonths,closedMonths)}
    <div class="forecast-divider section-break situation"><span class="forecast-divider-label">${situationTitle}</span></div>
    ${buildForecastKpis(base,actual,state,activeMonths,closedMonths)}
    ${buildForecastDeferredNavigator(activeMonths)}
    ${buildForecastDeferredContent(rows,actualRows,base,state,activeMonths,closedMonths)}
  </div>`;
}



document.addEventListener('DOMContentLoaded',()=>{ forecastDashboardMode='calculator'; document.body.dataset.forecastMode='calculator'; updateDashboardModeUI(); autoLoadFromServer(); });
</script>
</body>
</html>
