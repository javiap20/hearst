;border-color:#c93434}.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(16,42,67,.48);z-index:9999;padding:30px;align-items:center;justify-content:center}.modal-backdrop.open{display:flex}.modal{width:min(900px,96vw);height:min(88vh,820px);max-height:calc(100vh - 80px);background:#fff;border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.22);overflow:hidden;display:flex;flex-direction:column}.modal-head{background:#102a43;color:#fff;padding:15px 20px;display:flex;align-items:center;justify-content:space-between}.modal-title{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.modal-close{border:0;background:transparent;color:#fff;font-size:24px;line-height:1;cursor:pointer}.modal-body{padding:18px 20px;overflow:auto;flex:1;min-height:0}.modal-summary{font-size:12px;color:#727783;text-align:center;margin-bottom:12px}.modal-body .total-row td{position:sticky;bottom:0;z-index:3;box-shadow:0 -2px 5px rgba(16,42,67,.10)}.portfolio-table{width:100%;border-collapse:collapse}.portfolio-table th{background:#f3f6fa;color:#102a43;font-size:11px;padding:10px;cursor:default}.portfolio-table td{padding:10px;border-bottom:1px solid #eceef3;text-align:right}.portfolio-table td:first-child,.portfolio-table th:first-child{text-align:left}.portfolio-table tfoot td{font-weight:800;background:#e9eef5;border-top:2px solid #102a43}.portfolio-delta.pos{color:#16833d}.portfolio-delta.neg{color:#c93434}.future-pill{display:inline-block;margin-left:8px;background:#eef5ff;color:#2864dc;border:1px solid #bfd3f5;border-radius:999px;padding:3px 8px;font-size:9px;font-weight:800;letter-spacing:.03em;cursor:help;vertical-align:1px}.future-pill:hover{background:#2864dc;color:#fff}.recovery-pill{display:inline-block;margin-left:8px;border-radius:999px;padding:3px 8px;font-size:9px;font-weight:800;letter-spacing:.03em;cursor:help;vertical-align:1px}.recovery-pill.recovered{background:#eef5ff;color:#2864dc;border:1px solid #bfd3f5}.recovery-pill.recovered:hover{background:#2864dc;color:#fff}.recovery-pill.partial{background:#fff6e8;color:#b56a00;border:1px solid #f1d39f}.recovery-pill.partial:hover{background:#d98300;color:#fff;border-color:#d98300}.adv-tooltip{position:fixed;display:none;z-index:10000;min-width:430px;max-width:540px;background:#102a43;color:#fff;border:1px solid #274a6b;border-radius:10px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);pointer-events:none;font-size:11px;line-height:1.45}.adv-tooltip.open{display:block}.adv-tooltip-title{font-size:12px;font-weight:800;margin-bottom:8px;text-align:center}.adv-tooltip-grid{display:grid;grid-template-columns:1fr auto auto;gap:5px 12px;align-items:center}.adv-tooltip-head{color:#b9c8d8;font-size:9px;font-weight:800;text-transform:uppercase}.adv-tooltip-channel{font-weight:700}.adv-tooltip-total{border-top:1px solid rgba(255,255,255,.24);padding-top:6px;margin-top:2px;font-weight:800}.adv-hover{cursor:help;border-bottom:1px dotted #8794a5}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.top{display:block}}</style><style id="tooltip-centered-values">

</div><script>
const PEOPLE=['ESTER IBAÑEZ','VANESA RUIZ TAPIADOR CASANOVA','GONZALO ROIBAS TARDUCHY','ANA ISABEL LOPEZ','MARIA JOSE CHICA','SOFIA JULIÀ TRIAY'];
const SOURCES=[
 {name:'Digital',url:'https://hearstspain-my.sharepoint.com/personal/japaricio_hearst_es/_layouts/15/download.aspx?share=IQBtUVlYDjlRRoCaM7gsBE1eATJ8miXAVtnTs6Qcuioee-Y'},
 {name:'Print',url:'https://hearstspain-my.sharepoint.com/personal/japaricio_hearst_es/_layouts/15/download.aspx?share=IQCgA4a20KbOTIY3RsToUyewAROi0viVXnYcoXICS4M0cNU'},
 {name:'Eventos',url:'https://hearstspain-my.sharepoint.com/personal/japaricio_hearst_es/_layouts/15/download.aspx?share=IQDZNkSJLhXFToC-uOPwQt-KAcAnft0wGr7bEwH4pJhzMoU'},
 {name:'Programática',url:'https://hearstspain-my.sharepoint.com/personal/japaricio_hearst_es/_layouts/15/download.aspx?share=IQBRiKDRGWyhSLPu93vPFOLmAWX_tVsvzvinkrrg8Iym2qE'}];
const MONTHS=['01 Enero','02 Febrero','03 Marzo','04 Abril','05 Mayo','06 Junio','07 Julio','08 Agosto','09 Septiembre','10 Octubre','11 Noviembre','12 Diciembre'];const SHORT=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];let rows=[],current=PEOPLE[0],sortKey='sales25',sortDir=-1,yearSel='2026',monthSel=new Set(MONTHS.slice(0,new Date().getMonth()+1));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
const money=n=>{const v=Math.round(Number(n)||0),sign=v<0?'-':'';return sign+String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' €'};
function findKey(o,cands){let ks=Object.keys(o), nk=ks.map(k=>[k,norm(k)]); for(const c of cands){let n=norm(c),x=nk.find(a=>a[1]===n)||nk.find(a=>a[1].includes(n));if(x)return x[0]}return null}
function num(v){if(typeof v==='number')return v;let s=String(v??'').replace(/\s/g,'').replace(/\./g,'').replace(',','.').replace(/[^0-9.-]/g,'');return Number(s)||0}
function monthName(v){let n=norm(v);let i=MONTHS.findIndex(m=>norm(m)===n||norm(m).includes(n)||n.includes(norm(m)));if(i>=0)return MONTHS[i];let m=String(v??'').match(/(?:^|\D)(1[0-2]|0?[1-9])(?:\D|$)/);return m?MONTHS[Number(m[1])-1]:''}
function yearOf(v){if(v instanceof Date)return v.getFullYear(); if(typeof v==='number'&&v>30000){let d=XLSX.SSF.parse_date_code(v);return d&&d.y} let m=String(v??'').match(/20(25|26)/);return m?Number(m[0]):null}
async function fetchBook(src){let r=await fetch(src.url+(src.url.includes('?')?'&':'?')+'_ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(src.name+' ('+r.status+')');let ab=await r.arrayBuffer();let wb=XLSX.read(ab,{type:'array',cellDates:true});let out=[];wb.SheetNames.forEach(sn=>{let a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:null,raw:true});a.forEach(x=>out.push({...x,__source:src.name,__sheet:sn}))});return out}
function standardize(raw){let out=[]; for(const o of raw){let kAdv=findKey(o,['ANUNCIANTE','CLIENTE','ADVERTISER','PROGR']);let kSales=findKey(o,['COMERCIAL','VENDEDOR','EJECUTIVO','SALES']);let kYear=findKey(o,['AÑO INSERCIÓN','AÑO','ANO','YEAR']);let kMonth=findKey(o,['MES INSERCIÓN','MES','MONTH']);let kDate=findKey(o,['FECHA','DATE']);let isProg=o.__source==='Programática';let kAmtActual=isProg?findKey(o,['IMP.NETO A COMISIONAR','IMP NETO A COMISIONAR','IMPORTE NETO A COMISIONAR']):findKey(o,['INGRESO','IMPORTE','NETO','TOTAL','FACTURACION','FACTURACIÓN']);let kAmtAnt=isProg?findKey(o,['IMP.NETO ANT.','IMP.NETO ANT','IMP NETO ANT','IMPORTE NETO ANT']):null;if(!kAdv||(!kAmtActual&&!kAmtAnt))continue;let adv=String(o[kAdv]??'').trim();if(!adv)continue;let y=kYear?Number(o[kYear]):(kDate?yearOf(o[kDate]):yearOf(o.__sheet));if(y!==2025&&y!==2026)continue;let month=kMonth?monthName(o[kMonth]):'';if(!month&&kDate){let dv=o[kDate];let d=dv instanceof Date?dv:null;if(d)month=MONTHS[d.getMonth()]}let amt=isProg?(y===2026?num(kAmtActual?o[kAmtActual]:0):num(kAmtAnt?o[kAmtAnt]:0)):num(o[kAmtActual]);out.push({adv,advN:norm(adv),sales:kSales?String(o[kSales]??'').trim():'',salesN:kSales?norm(o[kSales]):'',amt,year:y,month,source:o.__source})} return out}
async function loadAll(){document.getElementById('status').textContent='Cargando SharePoint…';document.getElementById('err').style.display='none';try{let packs=await Promise.all(SOURCES.map(fetchBook));rows=standardize(packs.flat());document.getElementById('status').textContent=rows.length.toLocaleString('es-ES')+' líneas leídas · '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});render()}catch(e){document.getElementById('err').textContent='No se pudieron cargar los Excel directamente. Abre el HTML con tu sesión de Microsoft/SharePoint iniciada. Detalle: '+e.message;document.getElementById('err').style.display='block';document.getElementById('status').textContent='Error de carga'}}
function dataFor(person){let pn=norm(person), map=new Map(),cur=Number(yearSel),prev=cur-1;for(const r of rows){if(!monthSel.has(r.month))continue;let x=map.get(r.advN)||{name:r.adv,sales25:0,sales26:0,total25:0,total26:0};if(r.year===prev){x.total25+=r.amt;if(r.salesN===pn)x.sales25+=r.amt}else if(r.year===cur){x.total26+=r.amt;if(r.salesN===pn)x.sales26+=r.amt}else continue;map.set(r.advN,x)}return [...map.values()].filter(x=>x.sales25>=1||x.sales26>=1).map(x=>({...x,delta:x.sales26-x.sales25}))}
function renderFilters(){let ys=[...new Set(rows.map(r=>r.year))].sort((a,b)=>b-a);if(!ys.includes(Number(yearSel))&&ys.length)yearSel=String(ys[0]);document.getElementById('years').innerHTML=ys.map(y=>`<button class="chip ${String(y)===yearSel?'active':''}" onclick="yearSel='${y}';render()">${y}</button>`).join('');document.getElementById('months').innerHTML=MONTHS.map((m,i)=>`<button class="chip ${monthSel.has(m)?'active':''}" onclick="toggleMonth('${m}')">${SHORT[i]}</button>`).join('')}function toggleMonth(m){monthSel.has(m)?monthSel.delete(m):monthSel.add(m);render()}function setMonths(a){monthSel=new Set(a);render()}document.getElementById('monthsAll').onclick=()=>setMonths(MONTHS);document.getElementById('monthsNone').onclick=()=>setMonths([]);document.getElementById('monthsClosed').onclick=()=>setMonths(MONTHS.slice(0,new Date().getMonth()));
function render(){renderFilters();let curY=Number(yearSel),prevY=curY-1,pnFixed=new Set(PEOPLE.map(norm)),byCom=new Map();for(const r of rows){if(!monthSel.has(r.month)||!r.salesN||pnFixed.has(r.salesN)||(r.year!==curY&&r.year!==prevY))continue;let x=byCom.get(r.salesN)||{name:r.sales,y0:0,y1:0};if(r.year===prevY)x.y0+=r.amt;else if(r.year===curY)x.y1+=r.amt;byCom.set(r.salesN,x)}let others=[...byCom.values()].filter(x=>x.y0>=1&&x.y1>=1).sort((a,b)=>a.name.localeCompare(b.name,'es'));let currentIsFixed=PEOPLE.some(p=>norm(p)===norm(current)),currentOther=others.find(x=>norm(x.name)===norm(current));if(!currentIsFixed&&!currentOther){current=PEOPLE[0];currentIsFixed=true}document.getElementById('tabs').innerHTML=PEOPLE.map((p,i)=>`<button class="tab ${norm(p)===norm(current)?'active':''}" data-person="${i}">${p}</button>`).join('')+`<select id="otherCommercial" class="other-select ${!currentIsFixed?'active':''}"><option value="">Otros comerciales (${others.length})</option>${others.map(x=>`<option value="${x.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" ${norm(x.name)===norm(current)?'selected':''}>${x.name}</option>`).join('')}</select>`;document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{current=PEOPLE[Number(b.dataset.person)];render()});let os=document.getElementById('otherCommercial');if(os)os.onchange=()=>{if(os.value){current=os.value;render()}};let d=dataFor(current),old=d.filter(x=>x.sales25>=1),c25=old.reduce((s,x)=>s+x.sales25,0),oldC26=old.reduce((s,x)=>s+x.sales26,0),commercialDelta=oldC26-c25,allC26=d.reduce((s,x)=>s+x.sales26,0),totalDelta=allC26-c25;document.getElementById('commercialEvolutionTitle').textContent=`EVOLUCIÓN DE ${current} ESTE ${curY} vs. ${prevY}`;document.getElementById('cards').innerHTML=`<div class="card"><div class="muted">Ingreso comercial ${prevY}</div><div class="val">${money(c25)}</div><div class="muted" style="margin-top:9px;line-height:1.4">Lo vendido por ${current.split(/\s+/)[0]} en ${prevY} a los anu function portfolioRows(){let pn=norm(current),cur=Number(yearSel),prev=cur-1,oldNames=new Set();for(const r of rows){if(monthSel.has(r.month)&&r.year===prev&&r.salesN===pn&&r.amt>=0)oldNames.add(r.advN)}let map=new Map();for(const r of rows){if(!monthSel.has(r.month)||!oldNames.has(r.advN)||(r.year!==prev&&r.year!==cur))continue;let x=map.get(r.advN)||{name:r.adv,y0:0,y1:0,channels:{}};let ch=r.source||'Otros';if(!x.channels[ch])x.channels[ch]={y0:0,y1:0};if(r.year===prev){x.y0+=r.amt;x.channels[ch].y0+=r.amt}else{x.y1+=r.amt;x.channels[ch].y1+=r.amt}map.set(r.advN,x)}return [...map.values()].map(x=>({...x,delta:x.y1-x.y0})).sort((a,b)=>b.y0-a.y0)}

function laterIncomeComparison(advN){let cur=Number(yearSel),prev=cur-1,selectedIdx=MONTHS.map((m,i)=>monthSel.has(m)?i:-1).filter(i=>i>=0),lastIdx=selectedIdx.length?Math.max(...selectedIdx):-1,m0=new Map(),m1=new Map();for(const r of rows){let mi=MONTHS.indexOf(r.month);if(r.advN!==advN||mi<=lastIdx||r.amt===0)continue;if(r.year===prev)m0.set(mi,(m0.get(mi)||0)+r.amt);else if(r.year===cur)m1.set(mi,(m1.get(mi)||0)+r.amt)}let later0=[...m0.entries()].filter(([,v])=>v!==0).sort((a,b)=>a[0]-b[0]),later1=[...m1.entries()].filter(([,v])=>v!==0).sort((a,b)=>a[0]-b[0]);return {later0,later1,sum0:later0.reduce((s,[,v])=>s+v,0),sum1:later1.reduce((s,[,v])=>s+v,0)}}
