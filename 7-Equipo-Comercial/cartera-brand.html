<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Análisis cartera comerciales · V1</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>body{font-family:Arial,sans-serif;background:#f5f6fa;color:#20232a;margin:0}.wrap{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end}.muted{color:#727783;font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab{border:1px solid #d9dce5;background:white;border-radius:18px;padding:8px 13px;cursor:pointer}.tab.active{background:#2864dc;color:white;border-color:#2864dc}.other-select{border:1px solid #d9dce5;background:#fff;border-radius:18px;padding:8px 30px 8px 13px;font-size:13px;cursor:pointer;color:#20232a;max-width:280px}.other-select.active{background:#2864dc;color:#fff;border-color:#2864dc}.cards{display:grid;grid-template-columns:repeat(3,minmax(240px,360px));gap:12px;margin:0 auto 16px;justify-content:center}.card{background:white;border:1px solid #e2e4eb;border-radius:12px;padding:15px;text-align:center}.val{font-size:23px;font-weight:700;margin-top:6px}.filters{background:white;border:1px solid #e2e4eb;border-radius:12px;padding:14px 16px;margin:14px 0}.filterrow{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}.label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#727783;font-weight:800;margin-bottom:8px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip,.action{border:1px solid #dce2ea;background:#fff;color:#536077;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:700;cursor:pointer}.chip.active{background:#2864dc;border-color:#2864dc;color:#fff}.monthbox{flex:1}.monthline{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.actions{display:flex;gap:5px;margin-left:auto}.toolbar{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:14px 0}.toolbar>label{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;justify-self:center}.toolbar>label input{margin:0}.toolbar .status{justify-self:end}.toolbar>input{padding:9px 12px;border:1px solid #d8dbe4;border-radius:8px;min-width:300px}.toolbar>label input[type="checkbox"]{padding:0;min-width:0;width:14px;height:14px;margin:0}.status{margin-left:auto;font-size:12px;color:#707582}.tablebox{background:white;border:1px solid #e2e4eb;border-radius:12px;overflow:visible}.tablebox thead th{background:#102a43;color:#fff;padding-top:17px;padding-bottom:17px;font-size:11px;letter-spacing:.035em;border-bottom-color:#102a43}.tablebox thead th:hover{background:#173b5e}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 12px;border-bottom:1px solid #eceef3;text-align:center;white-space:nowrap}th{background:#f7f8fb;cursor:pointer}th:first-child,td:first-child{text-align:center;background:inherit}tr:hover td{background:#fafbff}.pos{color:#16833d}.neg{color:#c93434}.commercial25{color:#2864dc;font-weight:700}.commercial26{color:#2864dc!important;font-weight:700}.drop-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d73737;margin-left:7px;vertical-align:1px}.total-row td{background:#e9eef5!important;border-top:3px solid #102a43;border-bottom:0;padding-top:17px;padding-bottom:17px;font-weight:800;font-size:14px}.total-row:hover td{background:#e9eef5!important}.total-label{letter-spacing:.06em;color:#102a43}.pill{font-size:11px;padding:2px 6px;border-radius:8px;background:#eef2ff;color:#3457b1;margin-left:5px}.err{background:#fff2f2;color:#a51f1f;padding:10px;border-radius:8px;margin:8px 0;display:none}.footprint{max-width:1092px;margin:0 auto 18px;background:#fff;border:1px solid #e2e4eb;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(16,42,67,.04)}.footprint-head{background:#102a43;color:#fff;padding:14px 22px;text-align:center}.footprint-title{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.footprint-body{padding:20px 24px 22px;text-align:center}.footprint-val{font-size:29px;font-weight:800;margin-bottom:16px}.footprint-bases{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:15px}.footprint-base{min-width:280px;background:#f7f8fb;border:1px solid #e8ebf1;border-radius:10px;padding:11px 16px}.footprint-base b{display:block;font-size:17px;margin-top:4px}.footprint-formula{font-size:12px;color:#5f6673;line-height:1.65;background:#fafbfc;border-radius:9px;padding:11px 14px;max-width:820px;margin:0 auto 14px}.footprint-question{font-size:13px;font-weight:800;color:#20232a;margin:5px 0 6px}.footprint-answer{font-size:13px;line-height:1.55;font-weight:600;max-width:1040px;margin:auto}@media(max-width:900px){.cards{grid-template-columns:1fr 1fr}.top{display:block}}</style></head><body><div class="wrap">
<div class="top"><div><h1 style="margin:0">Análisis de cartera comercial</h1><div class="muted">Comparativa de cartera · datos cargados automáticamente desde SharePoint</div></div><button onclick="loadAll()" class="tab">↻ Actualizar datos</button></div>
<div id="err" class="err"></div><div class="filters"><div class="filterrow"><div><div class="label">Año</div><div id="years" class="chips"></div></div><div class="monthbox"><div class="label">Mes</div><div class="monthline"><div id="months" class="chips"></div><div class="actions"><button class="action" id="monthsAll">Todos</button><button class="action" id="monthsNone">Ninguno</button><button class="action" id="monthsClosed">Meses finalizados</button></div></div></div></div></div><div class="tabs" id="tabs"></div><div class="cards" id="cards"></div><div id="footprint"></div>
<div class="toolbar"><input id="q" placeholder="Buscar anunciante…" oninput="render()"><label><input type="checkbox" id="onlyOld" onchange="render()"> Solo cartera 2025</label><div class="status" id="status">Preparando…</div></div>
<div class="tablebox"><table><thead><tr><th onclick="sortBy('name')">Anunciante</th><th onclick="sortBy('sales25')">Comercial 2025</th><th onclick="sortBy('total25')">Total anunciante 2025</th><th onclick="sortBy('total26')">Total anunciante 2026 (comercial)</th><th onclick="sortBy('delta')">Evolución comercial</th></tr></thead><tbody id="body"></tbody></table></div>
</div><script>
const PEOPLE=['ESTER IBAÑEZ','VANESA RUIZ TAPIADOR CASANOVA','GONZALO ROIBAS TARDUCHY','ANA ISABEL LOPEZ','MARIA JOSE CHICA','SOFIA JULIÀ TRIAY'];
const SOURCES=[
 {name:'Digital',url:'https://hearstspain-my.sharepoint.com/personal/japaricio_hearst_es/_layouts/15/download.aspx?share=IQBtUVlYDjlRRoCaM7gsBE1eATJ8miXAVtnTs6Qcuioee-Y'},
 {name:'Print',url:'https://hearstspain-my.sharepoint.com/personal/japaricio_hearst_es/_layouts/15/download.aspx?share=IQCgA4a20KbOTIY3RsToUyewAROi0viVXnYcoXICS4M0cNU'},
 {name:'Eventos',url:'https://hearstspain-my.sharepoint.com/personal/japaricio_hearst_es/_layouts/15/download.aspx?share=IQDZNkSJLhXFToC-uOPwQt-KAcAnft0wGr7bEwH4pJhzMoU'},
 {name:'Programática',url:'https://hearstspain-my.sharepoint.com/personal/japaricio_hearst_es/_layouts/15/download.aspx?share=IQBRiKDRGWyhSLPu93vPFOLmAWX_tVsvzvinkrrg8Iym2qE'}];
const MONTHS=['01 Enero','02 Febrero','03 Marzo','04 Abril','05 Mayo','06 Junio','07 Julio','08 Agosto','09 Septiembre','10 Octubre','11 Noviembre','12 Diciembre'];const SHORT=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];let rows=[],current=PEOPLE[0],sortKey='sales25',sortDir=-1,yearSel='2026',monthSel=new Set(MONTHS.slice(0,new Date().getMonth()+1));
const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toUpperCase();
const money=n=>{const v=Math.round(Number(n)||0),sign=v<0?'-':'';return sign+String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' €'};
function findKey(o,cands){let ks=Object.keys(o), nk=ks.map(k=>[k,norm(k)]); for(const c of cands){let n=norm(c),x=nk.find(a=>a[1]===n)||nk.find(a=>a[1].includes(n));if(x)return x[0]}return null}
function num(v){if(typeof v==='number')return v;let s=String(v??'').replace(/\s/g,'').replace(/\./g,'').replace(',','.').replace(/[^0-9.-]/g,'');return Number(s)||0}
function monthName(v){let n=norm(v);let i=MONTHS.findIndex(m=>norm(m)===n||norm(m).includes(n)||n.includes(norm(m)));if(i>=0)return MONTHS[i];let m=String(v??'').match(/(?:^|\D)(1[0-2]|0?[1-9])(?:\D|$)/);return m?MONTHS[Number(m[1])-1]:''}
function yearOf(v){if(v instanceof Date)return v.getFullYear(); if(typeof v==='number'&&v>30000){let d=XLSX.SSF.parse_date_code(v);return d&&d.y} let m=String(v??'').match(/20(25|26)/);return m?Number(m[0]):null}
async function fetchBook(src){let r=await fetch(src.url+(src.url.includes('?')?'&':'?')+'_ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(src.name+' ('+r.status+')');let ab=await r.arrayBuffer();let wb=XLSX.read(ab,{type:'array',cellDates:true});let out=[];wb.SheetNames.forEach(sn=>{let a=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:null,raw:true});a.forEach(x=>out.push({...x,__source:src.name,__sheet:sn}))});return out}
function standardize(raw){let out=[]; for(const o of raw){let kAdv=findKey(o,['ANUNCIANTE','CLIENTE','ADVERTISER','PROGR']);let kSales=findKey(o,['COMERCIAL','VENDEDOR','EJECUTIVO','SALES']);let kAmt=findKey(o,['INGRESO','IMPORTE','NETO','TOTAL','FACTURACION','FACTURACIÓN']);let kYear=findKey(o,['AÑO INSERCIÓN','AÑO','ANO','YEAR']);let kMonth=findKey(o,['MES INSERCIÓN','MES','MONTH']);let kDate=findKey(o,['FECHA','DATE']); if(!kAdv||!kAmt)continue;let adv=String(o[kAdv]??'').trim();if(!adv)continue;let y=kYear?Number(o[kYear]):(kDate?yearOf(o[kDate]):yearOf(o.__sheet));if(y!==2025&&y!==2026)continue;let month=kMonth?monthName(o[kMonth]):'';if(!month&&kDate){let dv=o[kDate];let d=dv instanceof Date?dv:null;if(d)month=MONTHS[d.getMonth()]}out.push({adv,advN:norm(adv),sales:kSales?String(o[kSales]??'').trim():'',salesN:kSales?norm(o[kSales]):'',amt:num(o[kAmt]),year:y,month,source:o.__source})} return out}
async function loadAll(){document.getElementById('status').textContent='Cargando SharePoint…';document.getElementById('err').style.display='none';try{let packs=await Promise.all(SOURCES.map(fetchBook));rows=standardize(packs.flat());document.getElementById('status').textContent=rows.length.toLocaleString('es-ES')+' líneas leídas · '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});render()}catch(e){document.getElementById('err').textContent='No se pudieron cargar los Excel directamente. Abre el HTML con tu sesión de Microsoft/SharePoint iniciada. Detalle: '+e.message;document.getElementById('err').style.display='block';document.getElementById('status').textContent='Error de carga'}}
function dataFor(person){let pn=norm(person), map=new Map(),cur=Number(yearSel),prev=cur-1;for(const r of rows){if(!monthSel.has(r.month))continue;let x=map.get(r.advN)||{name:r.adv,sales25:0,sales26:0,total25:0,total26:0};if(r.year===prev){x.total25+=r.amt;if(r.salesN===pn)x.sales25+=r.amt}else if(r.year===cur){x.total26+=r.amt;if(r.salesN===pn)x.sales26+=r.amt}else continue;map.set(r.advN,x)}return [...map.values()].filter(x=>x.sales25>=1||x.sales26>=1).map(x=>({...x,delta:x.sales26-x.sales25}))}
function renderFilters(){let ys=[...new Set(rows.map(r=>r.year))].sort((a,b)=>b-a);if(!ys.includes(Number(yearSel))&&ys.length)yearSel=String(ys[0]);document.getElementById('years').innerHTML=ys.map(y=>`<button class="chip ${String(y)===yearSel?'active':''}" onclick="yearSel='${y}';render()">${y}</button>`).join('');document.getElementById('months').innerHTML=MONTHS.map((m,i)=>`<button class="chip ${monthSel.has(m)?'active':''}" onclick="toggleMonth('${m}')">${SHORT[i]}</button>`).join('')}function toggleMonth(m){monthSel.has(m)?monthSel.delete(m):monthSel.add(m);render()}function setMonths(a){monthSel=new Set(a);render()}document.getElementById('monthsAll').onclick=()=>setMonths(MONTHS);document.getElementById('monthsNone').onclick=()=>setMonths([]);document.getElementById('monthsClosed').onclick=()=>setMonths(MONTHS.slice(0,new Date().getMonth()));
function render(){renderFilters();let curY=Number(yearSel),prevY=curY-1,pnFixed=new Set(PEOPLE.map(norm)),byCom=new Map();for(const r of rows){if(!monthSel.has(r.month)||!r.salesN||pnFixed.has(r.salesN)||(r.year!==curY&&r.year!==prevY))continue;let x=byCom.get(r.salesN)||{name:r.sales,y0:0,y1:0};if(r.year===prevY)x.y0+=r.amt;else if(r.year===curY)x.y1+=r.amt;byCom.set(r.salesN,x)}let others=[...byCom.values()].filter(x=>x.y0>=1&&x.y1>=1).sort((a,b)=>a.name.localeCompare(b.name,'es'));let currentIsFixed=PEOPLE.some(p=>norm(p)===norm(current)),currentOther=others.find(x=>norm(x.name)===norm(current));if(!currentIsFixed&&!currentOther){current=PEOPLE[0];currentIsFixed=true}document.getElementById('tabs').innerHTML=PEOPLE.map((p,i)=>`<button class="tab ${norm(p)===norm(current)?'active':''}" data-person="${i}">${p}</button>`).join('')+`<select id="otherCommercial" class="other-select ${!currentIsFixed?'active':''}"><option value="">Otros comerciales (${others.length})</option>${others.map(x=>`<option value="${x.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" ${norm(x.name)===norm(current)?'selected':''}>${x.name}</option>`).join('')}</select>`;document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{current=PEOPLE[Number(b.dataset.person)];render()});let os=document.getElementById('otherCommercial');if(os)os.onchange=()=>{if(os.value){current=os.value;render()}};let d=dataFor(current),old=d.filter(x=>x.sales25>=1),c25=old.reduce((s,x)=>s+x.sales25,0),oldC26=old.reduce((s,x)=>s+x.sales26,0),commercialDelta=oldC26-c25,allC26=d.reduce((s,x)=>s+x.sales26,0),totalDelta=allC26-c25;document.getElementById('cards').innerHTML=`<div class="card"><div class="muted">Ingreso comercial 2025</div><div class="val">${money(c25)}</div></div><div class="card"><div class="muted">Evolución comercial · cartera 2025</div><div class="val ${commercialDelta>=0?'pos':'neg'}">${commercialDelta>=0?'+':''}${money(commercialDelta)}</div></div><div class="card"><div class="muted">Evolución comercial total 2026 vs. 2025</div><div class="val ${totalDelta>=0?'pos':'neg'}">${totalDelta>=0?'+':''}${money(totalDelta)}</div></div>`;let oldTotal25=old.reduce((s,x)=>s+x.total25,0),oldTotal26=old.reduce((s,x)=>s+x.total26,0),portfolioDelta=oldTotal26-oldTotal25,portfolioPct=oldTotal25?portfolioDelta/Math.abs(oldTotal25)*100:0,weightPct=oldTotal25?c25/oldTotal25*100:0,shortName=current.split(/\s+/)[0],py=Number(yearSel)-1,pctFmt=n=>{let v=Math.abs(n).toFixed(1).replace('.',',');return (n>=0?'+':'-')+v+'%'};document.getElementById('footprint').innerHTML=`<div class="footprint"><div class="footprint-head"><div class="footprint-title">Evolución de la antigua cartera · ${py} → ${yearSel}</div></div><div class="footprint-body"><div class="footprint-val ${portfolioDelta>=0?'pos':'neg'}">${portfolioDelta>=0?'+':''}${money(portfolioDelta)} · ${pctFmt(portfolioPct)}</div><div class="footprint-bases"><div class="footprint-base"><span class="muted">Ingreso Hearst ${py} · anunciantes de ${shortName}</span><b>${money(oldTotal25)}</b></div><div class="footprint-base"><span class="muted">Ingreso Hearst ${yearSel} · mismos anunciantes</span><b>${money(oldTotal26)}</b></div><div class="footprint-base"><span class="muted">Peso de ${shortName} en esa cartera ${py}</span><b>${weightPct.toFixed(1).replace('.',',')}%</b></div></div><div class="footprint-formula"><b>Fórmula:</b> Total Hearst ${yearSel} de los anunciantes que tenía ${shortName} en ${py} − Total Hearst ${py} de esos mismos anunciantes.<br>${money(oldTotal26)} − ${money(oldTotal25)} = <b>${portfolioDelta>=0?'+':''}${money(portfolioDelta)} (${pctFmt(portfolioPct)})</b><br><span class="muted">Referencia: ${shortName} aportaba ${money(c25)} de ${money(oldTotal25)} en ${py} (${weightPct.toFixed(1).replace('.',',')}%).</span></div><div class="footprint-question">¿Qué ha pasado con el valor total para Hearst de la cartera que tenía ${shortName} en ${py}?</div><div class="footprint-answer ${portfolioDelta>=0?'pos':'neg'}">${portfolioDelta>=0?`Ha aumentado. Los mismos anunciantes generan ahora ${money(Math.abs(portfolioDelta))} más para Hearst (${pctFmt(portfolioPct)}). ${shortName} representaba el ${weightPct.toFixed(1).replace('.',',')}% del ingreso de esta cartera en ${py}. El dato no demuestra causalidad, pero permite valorar si el cambio de cartera coincide con una mejora o deterioro del grupo.`:`Ha disminuido. Los mismos anunciantes generan ahora ${money(Math.abs(portfolioDelta))} menos para Hearst (${pctFmt(portfolioPct)}). ${shortName} representaba el ${weightPct.toFixed(1).replace('.',',')}% del ingreso de esta cartera en ${py}. El dato no demuestra causalidad, pero permite valorar si el cambio de cartera coincide con una mejora o deterioro del grupo.`}</div></div></div>`;let q=norm(document.getElementById('q').value),only=document.getElementById('onlyOld').checked;d=d.filter(x=>(!q||norm(x.name).includes(q))&&(!only||x.sales25>=1));d.sort((a,b)=>{let A=a[sortKey],B=b[sortKey];if(typeof A==='string')return A.localeCompare(B)*sortDir;return (A-B)*sortDir});let tSales25=d.reduce((s,x)=>s+x.sales25,0),tTotal25=d.reduce((s,x)=>s+x.total25,0),tTotal26=d.reduce((s,x)=>s+x.total26,0),tSales26=d.reduce((s,x)=>s+x.sales26,0),tDelta=d.reduce((s,x)=>s+x.delta,0);document.getElementById('body').innerHTML=d.map(x=>`<tr><td>${x.name}${x.sales25<1&&x.sales26>=1?'<span class="pill">NUEVO 2026</span>':''}</td><td class="commercial25">${money(x.sales25)}</td><td>${money(x.total25)}</td><td>${money(x.total26)}${x.total26<x.total25?'<span class="drop-dot" title="Total anunciante 2026 inferior a 2025"></span>':''} <span class="commercial26">(${money(x.sales26)})</span></td><td class="${x.delta>=0?'pos':'neg'}">${x.delta>=0?'+':''}${money(x.delta)}</td></tr>`).join('')+`<tr class="total-row"><td class="total-label">TOTAL</td><td class="commercial25">${money(tSales25)}</td><td>${money(tTotal25)}</td><td>${money(tTotal26)} <span class="commercial26">(${money(tSales26)})</span></td><td class="${tDelta>=0?'pos':'neg'}">${tDelta>=0?'+':''}${money(tDelta)}</td></tr>`}
function sortBy(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=-1}render()}loadAll();
</script></body></html>
